name: Android CI

# 构建 + 发布：push 到 main 出 beta 包，push 到 nightly 出 dev 包，产物直挂 GitHub Release。
# PR 只跑门禁与构建，不发布。

on:
  push:
    branches: [main, nightly]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: "发布渠道（手动触发时生效）"
        type: choice
        options: [beta, dev]
        default: beta

# 最小权限：只读代码 + 写 Release
permissions:
  contents: write

# 同一分支的构建排队执行，不并发抢 tag；不取消进行中的发布。
# group 不带分支名是刻意的：dev 与 beta 共用 version.properties 这一个计数器，
# 两条流水线必须串行读-自增-回写，否则会拿到同一个号。
concurrency:
  group: android-build-release
  cancel-in-progress: false

jobs:
  build:
    name: Build + Release (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # 渠道判定：手动触发用输入值，否则 nightly 分支 = dev，其余 = beta
      CHANNEL: ${{ github.event.inputs.channel || (github.ref_name == 'nightly' && 'dev' || 'beta') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        # compileOptions / jvmTarget 均为 17，AGP 8.13 最低要求也是 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle cache
        # 只缓存 Gradle 用户目录（依赖与 wrapper），不缓存 app/build
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore fixed debug keystore
        # 签名基线：本机 hpa-publish 用的就是 Android 默认 debug keystore
        #   %USERPROFILE%\.android\debug.keystore
        #   alias=androiddebugkey，storepass/keypass=android
        #   SHA-256 2B:67:B9:1A:73:EB:7D:4E:6A:9C:E7:FF:A2:5D:8A:07:
        #           8F:66:2A:C2:3D:65:C5:47:08:D2:95:96:4D:3C:BE:ED
        # 把同一份文件 base64 后存进 DEBUG_KEYSTORE_B64，CI 与本地才能同包名同签名，
        # 新旧包可互相覆盖安装；否则每次 runner 都会新建随机签名，只能先卸载再装。
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
          DEBUG_KEYSTORE_PASS: ${{ secrets.DEBUG_KEYSTORE_PASS }}
        run: |
          KS="$HOME/.android/debug.keystore"
          mkdir -p "$(dirname "$KS")"
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > "$KS"
            PASS="${DEBUG_KEYSTORE_PASS:-android}"
            if ! keytool -list -keystore "$KS" -storepass "$PASS" -alias androiddebugkey >/dev/null 2>&1; then
              echo "::error::固定 debug keystore 还原后校验失败（内容或 DEBUG_KEYSTORE_PASS 不对）"
              exit 1
            fi
            echo "已还原固定 debug keystore："
            keytool -list -v -keystore "$KS" -storepass "$PASS" -alias androiddebugkey | grep -E 'SHA256:'
          else
            # 绝不静默换签名：让 run 明确告诉下载者「这一版覆盖不了旧版」。
            echo "::warning title=签名与历史不一致::未配置 DEBUG_KEYSTORE_B64，本次改用 runner 临时生成的 debug keystore。"
            echo "::warning::本次签名与历史不一致，包不能覆盖安装（需先卸载旧版）。"
            {
              echo "## ⚠️ 签名与历史不一致"
              echo
              echo "本次构建没有 \`DEBUG_KEYSTORE_B64\`，用的是 runner 上临时生成的 debug keystore。"
              echo "**本次签名与历史不一致，包不能覆盖安装**——安装前请先卸载旧版本。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Detekt (static analysis)
        # 任务名必须带 :app 前缀：detekt 配置与基线只挂在 :app 上，
        # 跑根项目的 `detekt` 不带基线路径，存量问题会全量报错。
        #
        # 只报告、不阻断出包：当前还有 515 条存量问题（MagicNumber 193、
        # MaxLineLength 122、ReturnCount 61…），大多是历史文件（CapabilitySpec.kt、
        # ExecutionPhase.kt 等）在基线生成之后新增的。清理完之前它不该挡住产包，
        # 报告仍随 artifact 上传；清理后把 continue-on-error 去掉即可恢复阻断。
        continue-on-error: true
        run: ./gradlew :app:detekt --stacktrace

      - name: Detekt baseline guard (fail if exemptions grow)
        # 基线只减不增的守卫是确定性的（当前 1543 条 = 记录值），保留阻断
        run: ./gradlew :app:checkDetektBaseline --stacktrace

      - name: Unit Tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Unit Test Coverage Report
        run: ./gradlew :app:createDebugUnitTestCoverageReport --stacktrace

      - name: Lint
        # 存量 lint 问题（MissingPermission 等）尚未清理完，暂不阻断出包；
        # 报告仍会上传，修复后再改为阻断
        continue-on-error: true
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Compute version + tag
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 版本号只有一条递增序列：仓库根 version.properties 的 BUILD_NUMBER，
          # 本机构建（root build.gradle.kts）也是读写同一个文件。
          # 权威副本固定在 nightly 分支——beta 也读它的值，避免两条分支各长一个计数器。
          COUNTER=$(gh api "repos/$GITHUB_REPOSITORY/contents/version.properties?ref=nightly" \
            -H "Accept: application/vnd.github.raw" | grep -E '^BUILD_NUMBER=' | cut -d= -f2 | tr -d '[:space:]')
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/version.properties?ref=nightly" --jq .sha)
          if ! [ "$COUNTER" -ge 0 ] 2>/dev/null; then
            echo "读不到 version.properties 的 BUILD_NUMBER（值：$COUNTER）" >&2
            exit 1
          fi
          CODE=$((COUNTER + 1))
          echo "counter=$COUNTER" >> "$GITHUB_OUTPUT"
          echo "counter_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=0.2.$CODE-$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "tag=v0.2.$CODE-$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "apk=HappyAgent-0.2.$CODE-$CHANNEL.apk" >> "$GITHUB_OUTPUT"
          echo "本次版本：0.2.$CODE-$CHANNEL（计数器 $COUNTER -> $CODE）"

      - name: Sync provider + env assets
        # provider.apk / 编码环境 APK 都是模块构建产物，不进仓库（.gitignore），
        # 干净检出后 assets 里只剩 version.txt，verifyProviderAssets 会直接拦下。
        # 先由各自模块构建并同步进 assets，再走 assemble。
        run: ./gradlew :app:syncProviderAssets :app:syncEnvAssets --stacktrace

      - name: Assemble Debug APK
        run: |
          ./gradlew :app:assembleDebug \
            -PbuildNumber=${{ steps.ver.outputs.version_code }} \
            -Pchannel=${{ env.CHANNEL }} \
            --stacktrace

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk "${{ steps.ver.outputs.apk }}"
          ls -lh "${{ steps.ver.outputs.apk }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.apk }}
          path: ${{ steps.ver.outputs.apk }}
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: |
            app/build/reports/detekt
            app/build/reports/coverage/test/debug
            app/build/reports/lint-results-debug.html
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish GitHub Release
        # 只有全部门禁与构建成功后才建 Release，失败时不会留下半成品
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          APK: ${{ steps.ver.outputs.apk }}
          VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          VERSION_CODE: ${{ steps.ver.outputs.version_code }}
        run: |
          cat > release-notes.md <<EOF
          **渠道**：$CHANNEL
          **版本**：$VERSION_NAME（versionCode $VERSION_CODE）
          **提交**：${GITHUB_SHA:0:7}
          **签名**：debug 签名（Android 调试证书）。可直接安装运行；
          已装过 release 签名版本（应用市场包）的机器无法覆盖安装，需先卸载。
          EOF
          gh release create "$TAG" "$APK" \
            --title "Happy Phone Agent $VERSION_NAME ($CHANNEL)" \
            --notes-file release-notes.md \
            --prerelease

      - name: Publish Gitee Release
        # Gitee 不是构建目标，只是「发行版回传」：同一次 GitHub 构建、同一个 APK、
        # 同一个版本号与 tag 再挂一份到 Gitee 发行版，方便两边对照。
        # 注意：Gitee 的「从 GitHub 拉取」镜像只同步分支/标签/提交，不同步 Release
        # 和附件，所以发行版必须由这一步显式创建。
        # GITEE_TOKEN 未配置时跳过；跳过是正常路径，整个 run 仍为绿。
        if: github.event_name != 'pull_request'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          APK: ${{ steps.ver.outputs.apk }}
          VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          VERSION_CODE: ${{ steps.ver.outputs.version_code }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "未配置 GITEE_TOKEN，跳过 Gitee 发行版发布"
            echo "> GITEE_TOKEN 未配置，本 run 跳过 Gitee 发行版发布（不是失败）。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          API="https://gitee.com/api/v5/repos/xkx1029/Phtomt"
          BODY=$(printf '**渠道**：%s\n**版本**：%s（versionCode %s）\n**提交**：%s\n**签名**：debug 签名，可直接安装运行。\n' \
            "$CHANNEL" "$VERSION_NAME" "$VERSION_CODE" "${GITHUB_SHA:0:7}")
          # Gitee 的发行版响应里没有 upload_url（和 GitHub 不同），附件必须走
          # /releases/{release_id}/attach_files 这个接口，先拿 id。
          RESP=$(curl -sS -X POST "$API/releases" \
            --data-urlencode "access_token=$GITEE_TOKEN" \
            --data-urlencode "tag_name=$TAG" \
            --data-urlencode "name=Happy Phone Agent $VERSION_NAME ($CHANNEL)" \
            --data-urlencode "body=$BODY" \
            --data-urlencode "target_commitish=nightly" \
            --data-urlencode "prerelease=true")
          RID=$(echo "$RESP" | jq -r '.id // empty')
          if [ -z "$RID" ]; then
            echo "创建 Gitee 发行版未返回 id，尝试复用已存在的 tag：$RESP" >&2
            RID=$(curl -sS "$API/releases/tags/$TAG?access_token=$GITEE_TOKEN" | jq -r '.id // empty')
          fi
          if [ -z "$RID" ]; then echo "拿不到 Gitee release id，发行版发布失败" >&2; exit 1; fi
          UPLOADED=$(curl -sS -X POST "$API/releases/$RID/attach_files" \
            -F "access_token=$GITEE_TOKEN" \
            -F "file=@$APK")
          echo "$UPLOADED"
          echo "$UPLOADED" | jq -e '.browser_download_url' > /dev/null

      - name: Persist version counter
        # 出包成功才把计数器推进一步（失败不烧号）。
        # 回写固定在 nightly：它是计数器的权威副本，beta 跑完也写这里，
        # 所以两条分支不会各长一个独立序列。GITHUB_TOKEN 造成的提交不会再次触发工作流。
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE: ${{ steps.ver.outputs.version_code }}
        run: |
          for attempt in 1 2 3; do
            SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/version.properties?ref=nightly" --jq .sha)
            CUR=$(gh api "repos/$GITHUB_REPOSITORY/contents/version.properties?ref=nightly" \
              -H "Accept: application/vnd.github.raw" | grep -E '^BUILD_NUMBER=' | cut -d= -f2 | tr -d '[:space:]')
            # 若本地构建抢先推进过，就跳到它之后，绝不回退
            TARGET=$CODE
            if [ "$CUR" -ge "$CODE" ]; then TARGET=$((CUR + 1)); fi
            CONTENT=$(printf '#Auto-incremented by Gradle\n#%s\nBUILD_NUMBER=%s\n' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$TARGET" | base64 -w0)
            if gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/version.properties" \
                 -f message="ci: 版本计数器推进到 $TARGET（$CHANNEL）" \
                 -f content="$CONTENT" -f sha="$SHA" -f branch=nightly --silent; then
              echo "version.properties: $CUR -> $TARGET"
              exit 0
            fi
            echo "回写冲突，重试 $attempt" >&2
            sleep 3
          done
          echo "计数器回写失败：version.properties 仍停在 $CUR" >&2
          exit 1
