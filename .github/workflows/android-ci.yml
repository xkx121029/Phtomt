name: Android CI

# 构建门禁：PR / push 到 main 时编译 + 单元测试，防止仅改依赖未编译就合入（历史教训：移除 ML Kit 依赖后曾因未构建验证反复回滚）

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile + Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Detekt (static analysis)
        run: ./gradlew detekt --stacktrace

      - name: Unit Tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Unit Test Coverage Report
        run: ./gradlew :app:createDebugUnitTestCoverageReport --stacktrace

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-coverage
          path: app/build/reports/coverage/test/debug
          retention-days: 7

      - name: Upload detekt report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detekt-report
          path: app/build/reports/detekt
          retention-days: 7

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Assemble Debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7