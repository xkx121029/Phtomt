name: Android CI

# 构建 + 发布：push 到 main 出 beta 包，push 到 nightly 出 dev 包，产物直挂 GitHub Release。
# PR 只跑门禁与构建，不发布。

on:
  push:
    branches: [main, nightly]
    # 只有会影响 APK 的改动才触发构建与发布。
    # main 上混着大量纯文档/官网数据同步提交（chore(site)/docs），每一个都会跑完整
    # 构建、消耗一个版本号、切一个 beta Release（workflow 里 Publish GitHub Release 的
    # 条件是 event_name != pull_request，push 就会发布）。版本计数器本来就紧张（见
    # Compute version + tag），这些提交不该再烧号。
    # 注意：paths-ignore 只在「本次提交改动的文件全部命中」时才跳过；同时改了代码和
    # README 的提交照常触发。需要强制出包时用 workflow_dispatch。
    paths-ignore:
      - 'website/**'
      - 'docs/**'
      - 'promo/**'
      - 'promo-video/**'
      - 'BUGS/**'
      - '**/*.md'
      - '.github/workflows/site-pages.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: "发布渠道（手动触发时生效）"
        type: choice
        options: [beta, dev]
        default: beta
  # 每日兜底：避免 nightly 长时间只有 [skip ci] 提交而从未被验证
  schedule:
    - cron: '30 18 * * *'

# 最小权限：只读代码 + 写 Release
permissions:
  contents: write

# 同一分支的构建排队执行，不并发抢 tag；不取消进行中的发布。
# group 不带分支名是刻意的：dev 与 beta 共用 version.properties 这一个计数器，
# 两条流水线必须串行读-自增-回写，否则会拿到同一个号。
concurrency:
  group: android-build-release
  cancel-in-progress: false

jobs:
  build:
    name: Build + Release (${{ github.ref_name }})
    runs-on: ubuntu-latest
    # 构建 + 门禁约 12~15 分钟；Gitee 只建发行版（不传附件），不再需要 90 分钟余量。
    timeout-minutes: 40

    env:
      # 渠道判定：手动触发用输入值，否则 nightly 分支 = dev，其余 = beta
      CHANNEL: ${{ github.event.inputs.channel || (github.ref_name == 'nightly' && 'dev' || 'beta') }}
      # 已废弃的「渠道偏移号段」下界 = 1,000,000，与 root build.gradle.kts 的
      # LEGACY_CHANNEL_SEGMENT_FLOOR 同值、同含义（两个文件各自独立执行，没法共享常量，改要一起改）。
      #
      # cdd967a8（2026-11-05 07:35）曾用 versionCode 段位编码渠道：dev = 1000000 + run，
      # beta = 2000000 + run。同一天 474c6262 就改回单序列计数器，但那段号已经发布成 tag
      # （v0.2.1000084-dev、v0.2.2000083-beta … v0.2.2000093-beta）留在仓库里。
      # 它们不是「水位」：算进来的话 versionCode 会永远卡在 200 万号段，和 tag / Release 的
      # 0.2.9xxx 命名彻底脱节——这正是「CI 构件流的版本号和我们使用的版本号系统不相符」的根因。
      LEGACY_VERSION_SEGMENT_FLOOR: '1000000'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        # 与本地口径对齐：本机 JAVA_HOME 是 JDK 21，assembleDebug / detekt / 单测都在 21 上跑过。
        # 这里不依赖 17 的任何东西——工程没有 jvmToolchain、没有 org.gradle.java.home，
        # JDK 17 只是 AGP 8.13 对「运行 Gradle 的 JVM」的最低要求，不影响字节码：
        # compileOptions / jvmTarget 固定 17（vendored shizuku 模块是 11），换 21 出的包不变。
        # 之前 CI 用 17、本地 21，属于两套 JVM 行为（javac/JVM 告警、插件探测）不一致的来源。
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle cache
        # 只缓存 Gradle 用户目录（依赖与 wrapper），不缓存 app/build
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore fixed debug keystore
        id: keystore
        # 签名基线：本机 hpa-publish 用的就是 Android 默认 debug keystore
        #   %USERPROFILE%\.android\debug.keystore
        #   alias=androiddebugkey，storepass/keypass=android
        #   SHA-256 2B:67:B9:1A:73:EB:7D:4E:6A:9C:E7:FF:A2:5D:8A:07:
        #           8F:66:2A:C2:3D:65:C5:47:08:D2:95:96:4D:3C:BE:ED
        # 把同一份文件 base64 后存进 DEBUG_KEYSTORE_B64，CI 与本地才能同包名同签名，
        # 新旧包可互相覆盖安装；否则每次 runner 都会新建随机签名，只能先卸载再装。
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
          DEBUG_KEYSTORE_PASS: ${{ secrets.DEBUG_KEYSTORE_PASS }}
        run: |
          KS="$HOME/.android/debug.keystore"
          mkdir -p "$(dirname "$KS")"
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > "$KS"
            PASS="${DEBUG_KEYSTORE_PASS:-android}"
            if ! keytool -list -keystore "$KS" -storepass "$PASS" -alias androiddebugkey >/dev/null 2>&1; then
              echo "::error::固定 debug keystore 还原后校验失败（内容或 DEBUG_KEYSTORE_PASS 不对）"
              exit 1
            fi
            echo "已还原固定 debug keystore："
            keytool -list -v -keystore "$KS" -storepass "$PASS" -alias androiddebugkey | grep -E 'SHA256:'
            # 显式告诉 :app 用这份 keystore 给 debug 变体签名。
            # 不能只靠「文件放在 $HOME/.android 让 AGP 自己找」：实测连续三次 CI 包
            # 指纹各不相同（340A/F4EF/C55F），说明 AGP 没找到它、每次临时生成了随机签名。
            echo "HPA_DEBUG_KEYSTORE=$KS" >> "$GITHUB_ENV"
            echo "HPA_DEBUG_KEYSTORE_PASS=$PASS" >> "$GITHUB_ENV"
            echo "fixed=1" >> "$GITHUB_OUTPUT"
          else
            echo "fixed=0" >> "$GITHUB_OUTPUT"
            # 绝不静默换签名：让 run 明确告诉下载者「这一版覆盖不了旧版」。
            echo "::warning title=签名与历史不一致::未配置 DEBUG_KEYSTORE_B64，本次改用 runner 临时生成的 debug keystore。"
            echo "::warning::本次签名与历史不一致，包不能覆盖安装（需先卸载旧版）。"
            {
              echo "## ⚠️ 签名与历史不一致"
              echo
              echo "本次构建没有 \`DEBUG_KEYSTORE_B64\`，用的是 runner 上临时生成的 debug keystore。"
              echo "**本次签名与历史不一致，包不能覆盖安装**——安装前请先卸载旧版本。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # ---------------------------------------------------------------------
      # 新模块纳入 CI 闸门 —— 抽包的人照这 4 条做，少一条就是一个静默失效：
      #   1. 单测：把 `:<模块>:test`（Android 库模块是 `:<模块>:testDebugUnitTest`）
      #      加进下面 "Unit tests + coverage gates" 那一行。先 `--dry-run` 确认任务存在，
      #      不存在就说明模块还没有测试源集，别硬加（会红在「任务不存在」而不是测试）。
      #   2. detekt：把 `:<模块>:detekt` 加进 "Detekt + Lint"，
      #      `:<模块>:checkDetektBaseline` 加进 "Detekt baseline guards"
      #      （模块要有自己的 baseline.xml + baseline-count.txt）。
      #   3. 覆盖率：把**被搬走的那批类**的红线挪进模块自己的闸门；:app 的 coverageRules
      #      只保留仍留在 :app 的类，并按新的行数调低 coverageMinLines（两边注释互相指向）。
      #   4. 测试跟着包走：被测类的单测要搬进模块，否则模块的覆盖率闸门量的是空壳
      #      （:core:text 就是先只有 36.3%）。path 上确认 paths-ignore 没吞掉模块目录。
      # ---------------------------------------------------------------------
      - name: Detekt + Lint (static analysis, non-blocking)
        # 两个都不阻断出包（存量问题未清理完），合并到同一次 Gradle 调用：
        # 每次 ./gradlew 都要重跑一遍配置阶段（本工程实测 20~40s/次），
        # 同一次调用里跑多任务是 CI 上最直接的时间节省。--continue 保证
        # detekt 失败时 lint 仍然执行、报告都能上传。
        #
        # 任务要逐个列出并带模块前缀：detekt 的 config/baseline 挂在各模块自己的
        # build.gradle.kts 上，跑根项目的 `detekt` 不带基线路径，存量问题会全量报错；
        # 只列 :app 而不列新模块，那个模块的代码在 CI 上一条规则都没过。
        # 存量约 180 条（MagicNumber 56、ReturnCount 28、MaxLineLength 25、
        # CyclomaticComplexMethod 20…），大多在基线生成之后新增。清理完之前它不该挡住产包，
        # 清理后把 continue-on-error 去掉即可恢复阻断，并把这个步骤拆回独立步骤。
        continue-on-error: true
        run: ./gradlew :app:detekt :app:lintDebug :core:text:detekt :core:log:detekt :domain:detekt :core:security:detekt :core:perf:detekt :data:detekt --continue --stacktrace

      - name: Detekt baseline guards
        # 基线只减不增 + 分类合计必须等于总条目数（防止只改总数不更新分类表）。
        # 两条守卫都是确定性的、秒级完成，合并成一次调用省一次配置开销。
        #
        # 每个模块的豁免名单都是本模块自有的：baseline 的匹配键是
        # `RuleId:文件名$签名`、不含路径，包搬出 :app 后原豁免不再生效，
        # 所以每个模块都要跑它自己的 checkDetektBaseline。
        # :core:log 没有 baseline.xml，那个任务会显式打印"跳过"并以成功退出
        # （见 core/log/build.gradle.kts），因此这里可以无条件列出。
        run: ./gradlew :app:checkDetektBaseline :app:checkDetektBaselineBreakdown :core:text:checkDetektBaseline :core:log:checkDetektBaseline :domain:checkDetektBaseline :core:security:checkDetektBaseline :core:perf:checkDetektBaseline :data:checkDetektBaseline --stacktrace

      - name: Unit tests + coverage gates
        # 测试、覆盖率报告、纯逻辑覆盖率闸门一次跑完：后两者都依赖测试结果，
        # 历史实现是三次独立 ./gradlew，每次都要重新配置整个工程。
        #
        # 每个模块的测试任务必须显式列出：包搬进独立模块后，:app:testDebugUnitTest
        # 既不编译也不执行它们 —— :core:text 的 10 条 HtmlToMarkdownStagesTest
        # 曾因此在 CI 上一条都不跑，而这个步骤全绿。
        # 覆盖率闸门同理分两处：:app 守自己编译集里的包（checkPureLogicCoverage），
        # 各模块守自己那份（:core:text:checkCoreTextCoverage）。
        run: ./gradlew :app:testDebugUnitTest :core:text:test :core:log:testDebugUnitTest :domain:test :core:security:testDebugUnitTest :core:perf:testDebugUnitTest :data:testDebugUnitTest :app:createDebugUnitTestCoverageReport :app:checkPureLogicCoverage :core:text:checkCoreTextCoverage :domain:checkDomainCoverage :core:security:checkCoreSecurityCoverage :data:checkDataCoverage --stacktrace

      - name: Doc anchors (docs/judgement-index.md)
        # 判据索引表的 file:line 锚点校验：函数改名或代码挪位之后，锚点仍然"存在"
        # 但指向了别的代码 —— 只有这条机械校验能发现。本地一直跑（check 依赖它），
        # CI 从来没跑过，所以文档与代码脱节在 CI 上无人拦。
        run: ./gradlew :app:checkDocAnchors --stacktrace

      - name: Release variant gates (R8 + lintVital)
        # release 变体（isMinifyEnabled + isShrinkResources + proguard 规则）在 CI 里
        # 从来没有被构建过一次：唯一的构建调用只出 debug 包。R8 的 keep 规则缺失、
        # 资源收缩误删、反射类被裁这类问题只会在「发市场包」那天第一次暴露。
        #
        # 只跑不需要签名、也不需要 release 组件资产的目标：
        #   compileReleaseKotlin / minifyReleaseWithR8 / lintVitalRelease
        # 故意不用 assembleRelease —— 它会拉起 mergeReleaseAssets → verifyProviderAssetsRelease
        # → syncProviderRelease，而 release 变体的 Provider/env APK 必须用上传证书签名，
        # runner 上没有密钥，那条会 fail-closed（见 app/build.gradle.kts 的 requireUploadSigning）。
        # 实测（无密钥环境）:app:assembleDebug 与这三个目标的任务图都不含 mergeReleaseAssets。
        run: ./gradlew :app:compileReleaseKotlin :app:minifyReleaseWithR8 :app:lintVitalRelease --stacktrace

      - name: Compute version + tag
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 版本号只有一条递增序列：仓库根 version.properties 的 BUILD_NUMBER，
          # 本机构建（root build.gradle.kts）也是读写同一个文件。
          # 权威副本固定在 nightly 分支——beta 也读它的值，避免两条分支各长一个计数器。
          #
          # 但计数器**不是**权威，它只是「已发布 tag 的最大 versionCode」的一个副本：
          # 它只在发布成功后由 Persist 步骤推进，Persist 一旦失败（或被手工改动）就永久落后。
          # 事故（2026-11）：nightly 计数器停在 9188，tag 已发到 v0.2.9193-beta，
          # 这一跑按旧逻辑算出 9189 → 撞上 6 个版本前就存在的 tag → 发布步骤静默 --clobber，
          # 把新包覆盖到 v0.2.9189-beta 那个已发布的 Release 上，全绿，没人发现。
          # 所以基准取两者较大值，tag 领先时以 tag 为准：
          #   BASE = max(COUNTER, 已发布 tag 的最大 versionCode)，CODE = BASE + 1
          COUNTER=$(gh api "repos/$GITHUB_REPOSITORY/contents/version.properties?ref=nightly" \
            -H "Accept: application/vnd.github.raw" | grep -E '^BUILD_NUMBER=' | cut -d= -f2 | tr -d '[:space:]')
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/version.properties?ref=nightly" --jq .sha)
          if ! [ "$COUNTER" -ge 0 ] 2>/dev/null; then
            echo "读不到 version.properties 的 BUILD_NUMBER（值：$COUNTER）" >&2
            exit 1
          fi

          # 已发布 tag 的 versionCode 全集（-dev/-beta 与无后缀 tag 都算，跨渠道共用一条序列）。
          # 走 tags API 而不是 `git tag`：actions/checkout 默认 fetch-depth=1、根本不带 tag。
          TAGS=$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name' \
            | sed -n 's/^v0\.2\.\([0-9][0-9]*\)\(-.*\)\?$/\1/p' | sort -n -u)
          if [ -z "$TAGS" ]; then
            echo "::error title=读不到已发布 tag::tags API 没有返回任何 v0.2.* tag，无法确定 versionCode 水位；拒绝出包（否则可能撞号覆盖旧 Release）"
            exit 1
          fi

          # 水位只认**当前号段**：>= LEGACY_VERSION_SEGMENT_FLOOR 的号属于已废弃的渠道偏移号段
          # （dev = 1000000+run、beta = 2000000+run，见文件顶部 env 的说明），它们不是占用。
          # 没有当前号段的 tag 时 TAG_MAX 记 0，交给计数器决定基准——首次启用不崩。
          TAG_MAX=$(printf '%s\n' "$TAGS" | awk -v floor="$LEGACY_VERSION_SEGMENT_FLOOR" '$1 + 0 < floor + 0' | tail -1)
          TAG_MAX=${TAG_MAX:-0}

          # 计数器同样要设上界：被污染的 BUILD_NUMBER=2000093 既不是当前号段的水位，
          # 也不该参与 max() —— 否则 tag 修好了，脏计数器照样把号拖回 200 万。
          if [ "$COUNTER" -ge "$LEGACY_VERSION_SEGMENT_FLOOR" ] 2>/dev/null; then
            echo "::warning title=计数器落在已废弃号段::nightly 的 BUILD_NUMBER=$COUNTER（>= $LEGACY_VERSION_SEGMENT_FLOOR），按 0 处理；基准改由当前号段 tag 水位决定"
            COUNTER=0
          fi

          if [ "$TAG_MAX" -gt "$COUNTER" ]; then
            echo "计数器落后于已发布 tag（$COUNTER < $TAG_MAX），以 tag 为基准：计数器漏了一次推进"
            BASE=$TAG_MAX
          else
            BASE=$COUNTER
          fi
          CODE=$((BASE + 1))
          # 撞号兜底：按上面的算法 CODE 一定大于所有 tag 的号，这里只是防止
          # tags API 与实际 Release 列表不一致（分页、缓存、并发推送）时静默撞车。
          while printf '%s\n' "$TAGS" | grep -qx "$CODE"; do
            echo "versionCode $CODE 已被发布占用，跳到 $((CODE + 1))"
            CODE=$((CODE + 1))
          done
          echo "counter=$COUNTER" >> "$GITHUB_OUTPUT"
          echo "counter_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tag_max=$TAG_MAX" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=0.2.$CODE-$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "tag=v0.2.$CODE-$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "apk=HappyAgent-0.2.$CODE-$CHANNEL.apk" >> "$GITHUB_OUTPUT"
          echo "本次版本：0.2.$CODE-$CHANNEL（计数器 $COUNTER，已发布 tag 最大 $TAG_MAX，基准 $BASE -> $CODE）"
          {
            echo "## 版本号计算"
            echo
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| nightly 计数器 | \`$COUNTER\` |"
            echo "| 已发布 tag 最大 versionCode | \`$TAG_MAX\` |"
            echo "| 本次 versionCode | \`$CODE\` |"
            echo "| 本次 tag | \`v0.2.$CODE-$CHANNEL\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assert tag is not already published
        # 硬断言，第二道闸：算出来的 tag 一旦已经是一个已发布 Release，直接红。
        # 旧实现在发布步骤用 `gh release upload --clobber` 兜底这情况，代价是把新包
        # 静默覆盖到老 Release 上（P0 事故正是如此：v0.2.9189-beta 被 9193 之后的新包覆盖）。
        # 宁可红一次让人看见，也不要静默覆盖已发布的版本。
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          CODE: ${{ steps.ver.outputs.version_code }}
          TAG_MAX: ${{ steps.ver.outputs.tag_max }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error title=版本号撞车::算出的 tag $TAG（versionCode $CODE）已经是一个已发布的 Release。拒绝覆盖。已发布 tag 的最大 versionCode 是 $TAG_MAX，按 max(计数器, tag 最大值)+1 不该算出这个号——tags 列表与 Release 列表不一致，请人工核查。"
            exit 1
          fi
          echo "tag $TAG 未被占用，可以发布"

      - name: Sync assets + assemble Debug APK
        # provider.apk / 编码环境 APK 都是模块构建产物，不进仓库（.gitignore），
        # 干净检出后 assets 里只剩 version.txt，verifyProviderAssetsDebug 会直接拦下。
        # 这里把「同步」和「assemble」放进同一次 Gradle 调用（历史是两次独立调用，
        # 配置阶段要跑两遍）；顺序由 app/build.gradle.kts 里的 mustRunAfter 保证。
        #
        # 只同步 debug 变体（syncProviderDebug / syncEnvDebug），不跑 syncProviderAssets：
        # 后者会把 release 分支也带上，而 release 资产必须用上传证书签名，runner 上没有
        # app/upload-signing.properties，那条会 fail-closed 直接失败（这是有意的，
        # 见 app/build.gradle.kts 的 requireUploadSigning）。只出 debug 包时不需要它。
        #
        # HPA_DEBUG_KEYSTORE / HPA_DEBUG_KEYSTORE_PASS 由 keystore 步骤写入 $GITHUB_ENV，
        # :app 的 build.gradle.kts 据此显式配置 signingConfigs.debug。
        run: |
          ./gradlew :app:syncProviderDebug :app:syncEnvDebug :app:assembleDebug \
            -PbuildNumber=${{ steps.ver.outputs.version_code }} \
            -Pchannel=${{ env.CHANNEL }} \
            --stacktrace

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk "${{ steps.ver.outputs.apk }}"
          ls -lh "${{ steps.ver.outputs.apk }}"

      - name: Assert APK version matches tag
        # tag / Release 名 / APK 文件名都来自上一步注入的 version_code（见 Compute version + tag）。
        # 这里对**最终产物**硬断言：包内 versionCode 必须等于 tag 里的号，
        # versionName 必须是 0.2.<号>-<渠道>，与 tag / Release 名完全同一个字符串。
        # 目的：一旦以后有人改回「构建后自增」或绕开 -PbuildNumber，tag 会指向上一版的包；
        # 这一步在发布前直接红，避免发出「tag 与包内版本永久错一位」的 Release。
        env:
          APK: ${{ steps.ver.outputs.apk }}
          EXPECT_CODE: ${{ steps.ver.outputs.version_code }}
          EXPECT_NAME: ${{ steps.ver.outputs.version_name }}
        run: |
          AAPT="$(command -v aapt || true)"
          if [ -z "$AAPT" ]; then
            for root in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" "$HOME/Android/Sdk"; do
              if [ -d "$root/build-tools" ]; then
                AAPT=$(ls "$root/build-tools/"*/aapt 2>/dev/null | sort -V | tail -1)
              fi
              [ -n "$AAPT" ] && break
            done
          fi
          if [ -n "$AAPT" ]; then
            BADGING=$("$AAPT" dump badging "$APK" | head -1)
            CODE=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
            NAME=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          else
            # 没有 aapt 时退回 AGP 生成的元数据（与最终 APK 同一次打包产出）
            META=app/build/outputs/apk/debug/output-metadata.json
            CODE=$(jq -r '.elements[0].versionCode' "$META")
            NAME=$(jq -r '.elements[0].versionName' "$META")
          fi
          echo "包内：versionCode=$CODE versionName=$NAME；tag 预期：v$EXPECT_NAME"
          if [ "$CODE" != "$EXPECT_CODE" ]; then
            echo "::error title=版本号与 tag 不一致::tag 将使用 $EXPECT_CODE，但 APK 实际是 $CODE（相差 $((CODE - EXPECT_CODE))）"
            exit 1
          fi
          if [ "$NAME" != "$EXPECT_NAME" ]; then
            echo "::error title=versionName 与 tag 不一致::期望 $EXPECT_NAME，实际 $NAME"
            exit 1
          fi
          echo "- ✅ 包内版本与 tag 一致：versionCode=$CODE，versionName=$NAME" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify APK signature
        # 硬断言：CI 包必须与本机 hpa-publish 的包同证书，否则用户无法覆盖安装。
        # 只检查「文件被还原」不够——AGP 可能压根没用它，所以这里直接验最终 APK。
        env:
          APK: ${{ steps.ver.outputs.apk }}
          FIXED: ${{ steps.keystore.outputs.fixed }}
        run: |
          APKSIGNER="$(command -v apksigner || true)"
          if [ -z "$APKSIGNER" ]; then
            for root in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" "$HOME/Android/Sdk"; do
              if [ -d "$root/build-tools" ]; then
                APKSIGNER=$(ls "$root/build-tools/"*/apksigner 2>/dev/null | sort -V | tail -1)
              fi
              [ -n "$APKSIGNER" ] && break
            done
          fi
          if [ -z "$APKSIGNER" ]; then
            echo "::warning title=无法校验签名::没找到 apksigner，跳过签名断言（不阻断出包）"
            exit 0
          fi
          DIGEST=$("$APKSIGNER" verify --print-certs "$APK" | grep -oE '[0-9a-f]{64}' | head -1)
          EXPECTED=2b67b91a73eb7d4e6a9ce7ffa25d8a078f662ac23d65c54708d295964d3cbeed
          echo "APK 签名 SHA-256：${DIGEST:-（取不到）}（期望 $EXPECTED）"
          if [ "$DIGEST" = "$EXPECTED" ]; then
            echo "- ✅ APK 签名与本机一致：\`$DIGEST\`，可直接覆盖安装" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$FIXED" = "1" ]; then
            # 把 apksigner 原始输出贴出来，便于直接看出是哪张证书
            "$APKSIGNER" verify --print-certs "$APK" || true
            echo "::error title=固定签名未生效::已还原固定 keystore，但 APK 实际签名是 ${DIGEST:-取不到}（期望 $EXPECTED），包不能覆盖安装。"
            exit 1
          else
            echo "::warning title=签名与历史不一致::未配置 DEBUG_KEYSTORE_B64，本次签名 $DIGEST 与本机 $EXPECTED 不同，包不能覆盖安装。"
            echo "- ⚠️ 本次签名 $DIGEST 与本机 $EXPECTED 不一致，需先卸载旧版才能安装" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Assert bundled coding runtime
        # beta(v0.2.9114) 曾把「没有 libnode.so / agent-host」的包发出去，编码功能直接不可用，
        # 而 CI 全绿——因为当时只断言签名、没人看包内容。这里对最终 APK 硬断言：
        # 缺任何一个就红，不靠人肉发现。
        env:
          APK: ${{ steps.ver.outputs.apk }}
        run: |
          LIST=$(unzip -l "$APK")
          MISSING=0
          for entry in "lib/arm64-v8a/libnode.so" \
                       "lib/arm64-v8a/libicudata.so" \
                       "lib/arm64-v8a/libicui18n.so" \
                       "lib/arm64-v8a/libicuuc.so" \
                       "assets/agent-host/host-stdio.js"; do
            if ! printf '%s\n' "$LIST" | grep -q " $entry\$"; then
              echo "::error title=APK 缺少编码运行时::$APK 里没有 $entry"
              MISSING=1
            fi
          done
          if [ "$MISSING" = "1" ]; then
            echo "::error::APK 不完整：缺编码运行时文件，装了也用不了编码 Agent。"
            exit 1
          fi
          echo "- ✅ 编码运行时完整：libnode + 3 个 libicu + assets/agent-host 均已在包内" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.apk }}
          path: ${{ steps.ver.outputs.apk }}
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: |
            app/build/reports/detekt
            app/build/reports/coverage/test/debug
            app/build/reports/lint-results-debug.html
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish GitHub Release
        # 只有全部门禁与构建成功后才建 Release，失败时不会留下半成品
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          APK: ${{ steps.ver.outputs.apk }}
          VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          VERSION_CODE: ${{ steps.ver.outputs.version_code }}
        run: |
          cat > release-notes.md <<EOF
          **渠道**：$CHANNEL
          **版本**：$VERSION_NAME（versionCode $VERSION_CODE）
          **提交**：${GITHUB_SHA:0:7}
          **签名**：debug 签名（Android 调试证书）。可直接安装运行；
          已装过 release 签名版本（应用市场包）的机器无法覆盖安装，需先卸载。
          EOF
          # fail-closed：撞号就红，绝不覆盖已发布的版本。
          # 旧实现这里是 `if gh release view "$TAG"; then gh release upload "$TAG" "$APK" --clobber`，
          # 初衷是解开「Release 成功但 Persist 失败 → 下一跑重算出同一个 versionCode」的自锁，
          # 代价却是把新构建的包静默覆盖到几版之前的 Release 上，构建全绿、无人发现
          # （2026-11 的 P0：tag 已到 9193、计数器停在 9188，下一跑算出 9189 就去覆盖 v0.2.9189-beta）。
          # 自锁的正确解法在别处，已经实现：Compute 步骤按「tag 最大值 + 1」算号，
          # Persist 步骤以「tag 最大值 + 1」为下限推进计数器，下一次跑会自动跳到不冲突的号。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error title=拒绝覆盖已发布版本::tag $TAG 已经存在。不会用 --clobber 覆盖它——请检查 Compute 与 Assert 步骤为何没拦住。"
            exit 1
          fi
          gh release create "$TAG" "$APK" \
            --title "Happy Phone Agent $VERSION_NAME ($CHANNEL)" \
            --notes-file release-notes.md \
            --prerelease

      - name: Persist version counter
        # 出包成功才把计数器推进一步（失败不烧号）。
        # 位置必须在 Gitee 之前：Gitee 失败或被手动取消时，后面的步骤会被跳过；
        # 若计数器写在 Gitee 之后，就会出现「GitHub Release 已发、号没涨」，下一跑重用同一个号
        # （v0.2.9110-dev 与 v0.2.9110-beta 同 versionCode 就是这样产生的）。
        # 回写固定在 nightly：它是计数器的权威副本，beta 跑完也写这里，
        # 所以两条分支不会各长一个独立序列。GITHUB_TOKEN 造成的提交不会再次触发工作流。
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE: ${{ steps.ver.outputs.version_code }}
          TAG_MAX: ${{ steps.ver.outputs.tag_max }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          # fail-closed：3 次都写不进去就让这一次跑红。但失败必须留痕——
          # 此时 GitHub Release 已经发出去了，只是号没涨，属于「已发布但计数器未推进」。
          # 注意 Actions 的 bash 带 -e：读 sha/内容的 GET 失败会直接退出、跳过下面的提示，
          # 所以这里先 set +e，把三类失败（读不到、PUT 被拒、重试耗尽）统一收口到最后那段。
          set +e
          FAIL_REASON=""
          # 已发布 tag 的最大 versionCode：Compute 步骤透传的值 + 这里重读一次，取较大者。
          # 重读是为了盖住「Compute 之后又有新 tag 落地」的窗口；读失败就沿用透传值。
          # 同样只认当前号段（< LEGACY_VERSION_SEGMENT_FLOOR）：废弃的渠道偏移号段不是水位。
          TAG_MAX_NOW=$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name' 2>/dev/null \
            | sed -n 's/^v0\.2\.\([0-9][0-9]*\)\(-.*\)\?$/\1/p' \
            | awk -v floor="$LEGACY_VERSION_SEGMENT_FLOOR" '$1 + 0 < floor + 0' | sort -n | tail -1)
          if [ "${TAG_MAX_NOW:-0}" -gt "${TAG_MAX:-0}" ] 2>/dev/null; then TAG_MAX=$TAG_MAX_NOW; fi
          for attempt in 1 2 3; do
            SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/version.properties?ref=nightly" --jq .sha 2>/dev/null)
            CUR=$(gh api "repos/$GITHUB_REPOSITORY/contents/version.properties?ref=nightly" \
              -H "Accept: application/vnd.github.raw" 2>/dev/null | grep -E '^BUILD_NUMBER=' | cut -d= -f2 | tr -d '[:space:]')
            if [ -z "$SHA" ] || [ -z "$CUR" ]; then
              FAIL_REASON="读不到 nightly 的 version.properties（sha='${SHA}' counter='${CUR}'）"
              echo "读取失败：$FAIL_REASON，重试 $attempt" >&2
              sleep 3
              continue
            fi
            # 计数器也要设上界：读到 2000093 这种「已废弃号段」的脏值时必须按 0 处理，
            # 否则 TARGET 会变成 2000094，把刚修好的 9xxx 水位又拖回 200 万。
            CUR_RAW=$CUR
            if [ "$CUR" -ge "$LEGACY_VERSION_SEGMENT_FLOOR" ] 2>/dev/null; then
              echo "nightly 计数器 $CUR 落在已废弃号段，按 0 处理（不会把水位拖回 200 万）"
              CUR=0
            fi
            # 目标值 = max(本次 CODE, 当前值 + 1, 已发布 tag 最大值 + 1)，绝不回退。
            # 后两项是自愈：本地构建抢先推进过就跳到它之后；计数器本身已经落后于 tag
            # （历史事故：nightly 停在 9188、tag 已到 9193）就以 tag 为基准推进，
            # 而不是从落后的计数器 +1 继续掉队。
            TARGET=$CODE
            if [ "$CUR" -ge "$TARGET" ]; then TARGET=$((CUR + 1)); fi
            if [ "${TAG_MAX:-0}" -ge "$TARGET" ]; then TARGET=$((TAG_MAX + 1)); fi
            CONTENT=$(printf '#Auto-incremented by Gradle\n#%s\nBUILD_NUMBER=%s\n' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$TARGET" | base64 -w0)
            if gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/version.properties" \
                 -f message="ci: 版本计数器推进到 $TARGET（$CHANNEL）" \
                 -f content="$CONTENT" -f sha="$SHA" -f branch=nightly --silent; then
              echo "version.properties: $CUR_RAW -> $TARGET（本次发布 $CODE，已发布 tag 最大 $TAG_MAX）"
              exit 0
            fi
            FAIL_REASON="PUT 被拒（sha 冲突或权限不足），nightly 仍是 $CUR_RAW"
            echo "回写冲突，重试 $attempt" >&2
            sleep 3
          done
          echo "::error title=版本计数器未推进::上一次已发布但计数器未推进 —— $TAG 的 GitHub Release 已发布（versionCode $CODE），nightly 的 version.properties 仍停在 ${CUR_RAW:-未知}：$FAIL_REASON。计数器只是 tag 的副本，下一次运行会把 ${TAG_MAX} 与计数器取较大值再 +1，因此不会撞号覆盖；但仍应人工确认 nightly 的 BUILD_NUMBER 不小于 $((CODE + 1))。"
          {
            echo "## ❌ 版本计数器未推进"
            echo
            echo "- 上一次已发布但计数器未推进：**$TAG 已发布**（versionCode \`$CODE\`），nightly 的 \`version.properties\` 仍停在 \`${CUR_RAW:-未知}\`。"
            echo "- 失败原因：$FAIL_REASON"
            echo "- 影响：版本号以「已发布 tag 的最大 versionCode」为权威，下一次运行会自动算出不冲突的号，**不会撞号、不会覆盖已发布 Release**；但计数器本身仍未推进，建议人工确认。"
            echo "- 处置：确认 nightly 的 \`BUILD_NUMBER\` 不小于 \`$((CODE + 1))\`。"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Publish Gitee Release
        # Gitee 不是构建目标，只是「发行版回传」：同一次 GitHub 构建、同一个 APK、
        # 同一个版本号与 tag 再挂一份到 Gitee 发行版，方便两边对照。
        # 注意：Gitee 的「从 GitHub 拉取」镜像只同步分支/标签/提交，不同步 Release
        # 和附件，所以发行版必须由这一步显式创建。
        # GITEE_TOKEN 未配置时跳过；跳过是正常路径，整个 run 仍为绿。
        if: github.event_name != 'pull_request'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          APK: ${{ steps.ver.outputs.apk }}
          VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          VERSION_CODE: ${{ steps.ver.outputs.version_code }}
          GITEE_UPLOAD_FROM_CI: ${{ vars.GITEE_UPLOAD_FROM_CI }}
        timeout-minutes: 10
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "未配置 GITEE_TOKEN，跳过 Gitee 发行版发布"
            echo "> GITEE_TOKEN 未配置，本 run 跳过 Gitee 发行版发布（不是失败）。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          API="https://gitee.com/api/v5/repos/xkx1029/Phtomt"
          AUTH="access_token=$GITEE_TOKEN"
          APK_NAME=$(basename "$APK")
          APK_SIZE=$(stat -c %s "$APK")
          # body 里带上 GitHub 直链：附件万一没传完，用户仍有可用下载入口。
          BODY=$(printf '**渠道**：%s\n**版本**：%s（versionCode %s）\n**提交**：%s\n**签名**：debug 签名，可直接安装运行。\n**APK**：https://github.com/%s/releases/download/%s/%s\n' \
            "$CHANNEL" "$VERSION_NAME" "$VERSION_CODE" "${GITHUB_SHA:0:7}" \
            "$GITHUB_REPOSITORY" "$TAG" "$APK_NAME")
          # 先按 tag 复用已有发行版：重跑或计数器重号时 POST /releases 会 400，
          # 直接复用可以避免重复建发行版。
          RID=$(curl -sS --max-time 60 "$API/releases/tags/$TAG?$AUTH" | jq -r '.id // empty')
          if [ -z "$RID" ]; then
            # Gitee 的发行版响应里没有 upload_url（和 GitHub 不同），附件必须走
            # /releases/{release_id}/attach_files 这个接口，所以先拿 id。
            RESP=$(curl -sS --max-time 90 -X POST "$API/releases" \
              --data-urlencode "access_token=$GITEE_TOKEN" \
              --data-urlencode "tag_name=$TAG" \
              --data-urlencode "name=Happy Phone Agent $VERSION_NAME ($CHANNEL)" \
              --data-urlencode "body=$BODY" \
              --data-urlencode "target_commitish=nightly" \
              --data-urlencode "prerelease=true")
            RID=$(echo "$RESP" | jq -r '.id // empty')
          fi
          if [ -z "$RID" ]; then
            echo "::warning title=Gitee 发行版创建失败::tag=$TAG，响应=$RESP"
            echo "- ⚠️ Gitee 发行版 \`$TAG\` 创建失败，附件未上传（GitHub Release 不受影响）。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Gitee 发行版 id=$RID（tag=$TAG）"
          # 实测（run 42062347605）：GitHub runner 出口到 Gitee 只有 15.7KB/s，
          # 71MB 传了 40 分钟才到 37.6MB，服务端回合时已超时丢弃 ⇒ 40 分钟上限永远不够
          # （按实测速率需要约 76 分钟）。同一条链路从局域网侧（本机）实测 97KB/s，
          # 71MB 约 12 分钟，快 6 倍。所以职责拆开：
          #   CI   = 建发行版 + body 里给 GitHub 直链（附件缺失时用户仍有下载入口）
          #   局域网侧 = tool/gitee_attach.py 把同一 APK 补挂到 Gitee 发行版
          # 需要临时恢复 CI 内直传时，把仓库变量 GITEE_UPLOAD_FROM_CI 设为 true。
          if [ "${GITEE_UPLOAD_FROM_CI:-false}" != "true" ]; then
            echo "跳过 CI 内上传：附件交给局域网侧 tool/gitee_attach.py 补传（CI 出口 15.7KB/s，71MB 需约 76 分钟）"
            echo "- ℹ️ Gitee 发行版 \`$TAG\` 已创建，body 内含 GitHub 直链；APK 附件由局域网侧（\`tool/gitee_attach.py\`）补传。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # 幂等：同名同大小附件已存在就不再重复传 71MB
          if curl -sS --max-time 60 "$API/releases/$RID/attach_files?$AUTH" \
             | jq -e --arg n "$APK_NAME" --argjson s "$APK_SIZE" \
                 'map(select(.name == $n and .size == $s)) | length > 0' > /dev/null; then
            echo "Gitee 附件已存在且大小一致：$APK_NAME（$APK_SIZE B），跳过上传"
            echo "- ✅ Gitee 发行版 \`$TAG\` 附件已存在：\`$APK_NAME\`（$APK_SIZE B）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # 71MB 从 GitHub runner 直传 Gitee 只有 ~100KB/s 量级（单次 10 分钟以上），
          # 且 Gitee 附件不支持断点续传，所以只设时间上限、不做整体重试。
          echo "开始上传 $APK_NAME（$APK_SIZE B）到 Gitee 发行版 $RID"
          UPLOADED=$(curl -sS --http1.1 --connect-timeout 30 --max-time 2400 \
            -X POST "$API/releases/$RID/attach_files" \
            -F "access_token=$GITEE_TOKEN" \
            -F "file=@$APK" \
            -w '\n_TIME=%{time_total}s _SIZE=%{size_upload}B _SPEED=%{speed_upload}B/s\n') || true
          echo "$UPLOADED"
          # 以服务端附件列表为准核对文件名与字节数（不看上传响应体）
          ACTUAL=$(curl -sS --max-time 60 "$API/releases/$RID/attach_files?$AUTH" \
            | jq -r --arg n "$APK_NAME" 'map(select(.name == $n)) | .[0].size // empty')
          if [ "$ACTUAL" = "$APK_SIZE" ]; then
            echo "Gitee 附件核验通过：$APK_NAME = $ACTUAL B"
            echo "- ✅ Gitee 发行版 \`$TAG\`：\`$APK_NAME\`（$ACTUAL B）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Gitee 附件未传完::服务端大小=[${ACTUAL:-无}]，期望 $APK_SIZE B"
            echo "- ⚠️ Gitee 发行版 \`$TAG\` 已创建，但 APK 附件未传完（GitHub Release 不受影响）。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi


