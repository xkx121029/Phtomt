name: Android CI

# 构建 + 发布：push 到 main 出 beta 包，push 到 nightly 出 dev 包，产物直挂 GitHub Release。
# PR 只跑门禁与构建，不发布。

on:
  push:
    branches: [main, nightly]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: "发布渠道（手动触发时生效）"
        type: choice
        options: [beta, dev]
        default: beta

# 最小权限：只读代码 + 写 Release
permissions:
  contents: write

# 同一分支的构建排队执行，不并发抢 tag；不取消进行中的发布。
# group 不带分支名是刻意的：dev 与 beta 共用 version.properties 这一个计数器，
# 两条流水线必须串行读-自增-回写，否则会拿到同一个号。
concurrency:
  group: android-build-release
  cancel-in-progress: false

jobs:
  build:
    name: Build + Release (${{ github.ref_name }})
    runs-on: ubuntu-latest
    # 构建 + 门禁约 12~15 分钟；Gitee 只建发行版（不传附件），不再需要 90 分钟余量。
    timeout-minutes: 40

    env:
      # 渠道判定：手动触发用输入值，否则 nightly 分支 = dev，其余 = beta
      CHANNEL: ${{ github.event.inputs.channel || (github.ref_name == 'nightly' && 'dev' || 'beta') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        # compileOptions / jvmTarget 均为 17，AGP 8.13 最低要求也是 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle cache
        # 只缓存 Gradle 用户目录（依赖与 wrapper），不缓存 app/build
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore fixed debug keystore
        id: keystore
        # 签名基线：本机 hpa-publish 用的就是 Android 默认 debug keystore
        #   %USERPROFILE%\.android\debug.keystore
        #   alias=androiddebugkey，storepass/keypass=android
        #   SHA-256 2B:67:B9:1A:73:EB:7D:4E:6A:9C:E7:FF:A2:5D:8A:07:
        #           8F:66:2A:C2:3D:65:C5:47:08:D2:95:96:4D:3C:BE:ED
        # 把同一份文件 base64 后存进 DEBUG_KEYSTORE_B64，CI 与本地才能同包名同签名，
        # 新旧包可互相覆盖安装；否则每次 runner 都会新建随机签名，只能先卸载再装。
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
          DEBUG_KEYSTORE_PASS: ${{ secrets.DEBUG_KEYSTORE_PASS }}
        run: |
          KS="$HOME/.android/debug.keystore"
          mkdir -p "$(dirname "$KS")"
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > "$KS"
            PASS="${DEBUG_KEYSTORE_PASS:-android}"
            if ! keytool -list -keystore "$KS" -storepass "$PASS" -alias androiddebugkey >/dev/null 2>&1; then
              echo "::error::固定 debug keystore 还原后校验失败（内容或 DEBUG_KEYSTORE_PASS 不对）"
              exit 1
            fi
            echo "已还原固定 debug keystore："
            keytool -list -v -keystore "$KS" -storepass "$PASS" -alias androiddebugkey | grep -E 'SHA256:'
            # 显式告诉 :app 用这份 keystore 给 debug 变体签名。
            # 不能只靠「文件放在 $HOME/.android 让 AGP 自己找」：实测连续三次 CI 包
            # 指纹各不相同（340A/F4EF/C55F），说明 AGP 没找到它、每次临时生成了随机签名。
            echo "HPA_DEBUG_KEYSTORE=$KS" >> "$GITHUB_ENV"
            echo "HPA_DEBUG_KEYSTORE_PASS=$PASS" >> "$GITHUB_ENV"
            echo "fixed=1" >> "$GITHUB_OUTPUT"
          else
            echo "fixed=0" >> "$GITHUB_OUTPUT"
            # 绝不静默换签名：让 run 明确告诉下载者「这一版覆盖不了旧版」。
            echo "::warning title=签名与历史不一致::未配置 DEBUG_KEYSTORE_B64，本次改用 runner 临时生成的 debug keystore。"
            echo "::warning::本次签名与历史不一致，包不能覆盖安装（需先卸载旧版）。"
            {
              echo "## ⚠️ 签名与历史不一致"
              echo
              echo "本次构建没有 \`DEBUG_KEYSTORE_B64\`，用的是 runner 上临时生成的 debug keystore。"
              echo "**本次签名与历史不一致，包不能覆盖安装**——安装前请先卸载旧版本。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Detekt (static analysis)
        # 任务名必须带 :app 前缀：detekt 配置与基线只挂在 :app 上，
        # 跑根项目的 `detekt` 不带基线路径，存量问题会全量报错。
        #
        # 只报告、不阻断出包：当前还有 515 条存量问题（MagicNumber 193、
        # MaxLineLength 122、ReturnCount 61…），大多是历史文件（CapabilitySpec.kt、
        # ExecutionPhase.kt 等）在基线生成之后新增的。清理完之前它不该挡住产包，
        # 报告仍随 artifact 上传；清理后把 continue-on-error 去掉即可恢复阻断。
        continue-on-error: true
        run: ./gradlew :app:detekt --stacktrace

      - name: Detekt baseline guard (fail if exemptions grow)
        # 基线只减不增的守卫是确定性的（当前 1543 条 = 记录值），保留阻断
        run: ./gradlew :app:checkDetektBaseline --stacktrace

      - name: Unit Tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Unit Test Coverage Report
        run: ./gradlew :app:createDebugUnitTestCoverageReport --stacktrace

      - name: Lint
        # 存量 lint 问题（MissingPermission 等）尚未清理完，暂不阻断出包；
        # 报告仍会上传，修复后再改为阻断
        continue-on-error: true
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Compute version + tag
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 版本号只有一条递增序列：仓库根 version.properties 的 BUILD_NUMBER，
          # 本机构建（root build.gradle.kts）也是读写同一个文件。
          # 权威副本固定在 nightly 分支——beta 也读它的值，避免两条分支各长一个计数器。
          COUNTER=$(gh api "repos/$GITHUB_REPOSITORY/contents/version.properties?ref=nightly" \
            -H "Accept: application/vnd.github.raw" | grep -E '^BUILD_NUMBER=' | cut -d= -f2 | tr -d '[:space:]')
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/version.properties?ref=nightly" --jq .sha)
          if ! [ "$COUNTER" -ge 0 ] 2>/dev/null; then
            echo "读不到 version.properties 的 BUILD_NUMBER（值：$COUNTER）" >&2
            exit 1
          fi
          CODE=$((COUNTER + 1))
          echo "counter=$COUNTER" >> "$GITHUB_OUTPUT"
          echo "counter_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=0.2.$CODE-$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "tag=v0.2.$CODE-$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "apk=HappyAgent-0.2.$CODE-$CHANNEL.apk" >> "$GITHUB_OUTPUT"
          echo "本次版本：0.2.$CODE-$CHANNEL（计数器 $COUNTER -> $CODE）"

      - name: Sync provider + env assets
        # provider.apk / 编码环境 APK 都是模块构建产物，不进仓库（.gitignore），
        # 干净检出后 assets 里只剩 version.txt，verifyProviderAssets 会直接拦下。
        # 先由各自模块构建并同步进 assets，再走 assemble。
        run: ./gradlew :app:syncProviderAssets :app:syncEnvAssets --stacktrace

      - name: Assemble Debug APK
        # HPA_DEBUG_KEYSTORE / HPA_DEBUG_KEYSTORE_PASS 由上一步写入 $GITHUB_ENV，
        # :app 的 build.gradle.kts 据此显式配置 signingConfigs.debug。
        run: |
          ./gradlew :app:assembleDebug \
            -PbuildNumber=${{ steps.ver.outputs.version_code }} \
            -Pchannel=${{ env.CHANNEL }} \
            --stacktrace

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk "${{ steps.ver.outputs.apk }}"
          ls -lh "${{ steps.ver.outputs.apk }}"

      - name: Assert APK version matches tag
        # tag / Release 名 / APK 文件名都来自上一步注入的 version_code（见 Compute version + tag）。
        # 这里对**最终产物**硬断言：包内 versionCode 必须等于 tag 里的号，versionName 必须是 0.2.<号>。
        # 目的：一旦以后有人改回「构建后自增」或绕开 -PbuildNumber，tag 会指向上一版的包；
        # 这一步在发布前直接红，避免发出「tag 与包内版本永久错一位」的 Release。
        env:
          APK: ${{ steps.ver.outputs.apk }}
          EXPECT_CODE: ${{ steps.ver.outputs.version_code }}
        run: |
          AAPT="$(command -v aapt || true)"
          if [ -z "$AAPT" ]; then
            for root in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" "$HOME/Android/Sdk"; do
              if [ -d "$root/build-tools" ]; then
                AAPT=$(ls "$root/build-tools/"*/aapt 2>/dev/null | sort -V | tail -1)
              fi
              [ -n "$AAPT" ] && break
            done
          fi
          if [ -n "$AAPT" ]; then
            BADGING=$("$AAPT" dump badging "$APK" | head -1)
            CODE=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
            NAME=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          else
            # 没有 aapt 时退回 AGP 生成的元数据（与最终 APK 同一次打包产出）
            META=app/build/outputs/apk/debug/output-metadata.json
            CODE=$(jq -r '.elements[0].versionCode' "$META")
            NAME=$(jq -r '.elements[0].versionName' "$META")
          fi
          echo "包内：versionCode=$CODE versionName=$NAME；tag 预期：v0.2.$EXPECT_CODE"
          if [ "$CODE" != "$EXPECT_CODE" ]; then
            echo "::error title=版本号与 tag 不一致::tag 将使用 $EXPECT_CODE，但 APK 实际是 $CODE（相差 $((CODE - EXPECT_CODE))）"
            exit 1
          fi
          if [ "$NAME" != "0.2.$EXPECT_CODE" ]; then
            echo "::error title=versionName 与 tag 不一致::期望 0.2.$EXPECT_CODE，实际 $NAME"
            exit 1
          fi
          echo "- ✅ 包内版本与 tag 一致：versionCode=$CODE，versionName=$NAME" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify APK signature
        # 硬断言：CI 包必须与本机 hpa-publish 的包同证书，否则用户无法覆盖安装。
        # 只检查「文件被还原」不够——AGP 可能压根没用它，所以这里直接验最终 APK。
        env:
          APK: ${{ steps.ver.outputs.apk }}
          FIXED: ${{ steps.keystore.outputs.fixed }}
        run: |
          APKSIGNER="$(command -v apksigner || true)"
          if [ -z "$APKSIGNER" ]; then
            for root in "$ANDROID_HOME" "$ANDROID_SDK_ROOT" "$HOME/Android/Sdk"; do
              if [ -d "$root/build-tools" ]; then
                APKSIGNER=$(ls "$root/build-tools/"*/apksigner 2>/dev/null | sort -V | tail -1)
              fi
              [ -n "$APKSIGNER" ] && break
            done
          fi
          if [ -z "$APKSIGNER" ]; then
            echo "::warning title=无法校验签名::没找到 apksigner，跳过签名断言（不阻断出包）"
            exit 0
          fi
          DIGEST=$("$APKSIGNER" verify --print-certs "$APK" | grep -oE '[0-9a-f]{64}' | head -1)
          EXPECTED=2b67b91a73eb7d4e6a9ce7ffa25d8a078f662ac23d65c54708d295964d3cbeed
          echo "APK 签名 SHA-256：${DIGEST:-（取不到）}（期望 $EXPECTED）"
          if [ "$DIGEST" = "$EXPECTED" ]; then
            echo "- ✅ APK 签名与本机一致：\`$DIGEST\`，可直接覆盖安装" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$FIXED" = "1" ]; then
            # 把 apksigner 原始输出贴出来，便于直接看出是哪张证书
            "$APKSIGNER" verify --print-certs "$APK" || true
            echo "::error title=固定签名未生效::已还原固定 keystore，但 APK 实际签名是 ${DIGEST:-取不到}（期望 $EXPECTED），包不能覆盖安装。"
            exit 1
          else
            echo "::warning title=签名与历史不一致::未配置 DEBUG_KEYSTORE_B64，本次签名 $DIGEST 与本机 $EXPECTED 不同，包不能覆盖安装。"
            echo "- ⚠️ 本次签名 $DIGEST 与本机 $EXPECTED 不一致，需先卸载旧版才能安装" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Assert bundled coding runtime
        # beta(v0.2.9114) 曾把「没有 libnode.so / agent-host」的包发出去，编码功能直接不可用，
        # 而 CI 全绿——因为当时只断言签名、没人看包内容。这里对最终 APK 硬断言：
        # 缺任何一个就红，不靠人肉发现。
        env:
          APK: ${{ steps.ver.outputs.apk }}
        run: |
          LIST=$(unzip -l "$APK")
          MISSING=0
          for entry in "lib/arm64-v8a/libnode.so" \
                       "lib/arm64-v8a/libicudata.so" \
                       "lib/arm64-v8a/libicui18n.so" \
                       "lib/arm64-v8a/libicuuc.so" \
                       "assets/agent-host/host-stdio.js"; do
            if ! printf '%s\n' "$LIST" | grep -q " $entry\$"; then
              echo "::error title=APK 缺少编码运行时::$APK 里没有 $entry"
              MISSING=1
            fi
          done
          if [ "$MISSING" = "1" ]; then
            echo "::error::APK 不完整：缺编码运行时文件，装了也用不了编码 Agent。"
            exit 1
          fi
          echo "- ✅ 编码运行时完整：libnode + 3 个 libicu + assets/agent-host 均已在包内" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.apk }}
          path: ${{ steps.ver.outputs.apk }}
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_number }}
          path: |
            app/build/reports/detekt
            app/build/reports/coverage/test/debug
            app/build/reports/lint-results-debug.html
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish GitHub Release
        # 只有全部门禁与构建成功后才建 Release，失败时不会留下半成品
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          APK: ${{ steps.ver.outputs.apk }}
          VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          VERSION_CODE: ${{ steps.ver.outputs.version_code }}
        run: |
          cat > release-notes.md <<EOF
          **渠道**：$CHANNEL
          **版本**：$VERSION_NAME（versionCode $VERSION_CODE）
          **提交**：${GITHUB_SHA:0:7}
          **签名**：debug 签名（Android 调试证书）。可直接安装运行；
          已装过 release 签名版本（应用市场包）的机器无法覆盖安装，需先卸载。
          EOF
          gh release create "$TAG" "$APK" \
            --title "Happy Phone Agent $VERSION_NAME ($CHANNEL)" \
            --notes-file release-notes.md \
            --prerelease

      - name: Publish Gitee Release
        # Gitee 不是构建目标，只是「发行版回传」：同一次 GitHub 构建、同一个 APK、
        # 同一个版本号与 tag 再挂一份到 Gitee 发行版，方便两边对照。
        # 注意：Gitee 的「从 GitHub 拉取」镜像只同步分支/标签/提交，不同步 Release
        # 和附件，所以发行版必须由这一步显式创建。
        # GITEE_TOKEN 未配置时跳过；跳过是正常路径，整个 run 仍为绿。
        if: github.event_name != 'pull_request'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          APK: ${{ steps.ver.outputs.apk }}
          VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          VERSION_CODE: ${{ steps.ver.outputs.version_code }}
          GITEE_UPLOAD_FROM_CI: ${{ vars.GITEE_UPLOAD_FROM_CI }}
        timeout-minutes: 10
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "未配置 GITEE_TOKEN，跳过 Gitee 发行版发布"
            echo "> GITEE_TOKEN 未配置，本 run 跳过 Gitee 发行版发布（不是失败）。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          API="https://gitee.com/api/v5/repos/xkx1029/Phtomt"
          AUTH="access_token=$GITEE_TOKEN"
          APK_NAME=$(basename "$APK")
          APK_SIZE=$(stat -c %s "$APK")
          # body 里带上 GitHub 直链：附件万一没传完，用户仍有可用下载入口。
          BODY=$(printf '**渠道**：%s\n**版本**：%s（versionCode %s）\n**提交**：%s\n**签名**：debug 签名，可直接安装运行。\n**APK**：https://github.com/%s/releases/download/%s/%s\n' \
            "$CHANNEL" "$VERSION_NAME" "$VERSION_CODE" "${GITHUB_SHA:0:7}" \
            "$GITHUB_REPOSITORY" "$TAG" "$APK_NAME")
          # 先按 tag 复用已有发行版：重跑或计数器重号时 POST /releases 会 400，
          # 直接复用可以避免重复建发行版。
          RID=$(curl -sS --max-time 60 "$API/releases/tags/$TAG?$AUTH" | jq -r '.id // empty')
          if [ -z "$RID" ]; then
            # Gitee 的发行版响应里没有 upload_url（和 GitHub 不同），附件必须走
            # /releases/{release_id}/attach_files 这个接口，所以先拿 id。
            RESP=$(curl -sS --max-time 90 -X POST "$API/releases" \
              --data-urlencode "access_token=$GITEE_TOKEN" \
              --data-urlencode "tag_name=$TAG" \
              --data-urlencode "name=Happy Phone Agent $VERSION_NAME ($CHANNEL)" \
              --data-urlencode "body=$BODY" \
              --data-urlencode "target_commitish=nightly" \
              --data-urlencode "prerelease=true")
            RID=$(echo "$RESP" | jq -r '.id // empty')
          fi
          if [ -z "$RID" ]; then
            echo "::warning title=Gitee 发行版创建失败::tag=$TAG，响应=$RESP"
            echo "- ⚠️ Gitee 发行版 \`$TAG\` 创建失败，附件未上传（GitHub Release 不受影响）。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Gitee 发行版 id=$RID（tag=$TAG）"
          # 实测（run 42062347605）：GitHub runner 出口到 Gitee 只有 15.7KB/s，
          # 71MB 传了 40 分钟才到 37.6MB，服务端回合时已超时丢弃 ⇒ 40 分钟上限永远不够
          # （按实测速率需要约 76 分钟）。同一条链路从局域网侧（本机）实测 97KB/s，
          # 71MB 约 12 分钟，快 6 倍。所以职责拆开：
          #   CI   = 建发行版 + body 里给 GitHub 直链（附件缺失时用户仍有下载入口）
          #   局域网侧 = tool/gitee_attach.py 把同一 APK 补挂到 Gitee 发行版
          # 需要临时恢复 CI 内直传时，把仓库变量 GITEE_UPLOAD_FROM_CI 设为 true。
          if [ "${GITEE_UPLOAD_FROM_CI:-false}" != "true" ]; then
            echo "跳过 CI 内上传：附件交给局域网侧 tool/gitee_attach.py 补传（CI 出口 15.7KB/s，71MB 需约 76 分钟）"
            echo "- ℹ️ Gitee 发行版 \`$TAG\` 已创建，body 内含 GitHub 直链；APK 附件由局域网侧（\`tool/gitee_attach.py\`）补传。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # 幂等：同名同大小附件已存在就不再重复传 71MB
          if curl -sS --max-time 60 "$API/releases/$RID/attach_files?$AUTH" \
             | jq -e --arg n "$APK_NAME" --argjson s "$APK_SIZE" \
                 'map(select(.name == $n and .size == $s)) | length > 0' > /dev/null; then
            echo "Gitee 附件已存在且大小一致：$APK_NAME（$APK_SIZE B），跳过上传"
            echo "- ✅ Gitee 发行版 \`$TAG\` 附件已存在：\`$APK_NAME\`（$APK_SIZE B）" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # 71MB 从 GitHub runner 直传 Gitee 只有 ~100KB/s 量级（单次 10 分钟以上），
          # 且 Gitee 附件不支持断点续传，所以只设时间上限、不做整体重试。
          echo "开始上传 $APK_NAME（$APK_SIZE B）到 Gitee 发行版 $RID"
          UPLOADED=$(curl -sS --http1.1 --connect-timeout 30 --max-time 2400 \
            -X POST "$API/releases/$RID/attach_files" \
            -F "access_token=$GITEE_TOKEN" \
            -F "file=@$APK" \
            -w '\n_TIME=%{time_total}s _SIZE=%{size_upload}B _SPEED=%{speed_upload}B/s\n') || true
          echo "$UPLOADED"
          # 以服务端附件列表为准核对文件名与字节数（不看上传响应体）
          ACTUAL=$(curl -sS --max-time 60 "$API/releases/$RID/attach_files?$AUTH" \
            | jq -r --arg n "$APK_NAME" 'map(select(.name == $n)) | .[0].size // empty')
          if [ "$ACTUAL" = "$APK_SIZE" ]; then
            echo "Gitee 附件核验通过：$APK_NAME = $ACTUAL B"
            echo "- ✅ Gitee 发行版 \`$TAG\`：\`$APK_NAME\`（$ACTUAL B）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Gitee 附件未传完::服务端大小=[${ACTUAL:-无}]，期望 $APK_SIZE B"
            echo "- ⚠️ Gitee 发行版 \`$TAG\` 已创建，但 APK 附件未传完（GitHub Release 不受影响）。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

      - name: Persist version counter
        # 出包成功才把计数器推进一步（失败不烧号）。
        # 回写固定在 nightly：它是计数器的权威副本，beta 跑完也写这里，
        # 所以两条分支不会各长一个独立序列。GITHUB_TOKEN 造成的提交不会再次触发工作流。
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CODE: ${{ steps.ver.outputs.version_code }}
        run: |
          for attempt in 1 2 3; do
            SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/version.properties?ref=nightly" --jq .sha)
            CUR=$(gh api "repos/$GITHUB_REPOSITORY/contents/version.properties?ref=nightly" \
              -H "Accept: application/vnd.github.raw" | grep -E '^BUILD_NUMBER=' | cut -d= -f2 | tr -d '[:space:]')
            # 若本地构建抢先推进过，就跳到它之后，绝不回退
            TARGET=$CODE
            if [ "$CUR" -ge "$CODE" ]; then TARGET=$((CUR + 1)); fi
            CONTENT=$(printf '#Auto-incremented by Gradle\n#%s\nBUILD_NUMBER=%s\n' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$TARGET" | base64 -w0)
            if gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/version.properties" \
                 -f message="ci: 版本计数器推进到 $TARGET（$CHANNEL）" \
                 -f content="$CONTENT" -f sha="$SHA" -f branch=nightly --silent; then
              echo "version.properties: $CUR -> $TARGET"
              exit 0
            fi
            echo "回写冲突，重试 $attempt" >&2
            sleep 3
          done
          echo "计数器回写失败：version.properties 仍停在 $CUR" >&2
          exit 1
