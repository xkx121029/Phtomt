# 注意：不使用 org.gradle.java.home 硬编码本机 JDK 路径（避免协作/换机构建失败），
# 由 JAVA_HOME 或系统默认 JDK 提供
# 堆从 2048m 提到 4096m：实测 2048m 与 4096m 的配置期耗时没有差异（均 1m20s 量级，冷启动
# 5m20s 的差异来自 JIT/类加载，不是堆），所以这一项不是提速手段，保留只是给 daemon 内的
# dex/R8/资源合并留余量（这些阶段和配置在同一个 JVM 里跑）；metaspace 显式给上限，
# 避免插件类加载后无限扩容再被 Full GC 拖慢。本机 32G 内存，4G 不挤。
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# 显式写死增量编译：本工程没有 kapt/KSP，Kotlin 增量是唯一能免掉「全量 25 分钟编译」的机制。
# 谁都觉得慢也不要把它改成 false，也不要加 --rerun-tasks，那只会更慢。
kotlin.incremental=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official