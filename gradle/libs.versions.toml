[versions]
# 工具链版本以「编译器 >= 运行时」为准：新版 Kotlin 编译器可以
# 编译旧版 Compose 运行时，反之会在编译期报版本不匹配。
agp = "8.13.2"
kotlin = "2.4.20"
coreKtx = "1.17.0"
lifecycle = "2.10.0"
activityCompose = "1.12.4"
# Compose BOM 2026.09.00 → compose-ui 1.12.1 / material3 1.4.0
composeBom = "2026.09.00"
# Material 3 Expressive（MotionScheme、Shape morph、LoadingIndicator 等）自 1.4.0 起提供
material3 = "1.4.0"
datastore = "1.1.1"
serialization = "1.7.3"
okhttp = "4.12.0"
koin = "4.0.0"
coroutines = "1.9.0"
shizuku = "13.1.5"
lucide = "1.1.0"
haze = "1.4.0"
junit = "4.13.2"
mockk = "1.13.13"
detekt = "1.23.8"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
# Lucide 线性图标集（Compose Multiplatform 版，MIT 许可）
lucide-icons = { group = "com.composables", name = "icons-lucide", version.ref = "lucide" }
# Haze：Compose 的毛玻璃（背景模糊）实现，API 31+ 走 RenderEffect，低版本自动降级为半透明遮罩
haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose", version.ref = "koin" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }

# 单元测试
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# 静态检查：默认规则集 + 基线豁免存量问题，只拦新增（见 app/build.gradle.kts 的 detekt 块）
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }