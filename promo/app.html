  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sk-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
/* 市场行情卡片：名称 + 说明 + 地址 + 使用 */
.sk-market{width:100%;text-align:left;padding:12px 14px;border-radius:20px;
  background:var(--card);border:1px solid var(--card-border);margin-top:8px}
.sk-market .mh{display:flex;align-items:center;gap:6px}
.sk-market .mh b{font-size:16px;line-height:24px;font-weight:600}
.sk-market p{margin:0;font-size:12px;line-height:16px;color:var(--muted)}
.sk-market .url{margin:2px 0 0;font-size:12px;line-height:16px;color:var(--warm);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk-market .use{margin-top:6px;font-size:12px;line-height:16px;font-weight:600;color:var(--brand)}

/* ============================================================
   文档全屏阅读（对齐 DocViewerScreen：整屏只放正文 + 底部大圆角返回）
   ============================================================ */
.doc{position:absolute;inset:0;z-index:110;display:flex;flex-direction:column;background:var(--bg);
  padding:16px 0 12px;
  animation:fadeIn var(--t-normal) linear both}
.doc-head{display:flex;align-items:center;gap:12px;padding:0 16px 12px;flex:none}
.doc-head .dtile{width:36px;height:36px;border-radius:14px;display:grid;place-items:center;
  background:var(--sunken);color:var(--brand);flex:none}
.doc-head .dtile .ic{width:18px;height:18px}
.doc-head .dht{flex:1;min-width:0}
.doc-head small{display:block;font-size:11px;line-height:16px;color:var(--muted)}
.doc-head b{display:block;margin-top:2px;font-size:14px;line-height:20px;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-body{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 8px;font-size:14px;line-height:24px}
.doc-body h3{margin:16px 0 6px;font-size:16px;line-height:24px;font-weight:600}
.doc-body p{margin:0 0 8px}
.doc-body li{margin:0 0 6px 18px}
.doc-body pre{margin:8px 0;padding:12px;border-radius:14px;background:var(--sunken);
  border:1px solid var(--line);overflow-x:auto;font-size:12px;line-height:18px;
  font-family:ui-monospace,"SF Mono",Consolas,monospace}
.doc-foot{flex:none;padding:8px 16px 0}
.home-back{width:100%;height:52px;border-radius:999px;background:var(--brand-c);
  color:var(--on-brand-c);font-size:16px;line-height:24px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px}
.home-back .ic{width:18px;height:18px}

/* ============================================================
   内置浏览器（对齐 BrowserScreen：地址条 + 进度线 + 网页 / 空提示）
   ============================================================ */
.br-strip{margin:12px 12px 0;display:flex;align-items:center;gap:8px;
  padding:12px 12px;border-radius:20px;background:var(--card-2)}
.br-strip>.ic{width:18px;height:18px;color:var(--brand);flex:none}
.br-strip .bst{flex:1;min-width:0}
.br-strip b{display:block;font-size:14px;line-height:20px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br-strip em{font-style:normal;display:block;font-size:11px;line-height:16px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br-progress{height:2px;margin:0 12px;background:var(--raised);overflow:hidden}
.br-progress i{display:block;height:100%;background:var(--brand);transition:width .3s var(--ease)}
.br-page{flex:1;min-height:0;overflow-y:auto;margin:8px 12px 0}
.br-empty{margin:16px;padding:16px;border-radius:24px;background:var(--card);
  border:1px solid color-mix(in srgb,var(--outline) 40%,transparent);text-align:center}
.br-empty b{display:block;font-size:14px;line-height:20px;font-weight:600}
.br-empty p{margin:8px 0 0;font-size:12px;line-height:16px;color:var(--muted)}
/* 模拟网页：一张干净的白底内容页，让「AI 能看到」这件事可感 */
.web{background:#FBFBF9;color:#1B1F1C;border-radius:20px;overflow:hidden;
  font-size:13px;line-height:20px}
html[data-theme="dark"] .web{background:#EDEFEA;color:#151715}
.web-nav{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid rgba(0,0,0,.08);
  font-weight:600;font-size:13px}
.web-nav .wdot{width:8px;height:8px;border-radius:99px;background:#0E7C66}
.web-hero{padding:18px 16px 12px}
.web-hero h2{margin:0;font-size:20px;line-height:28px;font-weight:700;letter-spacing:-.2px}
.web-hero p{margin:6px 0 0;color:#5C645C;font-size:12px;line-height:18px}
.web-list{padding:0 16px 18px}
.web-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid rgba(0,0,0,.07)}
.web-row .wn{width:22px;height:22px;border-radius:6px;background:#E2F0EA;color:#0E7C66;
  display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.web-row b{flex:1;font-size:13px;font-weight:500}
.web-row small{font-size:11px;color:#6E756E}

/* ============================================================
   页面记忆：按应用分组的双列缩略图（对齐 PageMemoryList / VirtualScreenCanvas）
   ============================================================ */
.pg-group{display:flex;align-items:center;gap:8px;margin:14px 0 8px}
.pg-group .gdot{width:8px;height:8px;border-radius:99px;background:var(--cool);flex:none}
.pg-group b{flex:1;min-width:0;font-size:14px;line-height:20px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-group span{font-size:11px;line-height:16px;color:var(--muted)}
.pg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pg-card{text-align:left;padding:8px;border-radius:14px;background:transparent;
  border:1px solid var(--card-border);position:relative;min-width:0;
  transition:transform var(--t-fast) var(--ease)}
.pg-card:active{transform:scale(.985)}
.pg-card .pdel{position:absolute;top:12px;right:12px;width:20px;height:20px;border-radius:99px;
  display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);
  color:color-mix(in srgb,var(--on-raised) 75%,transparent)}
.pg-card .pdel.armed{color:var(--err)}
.pg-card .pdel .ic{width:12px;height:12px}
.pg-card b{display:block;margin-top:6px;font-size:14px;line-height:20px;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-card em{font-style:normal;display:block;font-size:11px;line-height:16px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 虚拟画面：surfaceSunken 底 + 点阵底纹 + 线框控件（比例 0.78） */
.vscreen{position:relative;width:100%;aspect-ratio:0.78;border-radius:20px;overflow:hidden;
  background:var(--sunken);border:1px solid color-mix(in srgb,var(--outline) 30%,transparent)}
.vscreen::before{content:"";position:absolute;inset:0;
  background-image:radial-gradient(circle, color-mix(in srgb,var(--line) 90%,transparent) 1px, transparent 1px);
  background-size:22px 22px;background-position:11px 11px;opacity:.5}
.vs-node{position:absolute}
.vs-node.text{display:flex;align-items:center;font-size:9px;line-height:11px;
  color:color-mix(in srgb,var(--on-bg) 80%,transparent);overflow:hidden}
.vs-node.text.bar::before{content:"";display:block;width:100%;height:3px;border-radius:2px;
  background:color-mix(in srgb,var(--on-bg) 28%,transparent)}
.vs-node.button{border:1.5px solid var(--brand);border-radius:6px;
  display:grid;place-items:center;font-size:9px;line-height:11px;
  color:color-mix(in srgb,var(--on-bg) 90%,transparent)}
.vs-node.button::before,.vs-node.button::after{content:"";position:absolute;width:7px;height:7px;
  border:1.5px solid var(--brand)}
.vs-node.button::before{left:-1.5px;top:-1.5px;border-right:0;border-bottom:0}
.vs-node.button::after{right:-1.5px;bottom:-1.5px;border-left:0;border-top:0}
.vs-node.button.linked{background:color-mix(in srgb,var(--brand) 26%,transparent);
  border-width:2.5px}
.vs-node.input{border-bottom:2px solid var(--cool)}
.vs-node.image{border:1px solid var(--line);border-radius:4px;
  background:linear-gradient(to bottom right,transparent calc(50% - 1px),
    color-mix(in srgb,var(--line) 90%,transparent) 50%,transparent calc(50% + 1px)),
    linear-gradient(to bottom left,transparent calc(50% - 1px),
    color-mix(in srgb,var(--line) 90%,transparent) 50%,transparent calc(50% + 1px))}
.vs-node.toggle{border:1.5px solid var(--warm);border-radius:99px}
.vs-empty{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;line-height:16px;
  color:color-mix(in srgb,var(--on-raised) 70%,transparent)}
/* 页面形态下钻面板：底部对齐、Overlay32 上圆角、surfaceBase 底 */
.sheet-scrim{position:absolute;inset:0;z-index:70;background:rgba(0,0,0,.36);
  display:flex;align-items:flex-end;animation:fadeIn var(--t-fast) linear both}
.pg-sheet{width:100%;max-width:520px;margin:0 auto;max-height:92%;overflow-y:auto;
  background:var(--bg);border-radius:32px 32px 0 0;padding:10px 20px 24px;
  animation:sheetUp var(--t-normal) var(--ease) both}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.pg-sheet .handle{width:36px;height:4px;border-radius:10px;background:var(--line);margin:0 auto 12px}
.pg-sheet-head{display:flex;align-items:center;gap:8px}
.pg-sheet-head .pst{flex:1;min-width:0}
.pg-sheet-head b{display:block;font-size:14px;line-height:20px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-sheet-head em{font-style:normal;display:block;font-size:11px;line-height:16px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-sheet .vwrap{display:flex;justify-content:center;margin-top:14px}
.pg-sheet .vwrap .vscreen{width:100%;max-width:240px;height:360px;aspect-ratio:auto}
.legend{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.legend span{font-size:11px;line-height:16px;color:var(--muted)}
.pg-edges{margin-top:14px}
.pg-edges>strong{font-size:14px;line-height:20px;font-weight:600}
.pg-edge{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12px;line-height:16px;
  text-align:left;width:100%}
.pg-edge .ic{width:12px;height:12px;color:var(--brand);flex:none}
.pg-edge.dim .ic{color:var(--outline)}
.pg-edge span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============================================================
   测试 / 调试二级页（对齐 TestScreen / DebugScreen 的信息密度）
   ============================================================ */
.tool-page{padding-bottom:8px}
.tool-title{display:flex;align-items:center;gap:10px;margin-top:12px}
.tool-title .ic{width:24px;height:24px;color:var(--brand);flex:none}
.tool-title b{flex:1;font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.2px}
.tool-sub{margin:2px 0 0;font-size:12px;line-height:16px;color:var(--muted)}
.tool-row{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.pill-btn{padding:7px 12px;border-radius:999px;font-size:12px;line-height:16px;font-weight:500;
  background:transparent;border:1px solid var(--line);color:var(--on-bg)}
.pill-btn.on{background:var(--brand-c);border-color:transparent;color:var(--on-brand-c);font-weight:600}
.preset{margin-top:10px;padding:14px;border-radius:20px;background:var(--card);
  border:1px solid var(--card-border)}
.preset .ph{display:flex;align-items:center;gap:8px}
.preset .ph b{flex:1;min-width:0;font-size:14px;line-height:20px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preset p{margin:4px 0 0;font-size:12px;line-height:16px;color:var(--muted)}
.preset .pa{display:flex;gap:8px;margin-top:10px}
.preset .pa .btn{flex:1;height:34px;font-size:12px;line-height:16px;border-radius:999px}
.preset .pa .btn.primary{padding:0 12px}
/* 指标格：2 列 */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.metric{padding:14px;border-radius:20px;background:var(--card);border:1px solid var(--card-border)}
.metric span{display:block;font-size:11px;line-height:16px;color:var(--muted)}
.metric b{display:block;margin-top:4px;font-size:22px;line-height:28px;font-weight:700;
  font-variant-numeric:tabular-nums}
/* 时间轴：左侧竖线 + 步骤行 */
.flow{margin-top:10px;position:relative;padding-left:18px}
.flow::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line)}
.flow-item{position:relative;padding:6px 0}
.flow-item::before{content:"";position:absolute;left:-17px;top:12px;width:7px;height:7px;border-radius:99px;
  background:var(--brand)}
.flow-item.err::before{background:var(--err)}
.flow-item.wait::before{background:var(--outline)}
.flow-item b{display:block;font-size:13px;line-height:18px;font-weight:600}
.flow-item em{font-style:normal;display:block;font-size:11px;line-height:16px;color:var(--muted)}
.log{
  margin-top:8px;padding:12px;border-radius:14px;background:var(--sunken);border:1px solid var(--line);
  font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:11px;line-height:18px;
  color:var(--on-raised);max-height:320px;overflow-y:auto;white-space:pre-wrap;
}
.log .lv-w{color:var(--warn)}

   动画只由外层 .item-wrap.anim 播一次（新条目 fresh 时挂上），
   内部气泡/工具卡/完成卡一律不单独动画，否则每次状态刷新都会闪一下。
   ============================================================ */
.agent-list > .item-wrap{animation:none}

}
.model-chip{transition:transform var(--t-fast) var(--ease),border-color var(--t-fast)}
.model-chip:active{transform:scale(.97)}

html[data-borders="off"] *{border-color:transparent}
html[data-borders="off"] .spin{border-color:transparent;border-top-color:var(--brand)}
html[data-borders="off"] .dock,
html[data-borders="off"] .nav,

html[data-frost="off"] *{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}

html[data-frost="off"] .nav,
html[data-frost="off"] .dock,
html[data-frost="off"] .floatwin,
html[data-frost="off"] .toast{background:var(--glass-solid)}

html[data-glow="on"] .screen::before{

    color-mix(in srgb,var(--brand) 15%,transparent), transparent 62%),
    radial-gradient(90% 60% at 50% 100%,
    color-mix(in srgb,var(--cool) 9%,transparent), transparent 66%);
}

.touchdot{
  position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:99px;

}
@keyframes touchRipple{from{transform:scale(.4);opacity:.9}to{transform:scale(2.2);opacity:0}}

function render(){
  renderHeader();
  renderNav();
  renderView();
  renderDock();
  renderLayer();
  const main = $('#main');
  const hasDock = S.tab==='agent' && !S.page && !!$('#dock').innerHTML.trim();
  main.classList.toggle('hasdock', hasDock);
  main.classList.toggle('subpage', !!S.page);

function renderView(){
  const v = $('#view');
  // 主页 / 设置 / 设置二级页：内容横向留白 20dp（16 栅格 + 4）
  v.classList.toggle('wide', !!S.page || S.tab==='home' || S.tab==='settings');
  // 对话页：Compose 侧横向内边距 12dp，比 16 栅格少 4
  v.classList.toggle('chat', S.tab==='chat' && !S.page);
  // 编码页：CodingScreen 的横向内边距同样是 AppSpacing.Md = 12dp
  v.classList.toggle('coding', S.tab==='coding' && !S.page);
  // 二级页的页头跟内容一起滚动：返回圆钮独占一行，标题与下面的卡片左对齐。
  // 不用悬浮玻璃页眉——那会把标题右移一个返回钮的宽度，跟内容错位。
  if(S.page){
    const p = PAGES[S.page] || {t:'', s:''};
    v.innerHTML = '<div class="page-head">'+
      '<button class="backbtn" data-act="back" aria-label="返回">'+icon('back','lg')+'</button>'+
      '<h1>'+esc(p.t)+'</h1>'+(p.s ? '<p>'+esc(p.s)+'</p>' : '')+
      '</div>'+pageHTML(S.page);
  }
  else if(S.tab==='home') v.innerHTML = homeHTML();
  else if(S.tab==='agent') v.innerHTML = agentHTML();
  else if(S.tab==='chat') v.innerHTML = chatHTML();
  else if(S.tab==='coding') v.innerHTML = codingHTML();
  else if(S.tab==='memory') v.innerHTML = memoryHTML();
  else if(S.tab==='settings') v.innerHTML = settingsHTML();
  sectify(v);
}
/* 把「分组标题 + 内容卡」收进一块分区容器：对齐 SettingsSection 的色相底 + 眉条 */
function sectify(root){
  Array.from(root.querySelectorAll('.grp-label')).forEach(lbl=>{
    if(lbl.closest('.sec-box')) return;
    const box = document.createElement('div');
    box.className = 'sec-box tone-'+(lbl.dataset.tone||'brand');
    lbl.parentNode.insertBefore(box, lbl);
    box.appendChild(lbl);
    let n = box.nextElementSibling;
    while(n){
      if(n.classList.contains('grp-label') || n.classList.contains('version') ||
         n.matches('button,.sub-note') || n.querySelector('button.btn')) break;
      const nx = n.nextElementSibling;
      box.appendChild(n);
      n = nx;
    }
  });
}
function setTab(id){
  if(!S.tabsVisible[id]) return;
  S.tab = id; S.page = null; S.drawer=false; memSel=null; S.modeOpen=false;
  scroller.scrollTop = 0;
  hdrInner.classList.remove('on');
  render();
}
function openPage(p){
  S.page = p; S.drawer=false; S.modeOpen=false;
  scroller.scrollTop = 0;

function goBack(){
  S.page = null; scroller.scrollTop = 0;

}

   事件委托
   ============================================================ */
document.addEventListener('input', e=>{
  const t = e.target;
  if(t.dataset && t.dataset.model === 'draft'){
    draft = t.value;
    autoGrow(t);
  }
  if(t.dataset && t.dataset.field){
    S[t.dataset.field] = t.value;
  }
  if(t.dataset && (t.dataset.model === 'chatDraft' || t.dataset.model === 'codingDraft')){
    if(t.dataset.model === 'chatDraft') chatDraft = t.value; else codingDraft = t.value;
    autoGrow(t);
    const b = t.parentNode.querySelector('.sendbtn');
    if(b) b.disabled = !t.value.trim() || (t.dataset.send === 'coding' && S.coding.busy);
  }
  if(t.id === 'codingManual'){ codingManual = t.value; }
  if(t.id === 'codingWsName'){ codingWsName = t.value; }
  /* 协助浮层自由输入 */
  if(t.dataset && t.dataset.assist === 'draft'){
    if(S.assist){ S.assist.draft = t.value; }
    // 只切换提交键的可用态，不整页重渲染（否则输入框会丢焦点）
    const btn = t.closest('.assist') && t.closest('.assist').querySelector('[data-act="assist-submit"]');
    if(btn){
      const on = !!t.value.trim();
      btn.classList.toggle('primary', on);
      btn.classList.toggle('dim', !on);
    }
    autoGrow(t);
  }
  /* 技能编辑器表单 */
  if(t.dataset && t.dataset.sk){
    if(S.skill.editor) S.skill.editor[t.dataset.sk] = t.value;
  }
  /* MCP 市场搜索：输入即筛，重建列表但保留焦点与光标 */
  if(t.dataset && t.dataset.mcp === 'kw'){
    if(S.skill){ S.skill.marketKw = t.value; }
    const pos = t.selectionStart;
    render();
    const back = document.querySelector('[data-mcp="kw"]');
    if(back){ back.focus(); back.setSelectionRange(pos, pos); }
    return;
  }
  if(t.dataset && t.dataset.glass){
    S.glassMix = +t.value;
    applyChrome();
    const lbl = t.parentNode.querySelector('.fld-lbl');
    if(lbl) lbl.textContent = S.glassMix === 0 ? '浓淡  默认'
      : (S.glassMix < 0 ? '浓淡  更透 '+(-S.glassMix) : '浓淡  更实 '+S.glassMix);
  }
});
document.addEventListener('keydown', e=>{
  if(e.target.tagName === 'TEXTAREA' && e.key === 'Enter' && !e.shiftKey && e.target.dataset.send){
    e.preventDefault();
    sendByScope(e.target.dataset.send);
  }
  if(e.key === 'Escape'){
    if(S.drawer){ S.drawer=false; render(); }
    else if(S.agent.preview){ S.agent.preview=false; render(); }
    else if(S.page){ goBack(); }
  }
});
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;
  const val = el.dataset.val;
  handle(act, val, el, e);
});

function railHTML(){
  const a = S.agent;
  let dots = '';
  for(let i=1;i<=a.total;i++){
    const cls = i === a.step && a.running ? 'on' : (i < a.step || (!a.running && a.phase==='DONE') ? 'done' : '');
    dots += '<span class="rdot '+cls+'"></span>';
  }
  return '<div class="rail" aria-hidden="true">'+dots+'</div>';

function agentItemHTML(it, i){
  const delay = Math.min(i*45, 360);
  const cls = 'item-wrap '+(it.fresh?'anim':'');
  let inner = '';
  if(it.kind === 'user'){
    inner = '<div class="row-me"><div class="bubble '+(it.queue?'queue':'')+'">'+esc(it.text)+
      (it.queue ? '<div class="qtag"><span class="dot"></span>排队中 · 当前任务结束后执行</div>' : '')+
      '</div></div>';
  }else if(it.kind === 'stream'){
    inner = '<div class="ai-bubble"><div class="ai-head"><span class="pdot"></span><b>AI 正在规划</b></div>'+
      '<div id="typing" class="ai-txt '+(it.typing?'caret':'')+'">'+esc(it.text||'')+'</div>'+
      (it.planLines ? '<div class="plan-lines">'+it.planLines+'</div>' : '')+'</div>';
  }else if(it.kind === 'approved'){
    inner = '<div class="badge-card"><span class="pdot"></span>计划已批准，开始执行</div>';
  }else if(it.kind === 'tool'){
    inner = '<div class="tool"><span class="idx">'+it.idx+'</span>'+
      '<div class="tool-b"><b>'+esc(it.title)+'</b><em>'+esc(it.detail)+'</em></div>'+
      '<div class="state">'+(it.state==='done'
        ? '<span style="color:var(--brand)">'+icon('checkCircle','sm')+'</span>'
        : '<span class="spin"></span>')+'</div></div>';
  }else if(it.kind === 'live'){
    inner = '<div class="live-msg"><span class="dot brand run"></span><span class="shimmer">'+esc(it.text)+'</span></div>';
  }else if(it.kind === 'done'){
    inner = '<div class="done-card"><div class="done-head">'+icon('checkCircle','lg')+
      '<b>任务完成</b><span class="pill ok">生效 '+it.steps+'/'+it.steps+' 步</span></div>'+
      '<p>'+esc(it.note)+'</p>'+
      '<div class="done-meta"><span>'+esc(it.tokens)+' tokens</span><span>平均响应 '+esc(it.avg)+'</span></div></div>';
  }else if(it.kind === 'failed'){
    // 对齐 FailedItem：只有链路/步数/未分类才给「重试」，配置缺失给「去配置」，用户停止不给按钮
    const canRetry = ['max','decision','unknown'].includes(it.kind2);
    const needCfg = it.kind2 === 'config';
    const acts = canRetry
      ? '<div class="fail-actions"><button class="btn primary sm" data-act="agent-retry">'+icon('refresh','sm')+'重试</button></div>'
      : needCfg
        ? '<div class="fail-actions"><button class="btn neutral sm" data-act="open-page:cloud">'+icon('settings','sm')+'去配置</button></div>'
        : '';
    inner = '<div class="fail-card"><div class="fail-head">'+icon('error','s18')+'<b>'+esc(it.title)+'</b></div>'+
      '<p>'+esc(it.desc||'执行过程中出错，可重新下达任务')+'</p>'+acts+'</div>';
  }else if(it.kind === 'notice'){
    inner = '<div class="notice-card">'+icon('touch','sm')+'<span>'+esc(it.text)+'</span></div>';
  }else if(it.kind === 'note'){
    inner = '<div class="note-bubble"><div class="nb-head">'+icon('info','sm')+
      '<b>'+esc(it.label||'完成说明')+'</b></div><div class="nb-txt">'+esc(it.text)+'</div></div>';
  }
  return '<div class="'+cls+'" style="animation-delay:'+delay+'ms">'+inner+'</div>';
}

function renderDock(){
  const dock = $('#dock');
  if(S.tab !== 'agent' || S.page){ dock.innerHTML = ''; return; }
  const a = S.agent;
  let h = '';
  if(a.planning || a.running) h += stripHTML();
  if(S.queue.length && !a.running && !a.planning){
    h += '<div class="queue-strip"><b>还有 '+S.queue.length+' 条任务排队等待执行</b>'+
      '<button data-act="queue-view">查看</button></div>';
  }
  if(a.plan){
    h += planPanelHTML();
  }else if(S.assist){
    // 协助浮层占用底部操作区：输入面让位，避免同屏两个输入框
    h += assistHTML();
  }else{
    h += composerHTML();
    const mode = composerMode();
    if(mode === 'NEW_TASK' || mode === 'QUEUE_FOLLOW_UP') h += modebarHTML();
  }
  dock.innerHTML = h;
  const ta = dock.querySelector('textarea');
  if(ta){
    if(draft) autoGrow(ta);
    ta.addEventListener('focus', ()=>ta.parentNode.classList.add('focus'));
    ta.addEventListener('blur', ()=>ta.parentNode.classList.remove('focus'));
    // 长按输入框 = 语音录入（VoiceRecordField 的手势规则：250ms 内抬起算点击）
    let holdTimer = null;
    ta.addEventListener('pointerdown', e=>{
      if(ta.disabled) return;
      if(document.activeElement === ta) return;   // 键盘已拉起时长按让位文本选择
      holdTimer = setTimeout(()=>{ holdTimer = null; voiceStart(); }, 250);
    });
    const endHold = ()=>{
      if(holdTimer){ clearTimeout(holdTimer); holdTimer = null; return; }
      if(S.voice) voiceEnd();
    };
    ta.addEventListener('pointerup', endHold);
    ta.addEventListener('pointercancel', endHold);
    ta.addEventListener('pointerleave', ()=>{
      if(holdTimer){ return; }
      if(S.voice && S.voice.zone === 'none') voiceZone('cancel');
    });
  }
  // 录音浮层：上滑到左右分区（预览 / 取消）
  if(S.voice){
    const v = document.querySelector('.voice');
    if(v){
      const l = v.querySelector('.voice-zone.l');
      const r = v.querySelector('.voice-zone.r');
      if(l) l.addEventListener('click', ()=>voiceZone('preview'));
      if(r) r.addEventListener('click', ()=>voiceZone('cancel'));
    }
  }
  // 协助浮层的自由输入框：回车提交
  const at = dock.querySelector('textarea[data-assist="draft"]');
  if(at){
    autoGrow(at);
    at.addEventListener('keydown', e=>{
      if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); assistSubmit(); }
    });
  }
}

/* 会话列表副行：更新时间 · 消息数（对齐 "${formatTime(updatedAt)} · ${count} 条"） */
function sessionMeta(s){
  const t = s.updatedAt ? fmtCodingTime(s.updatedAt) : '';
  return (t ? t+' · ' : '')+s.messages.length+' 条';
}
function fmtCodingTime(ts){
  const d = new Date(ts), now = new Date();
  const two = n=>String(n).padStart(2,'0');
  const hm = two(d.getHours())+':'+two(d.getMinutes());
  const sameDay = d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
  return sameDay ? hm : two(d.getMonth()+1)+'-'+two(d.getDate())+' '+hm;
}
/* 会话图谱：中心 = 当前工作区，周围 = 各会话；点节点即切会话（复刻 Canvas 版 SessionGraph） */
function sessionGraphHTML(c){
  const n = c.sessions.length;
  const pts = c.sessions.map((s,i)=>{
    const a = -Math.PI/2 + 2*Math.PI*i/n;
    const ring = n <= 6 ? .33 : (i%2===0 ? .30 : .40);
    return {s, x:(0.5+ring*Math.cos(a))*100, y:(0.5+ring*Math.sin(a)*.85)*100};
  });
  const lines = pts.map(p=>'<line x1="50" y1="50" x2="'+p.x.toFixed(2)+'" y2="'+p.y.toFixed(2)+'" '+
    'vector-effect="non-scaling-stroke" stroke="var(--line)" stroke-opacity=".45" stroke-width="1.5"/>').join('');
  return '<div class="sess-graph">'+
    '<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">'+lines+'</svg>'+
    '<span class="sg-hint">点节点切换会话</span>'+
    '<div class="sg-core">工作区</div>'+
    pts.map(p=>'<div class="sg-node '+(p.s.id===c.active?'on':'')+'" data-act="coding-session-open" data-val="'+p.s.id+
      '" role="button" tabindex="0" style="left:'+p.x.toFixed(2)+'%;top:'+p.y.toFixed(2)+'%">'+
      '<span class="sg-dot"></span><span class="sg-label">'+esc(String(p.s.title).slice(0,9))+'</span></div>').join('')+
    '</div>';
}

  const body = items.length ? items.map(t=>{
    const armed = memArmed === t.id;
    return '<div class="tmem"><div class="tmem-top"><b>'+esc(t.taskName)+'</b>'+
      '<span class="pill '+(t.pill||'ok')+'">'+esc(t.label)+'</span>'+
      '<button class="tmem-del '+(armed?'armed':'')+'" data-act="mem-del:'+t.id+'" '+
        'aria-label="'+(armed?'再点确认删除':'删除')+'">'+icon('trash','sm')+'</button></div>'+
      (t.steps>0 ? '<div class="tmem-step">已验证 '+t.steps+' 步</div>' : '')+
      taskSecHTML('目标',[t.goal])+
      (t.requirements.length ? taskSecHTML('用户要求', t.requirements) : '')+
      (t.methods.length ? taskSecHTML('完成方法', t.methods) : '')+
      '</div>';
  }).join('') : '<div class="mempty">暂无任务记忆</div>';
  return memCardHTML('任务记忆', items.length, 'var(--brand)', body, 'mem-clear:tasks');
}
function anomalyCard(){
  const items = S.memory.anomalies;
  const body = items.length ? items.map(a=>
    '<div class="mline"><span class="mdot" style="background:'+MEM_ANOMALY+'"></span>'+
      '<span class="mtxt"><b>'+esc(a.anomalyType)+'</b>'+

function profileCard(){

    '<div class="mline"><span class="mic" style="color:'+MEM_PROFILE+'">'+icon('person','sm')+'</span>'+
      '<span class="mtxt"><b>'+esc(p.key)+'</b>'+
      '<span>'+esc(p.value)+' · 置信 '+Math.round((p.confidence==null?0.9:p.confidence)*100)+'%</span></span></div>'

function memoryHTML(){
  const m = S.memory;
  const seg = memSegHTML();

  if(m.tab === 'pages'){
    return seg+pageMemoryHTML();

  if(!m.taskMemories.length && !m.anomalies.length && !m.profiles.length){
    return seg+
      '<div class="empty-card mem"><span class="big">'+icon('memory','lg')+'</span>'+
      '<b>暂无积累的记忆</b>'+
      '<p>Agent 完成任务、遇到异常时会沉淀记忆，形成图谱</p>'+
      '<button class="btn ghost sm" data-act="mem-refresh">刷新</button></div>';
  }
  return seg+graphHTML()+

    '<div style="height:8px"></div>'+

function pageMemoryHTML(){
  const m = S.memory;
  const pages = m.pages || [];
  const edges = m.edges || [];
  if(!pages.length){
    return '<div class="empty-card mem"><span class="big">'+icon('globe','lg')+'</span>'+
      '<b>暂无页面记忆</b>'+
      '<p>Agent 操作过的页面结构会沉淀在这里，下次进入同一页可直接复用。</p>'+
      '<button class="btn neutral sm" data-act="mem-refresh">刷新</button></div>';
  }
  const byApp = {};
  pages.forEach(p=>{ (byApp[p.app] = byApp[p.app] || []).push(p); });
  const body = Object.keys(byApp).map(app=>{
    const list = byApp[app];
    const rows = [];
    for(let i=0;i<list.length;i+=2){
      rows.push('<div class="pg-grid" style="margin-bottom:10px">'+list.slice(i,i+2).map(p=>{
        const out = edges.filter(e=>e.app===app && e.from===p.fp).length;
        return '<div class="pg-card" data-act="pg-open" data-val="'+p.fp+'" role="button" tabindex="0">'+
          '<button class="pdel '+(S.memPage.armed===p.fp?'armed':'')+'" data-act="pg-del" data-val="'+p.fp+'" '+

          '<em>'+pageOfType(p.type)+' · 来过 '+p.visits+' 次'+(out?' · '+out+' 条路径':'')+'</em>'+
        '</div>';
      }).join('')+(list.slice(i,i+2).length===1?'<span></span>':'')+'</div>');
    }
    return '<div class="pg-group"><span class="gdot"></span><b>'+esc(app)+'</b>'+
      '<span>'+list.length+' 页</span></div>'+rows.join('');
  }).join('');
  return memCardHTML('页面记忆', pages.length, 'var(--cool)', body, 'mem-clear:pages');
}
/* 虚拟画面：按 kind 画线框（blocked 由 linkedControls 决定是否高亮） */
function vscreenHTML(shapes, linked, interactive){
  if(!shapes || !shapes.length) return '<div class="vscreen"><span class="vs-empty">暂无控件记忆</span></div>';
  const nodes = shapes.map((n,i)=>{
    const style = 'left:'+(n.l*100).toFixed(2)+'%;top:'+(n.t*100).toFixed(2)+'%;'+
      'width:'+((n.r-n.l)*100).toFixed(2)+'%;height:'+((n.b-n.t)*100).toFixed(2)+'%';
    const on = linked.indexOf(n.label) >= 0;
    const act = (interactive && on) ? ' data-act="pg-node" data-val="'+i+'" role="button" tabindex="0"' : '';
    if(n.kind === 'text'){
      const bar = (n.b-n.t) < 0.035;
      return '<div class="vs-node text '+(bar?'bar':'')+'" style="'+style+'"'+act+'>'+
        (bar?'':esc(n.label||''))+'</div>';
    }
    if(n.kind === 'button'){
      return '<div class="vs-node button '+(on?'linked':'')+'" style="'+style+'"'+act+'>'+
        esc(n.label||'')+'</div>';
    }
    return '<div class="vs-node '+n.kind+'" style="'+style+'"'+act+'></div>';
  }).join('');
  return '<div class="vscreen">'+nodes+'</div>';
}
/* 页面形态下钻面板 */
function pageShapeSheetHTML(){
  const m = S.memory;
  const stack = S.memPage.stack;
  const cur = stack[stack.length-1];
  if(!cur) return '';
  const edges = (m.edges||[]).filter(e=>e.app===cur.app && e.from===cur.fp);
  const linked = edges.map(e=>e.ctl);
  const findPage = fp => (m.pages||[]).find(p=>p.fp===fp);
  const back = stack.length > 1
    ? '<button class="iconbtn tiny" data-act="pg-stack-back" aria-label="返回上一页">'+icon('back','sm')+'</button>' : '';
  const edgeRows = edges.map(e=>{
    const t = findPage(e.to);
    return '<button class="pg-edge '+(t?'':'dim')+'" '+(t?'data-act="pg-drill" data-val="'+e.to+'"':'disabled')+'>'+
      icon('chev','sm')+'<span>'+esc(e.action)+'（id='+esc(e.ctl)+'） → '+
      esc(t?(t.title||'其他页面'):'其他页面')+'（走过 '+e.count+' 次）</span></button>';
  }).join('');
  return '<div class="sheet-scrim" data-act="pg-close"><div class="pg-sheet" data-act="noop">'+
    '<div class="handle"></div>'+
    '<div class="pg-sheet-head">'+back+
      '<span class="pst"><b>'+esc(cur.title||'未命名页面')+'</b>'+
        '<em>'+esc(cur.app.split('.').pop())+' · 来过 '+cur.visits+' 次 · '+cur.shapes.length+' 个控件</em></span>'+
      '<button class="iconbtn tiny" data-act="pg-close" aria-label="关闭">'+icon('close','sm')+'</button>'+
    '</div>'+
    '<div class="vwrap">'+vscreenHTML(cur.shapes, linked, edges.length>0)+'</div>'+
    '<div class="legend"><span>描边角标=可点按钮</span><span>下划线=输入框</span>'+
      '<span>叉线=图片</span><span>胶囊=开关</span></div>'+
    (edges.length
      ? '<div class="pg-edges"><strong>可跳转路径</strong>'+edgeRows+'</div>'
      : '<div class="pg-edges"><strong>可跳转路径</strong>'+
        '<p class="tool-sub" style="margin-top:6px">这个页面还没有走出边，多操作几次会自动积累。</p></div>')+
  '</div></div>';
}
function graphHTML(){
  const m = S.memory;
  const an = m.anomalies, pr = m.profiles;
  const sideMax = Math.max(an.length, pr.length);
  const height = Math.min(900, Math.max(320, 120 + sideMax*64));
  // 节点直径按 min(画布宽, 画布高) 换算，与 GraphCanvas 的比例半径一致
  // 屏幕固定 412 宽（模拟手机内），不再读窗口宽度
  const pageW = 412 - 32;
  const unit = Math.min(pageW, height);
  const itemY = (i,n)=> n<=1 ? 0.5 : 0.10 + 0.80*i/(n-1);
  const nodes = [];
  nodes.push({id:'root', x:50, y:50, size:unit*0.17, color:'var(--brand)',
    label:'AI 记忆', sub:'共 '+(an.length+pr.length)+' 条'});
  nodes.push({id:'cat-anomaly', x:30, y:50, size:unit*0.13, color:MEM_ANOMALY,
    label:'异常经验', sub:an.length+' 条'});
  nodes.push({id:'cat-profile', x:70, y:50, size:unit*0.13, color:MEM_PROFILE,
    label:'用户画像', sub:pr.length+' 条'});
  an.forEach((a,i)=>{
    nodes.push({id:'anomaly-'+i, x:11, y:itemY(i,an.length)*100, size:unit*0.08, item:true,
      color:'#F0BC8C', label:a.anomalyType, sub:a.appPackage});
  });
  pr.forEach((p,i)=>{
    nodes.push({id:'profile-'+i, x:89, y:itemY(i,pr.length)*100, size:unit*0.08, item:true,
      color:'#A9CBDD', label:p.key, sub:p.value});
  });

  const edges = [];
  nodes.filter(n=>n.id.startsWith('anomaly-')).forEach(n=>edges.push(['cat-anomaly',n.id]));
  nodes.filter(n=>n.id.startsWith('profile-')).forEach(n=>edges.push(['cat-profile',n.id]));
  edges.push(['root','cat-anomaly']); edges.push(['root','cat-profile']);
  const byId = Object.fromEntries(nodes.map(n=>[n.id,n]));
  const svg = '<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">'+
    edges.map(([a,b])=>{
      const A = byId[a], B = byId[b];
      const strong = a === 'root';
      return '<line x1="'+A.x+'" y1="'+A.y+'" x2="'+B.x+'" y2="'+B.y+'" '+
        'stroke="var(--outline)" stroke-opacity="'+(strong?0.60:0.35)+'" '+
        'stroke-width="'+(strong?2.5:1.5)+'" vector-effect="non-scaling-stroke"/>';
    }).join('')+'</svg>';

  const nodeHTML = nodes.map(n=>{
    const isItem = !!n.item;
    const sz = Math.round(n.size);
    return '<div class="gnode '+(n.id==='root'?'groot':'')+' '+(memSel===n.id?'sel':'')+'" '+
      'style="left:'+n.x+'%;top:'+n.y+'%;--c:'+n.color+'" data-act="node" data-val="'+n.id+'">'+
      '<span class="gdot" style="width:'+sz+'px;height:'+sz+'px;background:'+n.color+';'+
        'box-shadow:0 0 0 '+Math.round(n.size*0.075)+'px color-mix(in srgb,'+n.color+' 25%,transparent)">'+
        (isItem ? '' : '<b>'+esc(String(n.label).slice(0,8))+'</b>')+'</span>'+
      (isItem
        ? '<span class="glabel">'+esc(String(n.label).slice(0,7))+'</span>'+
          '<span class="gsub">'+esc(String(n.sub).slice(0,9))+'</span>'
        : '<span class="gsub on">'+esc(String(n.sub).slice(0,10))+'</span>')+
    '</div>';
  }).join('');

  const sel = nodes.find(n=>n.id===memSel);
  const detail = sel
    ? '<div class="gdetail" style="background:color-mix(in srgb,'+sel.color+' 12%,transparent)">'+
        '<span class="gd-dot" style="background:'+sel.color+'"></span>'+
        '<span class="gd-txt"><b>'+esc(sel.label)+'</b>'+
          '<span>'+esc(sel.sub)+'</span></span>'+
        '<button class="gd-close" style="color:'+sel.color+'" data-act="node-close">关闭</button></div>'
    : '';

  return '<div class="graph" style="height:'+height+'px">'+svg+nodeHTML+'</div>'+
    detail+
    '<p class="graph-hint">双指缩放图谱 · 点击节点查看详情</p>';
}

/* ============================================================
   浮层：悬浮窗 / 预览 / 抽屉
   ============================================================ */
function renderLayer(){
  let h = '';
  const a = S.agent;
  // 悬浮窗是"离开操控页后仍能看到进度"的系统浮层；操控页本身已有运行状态条，不再叠一层
  if(a.running && !a.hidden && !a.preview && (S.tab !== 'agent' || S.page)) h += floatwinHTML();
  if(a.preview) h += previewHTML();
  if(S.drawer) h += drawerHTML();
  if(S.tab==='coding' && !S.page && S.coding.sheet) h += codingSheetHTML();
  if(S.page === 'skill' && S.skill.editor) h += skillEditorHTML();
  if(S.memPage.sel) h += pageShapeSheetHTML();
  if(S.doc) h += docViewerHTML();
  if(S.voice) h += voiceHTML();
  if(!S.onboarding.done) h += onboardingHTML();
  $('#layer').innerHTML = h;
}

let chatDraft = '';
let codingDraft = '';
let codingTimer = null;
let pendingFn = null;

function scrollBottom(){
  requestAnimationFrame(()=>{ scroller.scrollTop = scroller.scrollHeight; });
}
function pushItem(it){
  it.fresh = true;
  S.agent.items.push(it);
  setTimeout(()=>{ it.fresh = false; }, 600);
  return it;
}
function planFor(task){
  if(/字体|字号/.test(task)) return {
    confidence:0.92, seconds:40,
    steps:[
      {t:'打开「设置」', i:'从桌面进入系统设置'},
      {t:'进入「显示与亮度」', i:'定位字体与显示入口'},
      {t:'把字体大小调到最大', i:'拖动字号滑块并确认预览'}
    ]
  };
  if(/闹钟|时钟|提醒/.test(task)) return {
    confidence:0.88, seconds:35,
    steps:[
      {t:'打开「时钟」', i:'从桌面进入时钟应用'},
      {t:'新建一个闹钟', i:'点击右下角新建按钮'},
      {t:'设定 10 分钟后并保存', i:'填写时间并确认'}
    ]
  };
  if(/亮度/.test(task)) return {
    confidence:0.86, seconds:30,
    steps:[
      {t:'打开「设置」', i:'从桌面进入系统设置'},
      {t:'进入「显示与亮度」', i:'定位亮度控制'},
      {t:'把亮度拉到最高', i:'拖动亮度滑块并确认'}
    ]
  };
  if(/相册|照片|图片/.test(task)) return {
    confidence:0.90, seconds:26,
    steps:[
      {t:'打开「相册」', i:'从桌面进入相册应用'},
      {t:'切到最近项目', i:'点击底部的最近标签'},
      {t:'确认最新照片', i:'打开第一张照片查看'}
    ]
  };
  return {
    confidence:0.82, seconds:45,
    steps:[
      {t:'观察当前页面', i:'读取可操作的控件与层级'},
      {t:'定位目标入口', i:'找到与任务相关的入口'},
      {t:'执行并校验结果', i:'完成操作后检查页面变化'}
    ]
  };
}
function typeInto(el, text, done, item){
  if(!el){ done && done(); return; }
  let i = 0;
  el.textContent = '';
  el.classList.add('caret');
  if(typeTimer) clearInterval(typeTimer);
  typeTimer = setInterval(()=>{
    i += 2;
    el.textContent = text.slice(0, i);
    // 同步回写条目：否则下一次 render() 会用空的 it.text 重建气泡，文字整段消失
    if(item) item.text = el.textContent;
    if(i >= text.length){
      clearInterval(typeTimer);
      typeTimer = null;
      el.classList.remove('caret');
      done && done();
    }
  }, 26);
}
function beginTask(text){
  clearRun();
  pendingFn = null;
  const a = S.agent;
  a.task = text;
  a.planning = true;
  a.plan = null;
  a.total = 0;
  a.step = 0;
  a.confidence = 0.92;
  a.phase = 'THINKING';
  a.preview = false;
  a.hidden = false;
  a.paused = false;
  a.pending = false;
  a.startedAt = Date.now();
  pushItem({kind:'user', text});
  const streamItem = pushItem({kind:'stream', text:'', typing:true});
  draft = '';
  S.modeOpen = false;
  render();
  scrollBottom();
  const typingEl = document.getElementById('typing');
  const intro = '好的，我先看清当前页面，再把「'+text+'」拆成可验证的步骤。';
  typeInto(typingEl, intro, ()=>{
    later(()=>{
      if(!S.agent.planning) return;
      const plan = planFor(text);
      a.plan = plan;
      a.total = plan.steps.length;
      a.planSteps = plan.steps;
      a.confidence = plan.confidence;
      a.planning = false;
      a.phase = 'THINKING';
      streamItem.typing = false;
      render();
      scrollBottom();
    }, 320);
  }, streamItem);
}
function sendTask(){
  const text = draft.trim();
  if(!text) return;
  if(S.agent.planning) return;
  if(S.agent.running){
    S.queue.push(text);
    pushItem({kind:'user', text, queue:true});
    draft = '';
    render();
    scrollBottom();
    toast('已加入队列');
    return;
  }
  beginTask(text);
}
function cancelPlan(){
  clearRun();
  pendingFn = null;
  const a = S.agent;
  a.planning = false;
  a.plan = null;
  a.total = 0;
  a.step = 0;
  a.paused = false;
  a.pending = false;
  pushItem({kind:'notice', text:'已取消执行计划，未做任何操作。'});
  render();
}
function approvePlan(){
  const a = S.agent;
  if(!a.plan || a.planning) return;
  a.total = a.plan.steps.length;
  a.planSteps = a.plan.steps;
  a.plan = null;
  a.running = true;
  a.paused = false;
  a.pending = false;
  a.step = 1;
  a.phase = 'ACTING';
  a.startedAt = Date.now();
  a.confidence = a.confidence || 0.9;
  pushItem({kind:'approved'});
  render();
  scrollBottom();
  startTick();
  runStep(1);
}
function runStep(n){
  const a = S.agent;
  const step = a.planSteps[n-1];
  if(!step) { finishRun(); return; }
  a.step = n;
  a.phase = n === 1 ? 'OBSERVING' : 'ACTING';
  const t = pushItem({kind:'tool', idx:n, title:step.t, detail:step.i, state:'run'});
  render();
  scrollBottom();
  later(()=>{
    t.state = 'done';
    if(n < a.total){
      a.phase = 'OBSERVING';
      a.live = '正在核对页面变化';
      render();
      advance(()=>runStep(n+1));
    }else{
      finishRun();
    }
  }, 1500);
}
function advance(fn){
  if(S.agent.paused){
    pendingFn = fn;
    S.agent.pending = true;
    render();
    return;
  }
  fn();
}
function togglePause(){
  const a = S.agent;
  if(!a.running) return;
  a.paused = !a.paused;
  if(!a.paused && pendingFn){
    const fn = pendingFn;
    pendingFn = null;
    a.pending = false;
    render();
    fn();
    return;
  }
  render();
  toast(a.paused ? '已暂停，当前步骤完成后会停住' : '继续执行');
}
function startTick(){
  if(tickTimer) clearInterval(tickTimer);
  tickTimer = setInterval(()=>{
    const el = document.getElementById('elapsed');
    if(el) el.textContent = fmtElapsed(elapsedSec());
    const fw = document.getElementById('fwElapsed');
    if(fw) fw.textContent = fmtElapsed(elapsedSec())+' · '+S.agent.task;
  }, 1000);
}
function finishRun(){
  const a = S.agent;
  a.running = false;
  a.paused = false;
  a.pending = false;
  pendingFn = null;
  a.phase = 'DONE';
  a.step = a.total;
  if(tickTimer){ clearInterval(tickTimer); tickTimer = null; }
  const task = a.task;
  const note = /字体|字号/.test(task) ? '字体大小已调到最大，设置页里的预览也已同步。'
    : /闹钟|时钟/.test(task) ? '闹钟已设为 10 分钟后，时钟页能看到新条目。'
    : /亮度/.test(task) ? '亮度滑块已拉到最高，屏幕立即变亮。'
    : /相册|照片/.test(task) ? '相册已打开到最近项目，最新一张照片已确认。'
    : '目标步骤已全部执行完，页面停在结果所在位置。';
  pushItem({
    kind:'done', steps:a.total, note,
    tokens:(1150 + a.total*38 + task.length*2).toLocaleString('en-US'),
    avg:'1.2 秒'
  });
  S.memory.taskMemories.unshift({
    id: Date.now(), taskName: task, label: '已完成', pill: 'ok', steps: a.total,
    goal: task,
    requirements: /最大|最高|最亮/.test(task) ? ['把设置调到可选的最大值'] : [],
    methods: (a.planSteps||[]).map(s=>s.t)
  });
  if(/字体|字号/.test(task)) addProfile('字号偏好','大',task);
  else if(/闹钟|时钟/.test(task)) addProfile('提醒习惯','提前 10 分钟',task);
  else if(/亮度/.test(task)) addProfile('亮度偏好','最高',task);
  else addProfile('交互习惯','偏好直接执行',task);
  if(S.pageMemory) addPageMemory(task);
  S.tasks.push({text:task, stepLabel:'已完成 · '+a.total+' 步'});
  render();
  scrollBottom();
  toast('任务完成');
  if(S.queue.length){
    const next = S.queue[0];
    setTimeout(()=>{
      if(S.agent.running || S.agent.planning) return;
      S.queue.shift();
      S.agent.items = S.agent.items.filter(it=>!(it.kind==='user' && it.queue && it.text===next));
      beginTask(next);
    }, 1400);
  }
}
function addProfile(key, value, from){
  if(S.memory.profiles.some(p=>p.key===key && p.value===value)) return;
  S.memory.profiles.push({key, value, from});
}
function addPageMemory(task){
  let m = {title:'当前页面', page:'前台应用', detail:'任务从当前可见页面开始操作', time:'刚刚'};
  if(/字体|字号/.test(task)) m = {title:'字体大小', page:'设置 · 显示与亮度', detail:'字号滑块在页面底部，可直接拖到最右端', time:'刚刚'};
  else if(/闹钟|时钟/.test(task)) m = {title:'新建闹钟', page:'时钟 · 闹钟', detail:'右下角新建按钮进入编辑页', time:'刚刚'};
  else if(/亮度/.test(task)) m = {title:'亮度滑块', page:'设置 · 显示与亮度', detail:'亮度条位于页面顶部，可拖到最右端', time:'刚刚'};
  else if(/相册|照片/.test(task)) m = {title:'最近项目', page:'相册 · 最近', detail:'首屏即最近照片网格', time:'刚刚'};
  if(!S.memory.pages.some(p=>p.title===m.title)) S.memory.pages.push(m);
}
function addAnomaly(type, desc){
  const hit = S.memory.anomalies.find(a=>a.anomalyType===type);
  if(hit){ hit.hitCount += 1; return; }
  S.memory.anomalies.push({anomalyType:type, anomalyDescription:desc,
    appPackage:'com.phoneagent', hitCount:1});
}
function stopRun(){
  clearRun();
  pendingFn = null;
  const a = S.agent;
  a.running = false;
  a.paused = false;
  a.pending = false;
  a.planning = false;
  a.phase = 'DONE';

}
function retryTask(){
  const t = S.agent.task || draft;
  if(!t) return;
  if(S.agent.running || S.agent.planning) return;
  draft = t;
  beginTask(t);
}
function sendByScope(scope){

}

function openSkillEditor(id, macro){
  const s = id ? (S.skills||[]).find(x=>x.id===id) : null;
  S.skill.editor = {
    id: s ? s.id : 'skill_' + Math.random().toString(36).slice(2,6),
    macro: macro || (s && s.source === 'macro') || false,
    editing: !!s,
    name: s ? s.name : '',
    category: s ? s.category : '自定义',
    desc: s ? s.desc : '',
    intent: '',
    params: s ? (s.params||0) : 0,
    steps: s ? (s.steps||0) : 0
  };
  render();

function saveSkillEditor(){
  const e = S.skill.editor;
  if(!e) return;
  if(!e.name.trim()){ toast('请先填写技能名称'); return; }
  if(e.macro && !e.steps){ toast('宏至少需要一个步骤'); return; }
  const rec = {
    id:e.id, name:e.name.trim(), desc:e.desc.trim(), category:e.category.trim()||'自定义',
    params:e.params, steps:e.macro?e.steps:0,
    source:e.macro?'macro':'intent', builtin:false, enabled:true
  };
  const i = S.skills.findIndex(x=>x.id===e.id);
  if(i >= 0) S.skills[i] = Object.assign({}, S.skills[i], rec);
  else S.skills.push(rec);
  S.skill.editor = null;
  render();
  toast(e.editing ? '已保存修改' : '已新增技能');
}

  const e = S.skill.editor;
  if(!e) return '';
  const field = (label, key, ph, area) =>
    '<div class="field" style="padding:0">'+
      '<label>'+label+'</label>'+
      (area
        ? '<textarea data-sk="'+key+'" rows="3" placeholder="'+ph+'">'+esc(e[key]||'')+'</textarea>'
        : '<input data-sk="'+key+'" value="'+esc(e[key]||'')+'" placeholder="'+ph+'">')+
    '</div>';
  return '<div class="iov-scrim" data-act="skill-close"><div class="iov" data-act="noop">'+
    '<div class="iov-head"><span class="iht">'+
      '<h3>'+(e.editing ? (e.macro?'编辑宏技能':'编辑技能') : (e.macro?'新增宏技能':'新增技能'))+'</h3>'+
      '<p>保存后 AI 就能在合适的时候调用它</p></span>'+
      '<button class="iconbtn tiny" data-act="skill-close" aria-label="关闭">'+icon('close','sm')+'</button></div>'+
    field('名称（必填，AI 与用户可见）','name','如 打开应用')+
    '<div class="field" style="padding:0"><label>ID（'+(e.editing?'不可修改':'将自动生成')+'）</label>'+
      '<input value="'+esc(e.id)+'" disabled style="opacity:.6"></div>'+
    field('分类（如 自定义 / 系统 / 工具）','category','自定义')+
    field('说明（喂给 AI 以决定何时调用）','desc','一句话说清这个技能做什么','area')+
    (e.macro
      ? '<div class="iov-lbl">步骤（按顺序执行，失败即停）</div>'+
        '<div class="iov-manual"><input value="'+e.steps+' 个步骤" disabled style="opacity:.6">'+
          '<button class="btn neutral" data-act="sk-add-step">'+icon('add','sm')+'添加步骤</button></div>'
      : field('兼容旧命令意图（如 open_app，留空将无法调用）','intent','open_app'))+
    '<div class="iov-lbl">参数（'+e.params+'）</div>'+
    (e.params
      ? '<div class="iov-hint">'+Array.from({length:e.params},(_,i)=>
          '参数 '+(i+1)+'：文本 · 必填').join('<br>')+'</div>'
      : '<div class="iov-hint">暂无参数。可点击下方「添加参数」为技能补充输入项。</div>')+
    '<button class="iov-btn outline" data-act="sk-add-param">'+icon('add','sm')+'添加参数</button>'+
    '<div class="iov-manual" style="margin-top:4px">'+
      '<button class="btn neutral" style="flex:1" data-act="skill-close">取消</button>'+
      '<button class="btn primary" style="flex:1" data-act="skill-save">保存技能</button></div>'+
  '</div></div>';
}

let voiceTimer = null;
function voiceStart(){

  render();
  if(voiceTimer) clearTimeout(voiceTimer);
  // 1.8s 演示：先停在录音态，再自动展示「上滑分区」

}
function voiceEnd(){
  if(!S.voice) return;

  if(voiceTimer){ clearTimeout(voiceTimer); voiceTimer = null; }
  render();
  if(zone === 'cancel'){ toast('已取消发送'); return; }
  if(zone === 'preview'){ draft = '把屏幕亮度调到最高'; render(); toast('已填入输入框，可编辑后发送'); return; }
  draft = '把屏幕亮度调到最高';
  sendTask();
}
function voiceZone(zone){
  if(!S.voice) return;
  S.voice.zone = zone; render();
}

   页面记忆种子注入（const 在后面声明，启动时再挂上）

function seedMemoryPages(){
  if(S.memory.pages.length) return;
  S.memory.pages = Object.keys(PAGE_SEED).map(fp=>{
    const p = PAGE_SEED[fp];
    return {fp, app:p.app, title:p.title, type:p.type, visits:p.visits, shapes:p.shapes};
  });

function sendChat(){
  const text = chatDraft.trim();
  if(!text || S.chatThinking) return;
  S.chat.push({role:'me', text});
  chatDraft = '';
  S.chatThinking = true;
  render();
  scrollBottom();
  setTimeout(()=>{
    S.chatThinking = false;
    S.chat.push({role:'ai', text:answerFor(text)});
    render();
    scrollBottom();
  }, 900);
}
function answerFor(t){
  if(/你好|嗨|hi|hello/i.test(t)) return '你好，我在。想让我替你做点什么，还是先聊聊？';
  if(/代码|脚本|写/.test(t)) return '写代码可以去「编码」页，我能在设备端直接改文件、跑脚本。\n要我现在帮你把需求拆成实现步骤吗？';
  if(/设置|权限|模型/.test(t)) return '这些都在「设置」里：云端模型、端侧视觉、权限与执行通道都可以逐项调整。\n授权完成后回到权限页点一下「重新检测」就行。';
  return '这件事可以直接交给我执行：去「操控」页输入目标，我会先给出计划，你批准后我再动手。\n每一步都会附上页面证据，不会盲点。';
}
function sendCoding(){
  const c = S.coding;
  const text = codingDraft.trim();
  if(!text || c.busy) return;
  const session = c.sessions.find(s=>s.id===c.active);
  session.messages.push({role:'me', text});
  if(session.title === '新会话') session.title = text.slice(0, 12);
  codingDraft = '';
  c.busy = true; c.phase = '读取工作区'; c.iteration = 1; c.runStartedAt = Date.now();
  render();
  scrollBottom();
  if(codingTimer) clearTimeout(codingTimer);
  codingTimer = setTimeout(()=>{
    session.messages.push({role:'tool', toolName:'read_file', text:'扫描工作区目录，确认要改哪些文件', toolOk:null});
    render();
    scrollBottom();
    codingTimer = setTimeout(()=>{
      const tool = session.messages[session.messages.length-1];
      tool.toolOk = true; tool.durationMs = 640;
      c.phase = '等待审批';
      session.messages.push({role:'approval',
        text:'即将运行 write_file：写入 rename.js，把工作区内的 .txt 文件批量加前缀', approvalResolved:null});
      render();
      scrollBottom();
      codingTimer = null;
    }, 900);
  }, 700);
}
/* 审批决议：允许 → 继续执行并落结果；拒绝 → 本轮结束 */
function resolveCodingApproval(allow){
  const c = S.coding;
  const session = c.sessions.find(s=>s.id===c.active);
  const msg = session.messages.find(m=>m.role==='approval' && m.approvalResolved==null);
  if(!msg) return;
  msg.approvalResolved = allow;
  render();
  setTimeout(()=>{
    if(allow){
      session.messages.push({role:'tool', toolName:'write_file', text:'rename.js · 已写入工作区', toolOk:null, durationMs:null});
      render(); scrollBottom();
      setTimeout(()=>{
        const t = session.messages[session.messages.length-1];
        if(t && t.role==='tool'){ t.toolOk = true; t.durationMs = 820; }
        session.messages.push({role:'assistant', text:'已写好脚本并执行完成，工作区里的 .txt 文件都加上了 note- 前缀。',
          file:'rename.js', lang:'JavaScript',
          code:"// 批量给 .txt 文件加前缀\nconst fs = require('fs')\nfor (const f of fs.readdirSync('.')) {\n  if (f.endsWith('.txt')) {\n    fs.renameSync(f, 'note-' + f)\n  }\n}\nconsole.log('done')"});
        c.busy = false; c.phase = '处理中';
        render(); scrollBottom();
      }, 900);
    }else{
      session.messages.push({role:'assistant', text:'好，已拒绝这次工具调用，本轮到此结束。'});
      c.busy = false; c.phase = '处理中';
      render(); scrollBottom();
    }
  }, 400);
}

/* ============================================================
   主题 / 视觉开关
   ============================================================ */
function applyChrome(){
  let t = S.theme;
  if(t === 'auto'){
    t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  const root = document.documentElement;
  root.dataset.theme = t;
  root.dataset.palette = S.palette;
  root.dataset.borders = S.borders ? 'on' : 'off';
  root.dataset.frost = S.frost ? 'on' : 'off';
  root.dataset.glow = S.edgeGlow ? 'on' : 'off';
  // 磨砂浓淡：在色板默认透光度上 ±25 个百分点（更透 = 玻璃更透明）
  const base = t === 'light' ? 62 : 58;
  const mix = Math.max(28, Math.min(90, base + S.glassMix));
  root.style.setProperty('--glass-mix', mix + '%');
}
function resetAll(){
  S.theme = 'auto'; S.palette = 'ink_green'; S.glassMix = 0;
  S.borders = true; S.frost = true;
  S.clickCursor = true; S.edgeGlow = true; S.marquee = true;
  S.perms = {a11y:false, overlay:false, autostart:true, apps:true};
  S.stepLimit = 60; S.floating = true; S.pageMemory = true;
  S.model = 'glm-4.7-flash';
  S.chat = []; S.queue = []; S.tasks = [];
  S.agent.items = []; S.agent.task = ''; S.agent.total = 0;
  S.memory = {taskMemories:[], anomalies:[], profiles:[], pages:[], tab:'graph'};
  applyChrome();
}

/* ============================================================
   事件分派
   ============================================================ */
function handle(act, val, el){
  if(act === 'noop') return;

  if(act.startsWith('tab:')){ setTab(act.slice(4)); return; }
  if(act.startsWith('open-page:')){ openPage(act.slice(10)); return; }
  if(act.startsWith('mode:')){ S.actionMode = act.slice(5); S.modeOpen = false; render(); return; }
  if(act.startsWith('mem-tab:')){ S.memory.tab = act.slice(8); memSel = null; memArmed = null;
    S.memPage.sel = null; S.memPage.stack = []; render(); return; }
  if(act.startsWith('mem-clear:')){
    const k = act.slice(10);
    if(k === 'tasks') S.memory.taskMemories = [];
    else if(k === 'anomalies') S.memory.anomalies = [];
    else if(k === 'profiles') S.memory.profiles = [];
    else if(k === 'pages'){ S.memory.pages = []; S.memory.edges = []; }
    memSel = null; memArmed = null; S.memPage.sel = null; render(); return;
  }
  /* ---------- 页面记忆：打开 / 两步删除 / 链式下钻 ---------- */
  if(act === 'pg-open'){
    const p = (S.memory.pages||[]).find(x=>x.fp===val);
    if(!p) return;
    S.memPage.sel = val; S.memPage.stack = [p]; render(); return;
  }
  if(act === 'pg-del'){
    if(S.memPage.armed !== val){
      S.memPage.armed = val; render();
      setTimeout(()=>{ if(S.memPage.armed === val){ S.memPage.armed = null; render(); } }, 3000);
      return;
    }
    S.memPage.armed = null;
    S.memory.pages = S.memory.pages.filter(p=>p.fp !== val);
    S.memory.edges = (S.memory.edges||[]).filter(e=>e.from !== val && e.to !== val);
    if(S.memPage.sel === val) S.memPage.sel = null;
    render(); toast('已删除这条页面记忆'); return;
  }
  if(act === 'pg-close'){ S.memPage.sel = null; S.memPage.stack = []; render(); return; }
  if(act === 'pg-stack-back'){
    if(S.memPage.stack.length > 1) S.memPage.stack.pop();
    render(); return;
  }
  if(act === 'pg-drill'){
    const p = (S.memory.pages||[]).find(x=>x.fp===val);
    if(!p) return;
    S.memPage.stack = S.memPage.stack.concat([p]); render(); return;
  }
  if(act === 'pg-node'){
    const cur = S.memPage.stack[S.memPage.stack.length-1];
    if(!cur) return;
    const node = cur.shapes[+val];
    if(!node) return;
    const edge = (S.memory.edges||[]).find(e=>e.app===cur.app && e.from===cur.fp &&
      (e.ctl === node.semanticId || e.ctl === node.label));
    const target = edge && (S.memory.pages||[]).find(x=>x.fp===edge.to);
    if(target){ S.memPage.stack = S.memPage.stack.concat([target]); render(); }
    return;
  }
  /* ---------- 开屏引导 ---------- */
  if(act === 'ob-next'){ obNext(); return; }
  if(act === 'ob-back'){ S.onboarding.stage = 'welcome'; render(); return; }
  if(act === 'ob-skip'){ S.onboarding.stage = 'perms'; render(); return; }
  if(act === 'ob-finish'){ obFinish(); return; }
  if(act.startsWith('ob-perm:')){
    const k = act.slice(8);
    S.perms[k] = !S.perms[k];
    render(); return;
  }
  /* ---------- 文档全屏 ---------- */
  if(act === 'doc-close'){ S.doc = null; render(); return; }
  if(act === 'doc-open'){ openDoc(val); return; }
  /* ---------- 语音录音浮层（演示：按住输入框触发） ---------- */
  if(act === 'voice-hold'){ voiceStart(); return; }
  if(act === 'voice-end'){ voiceEnd(); return; }
  /* ---------- 协助浮层 ---------- */
  if(act === 'assist-pick'){ assistPick(val); return; }
  if(act === 'assist-manual'){ assistManual(); return; }
  if(act === 'assist-submit'){ assistSubmit(); return; }
  if(act === 'assist-demo'){ demoAssist(); return; }
  if(act === 'assist-cmd-demo'){ demoAssistCmd(); return; }
  if(act === 'confirm-demo'){ demoConfirm(); return; }
  if(act === 'ob-restart'){ S.onboarding = {done:false, stage:'welcome', step:0}; render(); return; }
  /* ---------- 不可逆动作确认 ---------- */
  if(act === 'confirm-yes'){ resolveConfirm(true); return; }
  if(act === 'confirm-no'){ resolveConfirm(false); return; }
  /* ---------- 技能与能力 ---------- */
  if(act.startsWith('skill-tab:')){ S.skill.tab = act.slice(10); render(); return; }
  if(act === 'skill-batch'){ S.skill.batch = !S.skill.batch; S.skill.selected = []; S.skill.delArmed = false; render(); return; }
  if(act === 'skill-deselect'){ S.skill.selected = []; render(); return; }
  if(act === 'skill-del'){
    if(!S.skill.selected.length) return;
    if(!S.skill.delArmed){
      S.skill.delArmed = true; render();
      setTimeout(()=>{ if(S.skill.delArmed){ S.skill.delArmed = false; render(); } }, 3000);
      return;
    }
    const ids = S.skill.selected.slice();
    S.skills = S.skills.filter(s=>ids.indexOf(s.id) < 0);
    S.skill.selected = []; S.skill.delArmed = false;
    render(); toast('已删除 '+ids.length+' 个技能'); return;
  }
  if(act === 'skill-toggle'){
    const s = S.skills.find(x=>x.id===val);
    if(!s) return;
    if(S.skill.batch){
      const i = S.skill.selected.indexOf(val);
      if(i >= 0) S.skill.selected.splice(i,1); else S.skill.selected.push(val);
      render(); return;
    }
    s.enabled = !s.enabled; render(); toast(s.name+(s.enabled?' 已启用':' 已停用'));
    return;
  }
  if(act === 'skill-new'){ openSkillEditor(null, false); return; }
  if(act === 'skill-new-macro'){ openSkillEditor(null, true); return; }
  if(act === 'skill-open'){ openSkillEditor(val, false); return; }
  if(act === 'skill-close'){ S.skill.editor = null; render(); return; }
  if(act === 'skill-save'){ saveSkillEditor(); return; }
  if(act === 'sk-add-param'){ if(S.skill.editor){ S.skill.editor.params++; render(); } return; }
  if(act === 'sk-add-step'){ if(S.skill.editor){ S.skill.editor.steps++; render(); } return; }
  if(act === 'skill-export'){ toast('已导出 '+S.skills.filter(s=>!s.builtin).length+' 个技能到剪贴板'); return; }
  if(act === 'skill-import'){ toast('剪贴板为空或不是技能 JSON'); return; }
  if(act.startsWith('mcp-cat:')){ S.skill.marketCat = act.slice(8); render(); return; }
  if(act === 'mcp-use'){
    const m = MCP_MARKET.find(x=>x.name===val);
    if(!m) return;
    if(S.mcpServers.some(x=>x.name===m.name)){ toast('这个服务器已经在列表里'); return; }
    S.mcpServers.push({name:m.name, url:m.url, ok:false, tools:0});
    render(); toast('已添加 '+m.name+'，点条目测试连通性'); return;
  }
  if(act === 'mcp-del'){
    S.mcpServers = S.mcpServers.filter(x=>x.name!==val);
    render(); toast('已移除 '+val); return;
  }
  /* ---------- 内置浏览器 ---------- */
  if(act === 'browser-open'){
    const b = S.browser;
    b.title = '手机智能体 · 任务记录';
    b.url = 'https://happy-agent.dev/tasks';
    b.hasPage = true; b.progress = 1;
    render(); return;
  }
  if(act === 'browser-close'){
    S.browser = {title:'', url:'', progress:0, hasPage:false, page:'tools'};
    render(); return;
  }
  /* ---------- 测试 / 调试 ---------- */
  if(act.startsWith('test-cat:')){ S.test.cat = act.slice(9); render(); return; }
  if(act === 'test-run'){ runTestPreset(val); return; }
  if(act === 'test-as-task'){
    if(S.agent.running || S.agent.planning){ toast('有任务正在执行'); return; }
    S.page = null; S.tab = 'agent'; draft = val; sendTask(); return;
  }
  if(act === 'test-prompt'){ openDoc('prompt'); return; }
  if(act === 'test-config'){ openPage('cloud'); return; }
  if(act.startsWith('debug-tab:')){ S.debug.tab = act.slice(10); render(); return; }
  if(act.startsWith('mem-del:')){
    const id = +act.slice(8);
    // 单条删除两步确认：第一次点只把图标染红，3 秒内再点才真删
    if(memArmed !== id){
      memArmed = id; render();
      setTimeout(()=>{ if(memArmed === id){ memArmed = null; render(); } }, 3000);
      return;
    }
    memArmed = null;
    S.memory.taskMemories = S.memory.taskMemories.filter(t=>t.id !== id);
    render(); return;
  }
  if(act.startsWith('theme:')){ S.theme = act.slice(6); applyChrome(); render(); return; }
  if(act.startsWith('palette:')){ S.palette = act.slice(8); applyChrome(); render(); return; }
  if(act === 'borders:on'){ if(!S.borders){ S.borders = true; applyChrome(); render(); } return; }
  if(act === 'borders:off'){ if(S.borders){ S.borders = false; applyChrome(); render(); } return; }
  if(act.startsWith('channel:')){ S.channel = act.slice(8); render(); toast('已切换到'+S.channel); return; }
  if(act.startsWith('step-limit:')){ S.stepLimit = +act.split(':')[1]; render(); return; }
  if(act.startsWith('coding-approval:')){
    S.coding.approval = act.split(':')[1]; render(); toast('审批档位：'+approvalLabel()); return;
  }
  if(act.startsWith('coding-approve:')){
    resolveCodingApproval(act.slice(-4) === 'deny' ? false : true); return;
  }
  if(act === 'coding-approval-cycle'){
    const order = ['ask','risky','bypass'];
    const i = Math.max(0, order.indexOf(S.coding.approval));
    S.coding.approval = order[(i+1) % order.length];
    render(); toast('审批档位：'+approvalLabel()); return;
  }
  if(act.startsWith('perm-toggle:')){
    const k = act.split(':')[1];
    S.perms[k] = !S.perms[k];
    render();
    toast((PERMS.find(p=>p.k===k)||{t:''}).t+(S.perms[k]?' 已授权':' 已关闭'));
    return;
  }
  if(act.startsWith('tabs-toggle:')){
    const id = act.slice(11);
    if(id === 'home' || id === 'settings'){ toast('主页与设置固定显示'); return; }
    const on = !S.tabsVisible[id];
    S.tabsVisible[id] = on;
    if(!on && S.tab === id) setTab('home');
    render();
    toast((TABS.find(t=>t.id===id).label)+(on?' 已显示':' 已隐藏'));
    return;
  }

  switch(act){
    case 'back': goBack(); return;
    case 'open-memory': setTab('memory'); return;
    case 'drawer-open': S.drawer = true; render(); return;
    case 'drawer-close': S.drawer = false; render(); return;
    case 'new-chat':
      if(S.agent.running || S.agent.planning){ toast('任务运行中，结束后可新建对话'); return; }
      S.agent.items = []; S.agent.task = ''; S.agent.total = 0; S.agent.step = 0;
      S.agent.plan = null; S.agent.phase = 'OBSERVING'; draft = '';
      S.drawer = false; S.tab = 'agent'; render(); toast('已新建对话'); return;
    case 'task-open':
      draft = val; S.drawer = false; setTab('agent'); return;
    case 'toggle-screen':
      S.screenShare = !S.screenShare; render();
      toast(S.screenShare ? '屏幕捕获已授权' : '屏幕捕获已关闭'); return;
    case 'review-toggle': S.review = !S.review; render(); return;
    case 'agent-send': sendTask(); return;
    case 'agent-approve': approvePlan(); return;
    case 'agent-cancel-plan': cancelPlan(); return;
    case 'agent-stop': stopRun(); return;
    case 'agent-pause': togglePause(); return;
    case 'agent-retry': retryTask(); return;
    case 'preview-open':
      if(!S.screenShare){ toast('请先授权屏幕捕获'); return; }
      S.agent.preview = true; render(); return;
    case 'preview-close': S.agent.preview = false; render(); return;
    case 'float-hide': S.agent.hidden = true; render(); return;
    case 'mode-toggle': S.modeOpen = !S.modeOpen; render(); return;
    case 'sug': draft = val; sendTask(); return;
    case 'queue-view': toast('排队任务会在当前任务结束后依次执行'); return;
    case 'mem-refresh':
      if(!S.memory.pages.length) seedMemoryPages();
      render(); toast('已刷新记忆'); return;
    case 'node': memSel = val; render(); return;
    case 'node-close': memSel = null; render(); return;
    case 'chat-send': sendChat(); return;
    case 'coding-send': sendCoding(); return;
    case 'coding-stop':
      if(codingTimer){ clearTimeout(codingTimer); codingTimer = null; }
      S.coding.busy = false; render(); toast('已停止编码'); return;
    case 'coding-new': {
      const id = Math.max(...S.coding.sessions.map(s=>s.id)) + 1;
      S.coding.sessions.push({id, title:'新会话', messages:[]});
      S.coding.active = id; S.coding.busy = false; S.coding.sheet = null;
      if(codingTimer){ clearTimeout(codingTimer); codingTimer = null; }
      codingDraft = ''; render(); return;
    }
    case 'coding-ws': S.coding.sheet = 'workspaces'; render(); return;
    case 'coding-sessions': S.coding.sheet = 'sessions'; render(); return;
    case 'coding-model': S.coding.sheet = 'model'; render(); return;
    case 'coding-sheet-close': S.coding.sheet = null; render(); return;
    /* 会话面板视图切换：图谱 / 列表 */
    case 'coding-session-view': codingSessionGraph = !codingSessionGraph; render(); return;
    case 'coding-session-del': {
      const id = +val;
      const i = S.coding.sessions.findIndex(s=>s.id===id);
      if(i < 0) return;
      S.coding.sessions.splice(i, 1);
      if(S.coding.sessions.length === 0){
        S.coding.sessions = [{id:1, title:'新会话', messages:[]}];
        S.coding.active = 1;
      }else if(S.coding.active === id){
        S.coding.active = S.coding.sessions[0].id;
      }
      render(); return;
    }
    /* 工作区移除：目录文件保留（与 WorkspacePanel.onDelete 一致） */
    case 'coding-ws-del': {
      const i = CODING_WS.findIndex(x=>x.n===val);
      if(i < 0 || CODING_WS[i].n === '默认工作区') return;
      const removed = CODING_WS.splice(i, 1)[0];
      if(S.coding.workspace === removed.n){
        S.coding.workspace = CODING_WS[0].n; S.coding.path = CODING_WS[0].p;
        S.coding.sessions = [{id:1, title:'新会话', messages:[]}]; S.coding.active = 1;
      }
      render(); toast('已移除「'+removed.n+'」，目录文件保留'); return;
    }
    case 'coding-model-pick': {
      if(!val) return;
      S.model = val; S.coding.sheet = null; render(); toast('已切换到 '+val); return;
    }
    case 'coding-manual': {
      const v = String(codingManual||'').trim();
      if(!v){ toast('请先填写模型名'); return; }
      S.model = v;
      if(!S.coding.models.some(m=>m.name===v)) S.coding.models.unshift({name:v, host:'手动填写'});
      S.coding.sheet = null; render(); toast('已切换到 '+v); return;
    }
    case 'coding-session-open': {
      const id = +val;
      if(!S.coding.sessions.some(s=>s.id===id)) return;
      S.coding.active = id; S.coding.sheet = null; codingDraft = '';
      render(); return;
    }
    case 'coding-ws-pick': {
      const w = CODING_WS.find(x=>x.n===val);
      if(!w) return;
      S.coding.workspace = w.n; S.coding.path = w.p;
      S.coding.sessions = [{id:1, title:'新会话', messages:[]}];
      S.coding.active = 1; S.coding.sheet = null; codingDraft = '';
      render(); toast('工作区：'+w.n); return;
    }
    case 'coding-ws-new': {
      const n = '工作区 '+(CODING_WS.length+1);
      const p = '/data/user/0/com.phoneagent/files/workspaces/ws'+CODING_WS.length;
      CODING_WS.push({n, p});
      S.coding.workspace = n; S.coding.path = p;
      S.coding.sessions = [{id:1, title:'新会话', messages:[]}];
      S.coding.active = 1; S.coding.sheet = null; codingDraft = '';
      render(); toast('已新建 '+n); return;
    }
    /* 新建工作区：名称取自输入框（WorkspacePanel.onCreate，空名不创建） */
    case 'coding-ws-create': {
      const n = String(codingWsName||'').trim();
      if(!n) return;
      const p = '/data/user/0/com.phoneagent/files/workspaces/ws'+CODING_WS.length;
      CODING_WS.push({n, p});
      S.coding.workspace = n; S.coding.path = p;
      S.coding.sessions = [{id:1, title:'新会话', messages:[]}];
      S.coding.active = 1; S.coding.sheet = null; codingDraft = ''; codingWsName = '';
      render(); toast('已新建 '+n); return;
    }
    /* 从设备选择目录：拉起系统目录选择器 */
    case 'coding-pick-dir': S.coding.sheet = null; render(); toast('已打开系统目录选择器'); return;
    case 'coding-folder': toast('已在系统文件管理器打开工作区目录'); return;
    case 'detect':
      if(S.settingsDetect) return;
      S.settingsDetect = true; render();
      setTimeout(()=>{
        S.settingsDetect = false; render();
        const miss = permMissing();
        toast(miss ? '检测完成，还有 '+miss+' 项待授权' : '检测完成，全部已就绪');
      }, 900);
      return;
    case 'model-save':
      if(!String(S.model).trim()){ toast('请先填写模型名'); return; }
      render(); toast('模型配置已保存'); return;
    case 'prompt-save': toast('提示词已保存'); return;
    case 'ondevice-toggle':
      S.onDevice = !S.onDevice; render();
      toast(S.onDevice ? '端侧视觉已启用' : '端侧视觉已关闭'); return;
    case 'ondevice-download':
      S.onDevice = true; render(); toast('端侧模型已加载，约 1.8 GB'); return;
    case 'ondevice-toggle2': return;
    case 'longtask-new': toast('已新建任务模板'); return;
    case 'longtask-view': toast('模板列表：3 个（演示）'); return;
    case 'resume-toggle': S.resume = !S.resume; render(); return;
    case 'assistant-toggle': S.assistant = !S.assistant; render(); return;
    case 'notice-toggle': S.notify = !S.notify; render(); return;
    case 'floating-toggle':
      S.floating = !S.floating;
      if(!S.floating) S.agent.hidden = true;
      render(); return;
    case 'page-memory-toggle': S.pageMemory = !S.pageMemory; render(); return;
    case 'autocheck-toggle': S.autoCheck = !S.autoCheck; render(); return;
    case 'borders-toggle': S.borders = !S.borders; applyChrome(); render(); return;
    case 'frost-toggle': S.frost = !S.frost; applyChrome(); render(); return;
    case 'cursor-toggle': S.clickCursor = !S.clickCursor; applyChrome(); render(); return;
    case 'glow-toggle': S.edgeGlow = !S.edgeGlow; applyChrome(); render(); return;
    case 'marquee-toggle': S.marquee = !S.marquee; render(); return;
    case 'tab-move': {
      const [id, dir] = String(val).split(':');
      const idx = S.tabOrder.indexOf(id);
      const to = idx + (+dir);
      if(idx < 0 || to < 0 || to >= S.tabOrder.length) return;
      S.tabOrder.splice(idx,1);
      S.tabOrder.splice(to,0,id);
      render(); return;
    }
    case 'export-data': exportData(); return;
    case 'clear-memory':
      if(!window.confirm('确定清空任务记忆、异常经验与用户画像？')) return;
      S.memory = {taskMemories:[], anomalies:[], profiles:[], pages:[], tab:'graph'};
      S.tasks = []; memSel = null; render(); toast('记忆已清空'); return;
    case 'reset-all':
      if(!window.confirm('恢复默认设置？主题、权限与执行参数都会重置。')) return;
      resetAll(); S.page = null; render(); toast('已恢复默认设置'); return;
    case 'check-update': toast('已是最新版本 v'+VERSION); return;
    case 'about-repo': toast('开源仓库尚未配置，开源后会在这里显示地址'); return;
    case 'about-guide': toast('先授权，再去「操控」页输入目标，批准计划后开始'); return;
    case 'about-privacy': toast('截图只用于本机理解，每一步都会留下页面证据'); return;
    case 'skill-add': openSkillEditor(null, false); return;
    case 'browser-open': toast('内置浏览器尚未打开网页'); return;
  }
}
function exportData(){
  const data = {
    app:'happy-phone-agent', version:VERSION,
    exportedAt:new Date().toISOString(),
    settings:{theme:S.theme, model:S.model, endpoint:S.endpoint, actionMode:S.actionMode, stepLimit:S.stepLimit, stepReview:S.review},
    memory:S.memory, tasks:S.tasks
  };
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'happy-phone-agent-backup.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1200);
  toast('已导出 JSON');
}

/* ============================================================
   启动
   ============================================================ */
S.assistant = true;
S.notify = false;
S.resume = true;
S.scanning = true;
seedMemoryPages();

/* 点击光标：坐标要换算到屏幕内部（整机可能被缩放），不能直接用 clientX/Y */
document.addEventListener('pointerdown', e=>{
  if(!S.clickCursor) return;
  const scr = document.getElementById('screen');
  if(!scr) return;
  const box = scr.getBoundingClientRect();
  if(e.clientX < box.left || e.clientX > box.right || e.clientY < box.top || e.clientY > box.bottom) return;
  // 设备可能被整体缩放，除以缩放比才能得到屏幕内部（412×892）的 CSS 坐标
  const k = box.width / 412 || 1;
  const d = document.createElement('span');
  d.className = 'touchdot';
  d.style.left = ((e.clientX - box.left) / k)+'px';
  d.style.top = ((e.clientY - box.top) / k)+'px';
  scr.appendChild(d);
  setTimeout(()=>d.remove(), 620);
});
window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', ()=>{
  if(S.theme === 'auto'){ applyChrome(); render(); }
});

/* 整机等比缩放：应用内部永远是 412×892，窗口变化只改 transform 的 scale。
   这是"夹具"层的缩放，不是响应式排版——任何断点都不会触发。 */
function fitDevice(){
  const dev = document.getElementById('device');
  const stage = document.getElementById('stage');
  if(!dev || !stage) return;
  const cs = getComputedStyle(stage);
  const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const w = stage.clientWidth - padX;
  const h = stage.clientHeight - padY;
  const scale = Math.min(1, w / 434, h / 914);
  // 缩放以中心为原点，grid 居中负责摆位，不再需要负外边距补偿
  dev.style.transform = 'scale(' + scale.toFixed(4) + ')';
  dev.style.margin = '0';
}
fitDevice();
window.addEventListener('resize', fitDevice);

applyChrome();
render();
setTimeout(()=>{
  S.scanning = false;
  if(S.tab === 'home' && !S.page) render();
}, 1500);
</script>
