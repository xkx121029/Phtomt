<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="color-scheme" content="dark light">
<title>手机智能体 · Happy Phone Agent</title>
<style>
/* ============================================================
   设计令牌 —— 直接对应 Color.kt / Theme.kt / Type.kt / Motion.kt
   ============================================================ */
:root{
  --bg:#121513;
  --on-bg:#E8EAE6;
  --raised:#1B1F1C;
  --on-raised:#B7BDB6;
  --sunken:#0C0F0D;
  --card:#191C1A;
  --card-2:#1E201E;
  --card-3:#232523;

  --outline:#8B928A;
  --line:#3A403A;
  --hair:rgba(139,146,138,.22);

  --brand:#5FD9B4;
  --on-brand:#04302A;
  --brand-c:#17453A;
  --on-brand-c:#A8EBD6;

  --warm:#F0A868;
  --warm-c:#4E3117;
  --on-warm-c:#F8DCBE;

  --cool:#84B6D4;
  --cool-c:#1E3B4C;
  --on-cool-c:#CBE4F2;

  --err:#FF9A90;
  --err-c:#6E1F17;
  --on-err-c:#FFDAD5;

  --ok:#6FD3A2;
  --ok-c:#17452F;
  --on-ok-c:#C4EFD8;

  --warn:#E8B75E;
  --warn-c:#4E370F;
  --on-warn-c:#F7E2B6;

  --agent-b:#1E332C;
  --on-agent-b:#DCEBE4;
  --user-b:#1B4A3F;
  --on-user-b:#CFF3E8;

  --rail-idle:#3A403A;
  --rail-active:#5FD9B4;
  --rail-done:#3E7A66;

  --glass-mix:58%;
  --glass-solid-mix:90%;
  --glass:color-mix(in srgb,var(--bg) var(--glass-mix),transparent);
  --glass-solid:color-mix(in srgb,var(--bg) var(--glass-solid-mix),transparent);
  --glass-line:rgba(95,217,180,.22);
  --sheen:rgba(255,255,255,.04);

  --shadow:0 18px 42px rgba(0,0,0,.46);
  --shadow-soft:0 10px 28px rgba(0,0,0,.30);

  --muted:var(--on-raised);
  --card-border:rgba(139,146,138,.20);

  --ease:cubic-bezier(.23,1,.32,1);
  --ease-io:cubic-bezier(.77,0,.175,1);
  --t-fast:160ms;
  --t-normal:200ms;
  --t-slow:280ms;

  --gutter:16px;
  --hdr-pad:96px;
  --nav-h:64px;
  --nav-gap:12px;
  --clearance:88px;
  /* 屏内逻辑高度：页面里任何"撑满一屏"的高度都用它，跟浏览器视口无关 */
  --screen-h:892px;
  /* 舞台底色：手机夹具外的画布，不随主题变化 */
  --stage:#0A0C0B;
}
html[data-theme="light"]{
  --bg:#F7F6F3;
  --on-bg:#1A1D1B;
  --raised:#EDEFEA;
  --on-raised:#4B514C;
  --sunken:#E3E6E0;
  --card:#EDEFEA;
  --card-2:#E7EAE4;
  --card-3:#DFE3DD;

  --outline:#6E756E;
  --line:#C9CEC6;
  --hair:rgba(110,117,110,.22);

  --brand:#0E7C66;
  --on-brand:#FFFFFF;
  --brand-c:#CFEDE3;
  --on-brand-c:#033A2F;

  --warm:#B4632A;
  --warm-c:#F7E3D2;
  --on-warm-c:#4A2410;

  --cool:#4A7C9B;
  --cool-c:#DCEAF3;
  --on-cool-c:#17384C;

  --err:#C4463C;
  --err-c:#FBDAD5;
  --on-err-c:#4A0F09;

  --ok:#1F7A55;
  --ok-c:#D2EDDF;
  --on-ok-c:#08321F;

  --warn:#9A6B12;
  --warn-c:#F6E6C4;
  --on-warn-c:#38270A;

  --agent-b:#E6F4EF;
  --on-agent-b:#10312A;
  --user-b:#0E7C66;
  --on-user-b:#FFFFFF;

  --rail-idle:#C9CEC6;
  --rail-active:#0E7C66;
  --rail-done:#7FBFA9;

  --glass-mix:62%;
  --glass-line:rgba(14,124,102,.18);
  --sheen:rgba(255,255,255,.14);

  --shadow:0 18px 42px rgba(23,40,34,.16);
  --shadow-soft:0 10px 28px rgba(23,40,34,.10);

  --card-border:rgba(201,206,198,.85);
}

/* ============================================================
   配色：对应 ThemePalette 的四套色板（玄青 / 赭石 / 黛蓝 / 绛紫）
   深浅跟随 data-theme；玻璃用 --bg + --glass-mix 推导，所以换色板不用再写玻璃色
   ============================================================ */

  --bg:#16130F; --on-bg:#EDE9E2; --raised:#1F1B15; --on-raised:#BCB4A7; --sunken:#0F0C08;
  --card:#1A1712; --card-2:#1E1A14; --card-3:#221E17;
  --outline:#958D80; --line:#423D33; --hair:rgba(149,141,128,.22);

  --agent-b:#33281B; --on-agent-b:#EAE0D0; --user-b:#4A2A14; --on-user-b:#F5DCC2;

html[data-palette="ochre"][data-theme="light"]{

  --card:#EFE9E0; --card-2:#E9E3D9; --card-3:#E2DBD0;
  --outline:#777066; --line:#D2CABC; --hair:rgba(119,112,102,.22);
  --brand:#B0592C; --on-brand:#FFFFFF; --brand-c:#F6DFCB; --on-brand-c:#47220D;

  --agent-b:#F4E8D8; --on-agent-b:#362619; --user-b:#B0592C; --on-user-b:#FFFFFF;
  --rail-idle:#D2CABC; --rail-active:#B0592C; --rail-done:#CFA27E;
  --glass-line:rgba(176,89,44,.18); --card-border:rgba(210,202,188,.85);
}
html[data-palette="ink_blue"][data-theme="dark"]{
  --bg:#111417; --on-bg:#E6E9EC; --raised:#1A1E22; --on-raised:#B4BBC2; --sunken:#0B0D0F;

  --outline:#8C939C; --line:#3A4046; --hair:rgba(140,147,156,.22);
  --brand:#8FB8DE; --on-brand:#0B2338; --brand-c:#1E3A56; --on-brand-c:#C8DFF2;
  --cool:#93C4A8; --cool-c:#21402F; --on-cool-c:#CDE8DA;
  --agent-b:#1D2C3A; --on-agent-b:#D8E4EE; --user-b:#1E3A56; --on-user-b:#CFE4F5;
  --rail-idle:#3A4046; --rail-active:#8FB8DE; --rail-done:#3E6285;
  --glass-line:rgba(143,184,222,.24); --card-border:rgba(140,147,156,.20);
}
html[data-palette="ink_blue"][data-theme="light"]{
  --bg:#F4F6F8; --on-bg:#191D21; --raised:#E9EDF1; --on-raised:#4D555D; --sunken:#DFE4E9;
  --card:#E9EDF1; --card-2:#E4E8EC; --card-3:#DEE3E8;
  --outline:#6C7580; --line:#C8CED5; --hair:rgba(108,117,128,.22);
  --brand:#35618E; --on-brand:#FFFFFF; --brand-c:#D8E4F0; --on-brand-c:#10263C;
  --cool:#5E7D66; --cool-c:#DFEAE2; --on-cool-c:#1D3324;
  --agent-b:#E2EBF3; --on-agent-b:#142A3E; --user-b:#35618E; --on-user-b:#FFFFFF;
  --rail-idle:#C8CED5; --rail-active:#35618E; --rail-done:#7FA3C4;
  --glass-line:rgba(53,97,142,.18); --card-border:rgba(200,206,213,.85);
}
html[data-palette="plum"][data-theme="dark"]{
  --bg:#151114; --on-bg:#EBE6E9; --raised:#1E191C; --on-raised:#B9AEB4; --sunken:#0E0B0D;
  --card:#191518; --card-2:#1E1A1D; --card-3:#231F22;
  --outline:#92878D; --line:#3E363B; --hair:rgba(146,135,141,.22);
  --brand:#E39BB4; --on-brand:#340F1D; --brand-c:#4E1F30; --on-brand-c:#F6D3E0;
  --cool:#8FBEA8; --cool-c:#204035; --on-cool-c:#CCE8DB;
  --agent-b:#32222A; --on-agent-b:#EDDDE4; --user-b:#46202F; --on-user-b:#F2D2DE;
  --rail-idle:#3E363B; --rail-active:#E39BB4; --rail-done:#8A5A70;
  --glass-line:rgba(227,155,180,.24); --card-border:rgba(146,135,141,.20);
}
html[data-palette="plum"][data-theme="light"]{
  --bg:#F8F5F6; --on-bg:#1F191C; --raised:#EFE9EC; --on-raised:#584B51; --sunken:#E5DEE1;
  --card:#EFE9EC; --card-2:#E9E3E6; --card-3:#E3DCE0;
  --outline:#796B72; --line:#D1C7CC; --hair:rgba(121,107,114,.22);
  --brand:#8E3D5C; --on-brand:#FFFFFF; --brand-c:#F2D9E1; --on-brand-c:#3A1220;
  --cool:#4E7A72; --cool-c:#DCE9E5; --on-cool-c:#16332C;
  --agent-b:#F2E2E9; --on-agent-b:#331522; --user-b:#8E3D5C; --on-user-b:#FFFFFF;
  --rail-idle:#D1C7CC; --rail-active:#8E3D5C; --rail-done:#C68CA4;
  --glass-line:rgba(142,61,92,.18); --card-border:rgba(209,199,204,.85);
}

*{box-sizing:border-box}
html,body{height:100%}
/* 舞台：手机夹具的底色固定，不跟应用主题/色板走，设备才有"实体"感 */
html{background:var(--stage)}
body{
  margin:0;background:var(--stage);color:var(--on-bg);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:14px;line-height:22px;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow:hidden;
}
.stage{
  position:fixed;inset:0;display:grid;place-items:center;place-content:center;
  padding:24px;
  background:
    radial-gradient(120% 90% at 50% -10%, #1A1E1C 0%, #0B0D0C 58%, #070808 100%);
}
/* 设备：11px 边框 + 52 圆角，内部固定 412×892 逻辑像素，整体按窗口缩放（不做响应式重排） */
.device{
  position:relative;flex:none;
  width:434px;height:914px;
  padding:11px;border-radius:54px;
  background:linear-gradient(160deg,#2B302E,#161918 40%,#0D0F0E);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.06) inset,
    0 0 0 2px rgba(0,0,0,.6),
    0 42px 90px -24px rgba(0,0,0,.9),
    0 12px 28px rgba(0,0,0,.55);
  transform-origin:center center;
}
/* 侧键：只做实体感，不加装饰性描边 */
.device::before,.device::after{
  content:"";position:absolute;width:3px;border-radius:2px;
  background:linear-gradient(180deg,#2E3331,#1A1E1C);
}
.device::before{left:-3px;top:172px;height:64px}
.device::after{right:-3px;top:196px;height:96px}
.screen{
  position:relative;width:412px;height:892px;
  border-radius:43px;overflow:hidden;
  background:var(--bg);color:var(--on-bg);
  isolation:isolate;
}
/* 屏幕内所有浮层都相对它定位（不再相对视口） */
.screen .main,.screen .nav,.screen .toast,.screen .floatwin,
.screen .scrim,.screen .drawer,.screen .drawer-scrim,
.screen .iov-scrim,.screen .doc,.screen .ob,.screen .voice,
.screen .sheet-scrim,.screen .touchdot{position:absolute}
/* 屏幕底部指示条：落在导航栏与底边之间的空隙里，不遮内容 */
.screen::after{
  content:"";position:absolute;left:50%;bottom:4px;width:118px;height:4px;
  margin-left:-59px;border-radius:99px;background:rgba(255,255,255,.28);
  z-index:70;pointer-events:none;
}
/* 系统状态栏位置（刘海）在设备顶边，不占应用布局 */
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{outline:none}
::selection{background:var(--brand-c);color:var(--on-brand-c)}
.ic{width:20px;height:20px;display:block;flex:none}
.ic.sm{width:16px;height:16px}
.ic.s18{width:18px;height:18px}
.ic.xs{width:14px;height:14px}
.ic.lg{width:22px;height:22px}

/* ============================================================
   布局
   ============================================================ */
.main{position:absolute;inset:0;display:flex;flex-direction:column;z-index:1}
.content{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  padding:var(--hdr-pad) var(--gutter) 18px;
  scrollbar-width:thin;
  -webkit-overflow-scrolling:touch;
}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.main:not(.hasdock) .content{padding-bottom:calc(var(--clearance) + 18px)}
.page{width:100%;max-width:760px;margin:0 auto}
/* 主页 / 设置 / 二级页：横向留白 20dp（与 Compose 侧 SettingsScreenPad、HomeScreen 一致） */
.page.wide{padding-left:4px;padding-right:4px}
.page.wide>.sec{padding-left:0;padding-right:0}
/* 对话页横向内边距 12dp（16 栅格 − 4） */
.page.chat{margin-left:-4px;margin-right:-4px}
/* 编码页横向内边距 12dp（CodingScreen 用 AppSpacing.Md） */
.page.coding{margin-left:-4px;margin-right:-4px}

/* 二级页：隐藏悬浮页眉，页头随内容滚动（返回圆钮 → 标题 → 副标题） */
.main.subpage .hdr{display:none}
.main.subpage .content{padding-top:0}
.page-head{
  display:flex;flex-direction:column;
  padding-top:22px;
  padding-bottom:6px;
}
.page-head .backbtn{
  width:46px;height:46px;border-radius:99px;display:grid;place-items:center;
  background:var(--card-3);color:var(--on-bg);
  transition:transform var(--t-fast) var(--ease),background var(--t-fast);
}
.page-head .backbtn:hover{background:color-mix(in srgb,var(--on-bg) 10%,var(--card-3))}
.page-head .backbtn:active{transform:scale(.94)}
.page-head h1{margin:16px 0 0;font-size:28px;line-height:36px;font-weight:700;letter-spacing:-.4px}
.page-head p{margin:4px 0 0;font-size:13.5px;line-height:20px;color:var(--muted)}

/* 页眉：未滚动时贴着屏幕，滚动后收成浮起玻璃板 */
.hdr{position:absolute;top:0;left:0;right:0;z-index:12;padding:8px 10px 0;pointer-events:none}
.hdr-inner{
  pointer-events:auto;max-width:760px;margin:0 auto;
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;border-radius:24px;
  border:1px solid transparent;
  transition:background var(--t-normal) var(--ease),border-color var(--t-normal) var(--ease),
             box-shadow var(--t-normal) var(--ease),backdrop-filter var(--t-normal) var(--ease);
}
.hdr-inner.on{
  background:var(--glass);
  -webkit-backdrop-filter:blur(20px) saturate(1.45);
  backdrop-filter:blur(20px) saturate(1.45);
  border-color:var(--glass-line);
  box-shadow:var(--shadow-soft);
  background-image:linear-gradient(180deg,var(--sheen),transparent 60%);
}
.hdr-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.hdr-txt h1{
  margin:0;font-size:28px;line-height:36px;font-weight:700;letter-spacing:-.4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.hdr-txt p{margin:2px 0 0;font-size:14px;line-height:20px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-actions{display:flex;align-items:center;gap:4px;flex:none}
.lead-tile{
  width:36px;height:36px;border-radius:14px;display:grid;place-items:center;flex:none;
  background:var(--brand-c);color:var(--brand);
}
.lead-tile .ic{width:20px;height:20px}
/* 主页品牌瓦片：BrandNavy → Accent 两段线性渐变，40dp，无阴影 */
.lead-tile.brand{
  width:40px;height:40px;
  background:linear-gradient(135deg,#0A2E27,#0E7C66);
  color:#fff;
}

/* 导航：固定在屏幕内底部（不随窗口改布局） */
.nav{
  position:absolute;left:12px;right:12px;bottom:18px;
  height:64px;z-index:20;display:flex;align-items:center;
  padding:0 6px;border-radius:28px;
  background:var(--glass);
  -webkit-backdrop-filter:blur(24px) saturate(1.5);
  backdrop-filter:blur(24px) saturate(1.5);
  border:1px solid var(--glass-line);
  box-shadow:var(--shadow);
  background-image:linear-gradient(180deg,var(--sheen),transparent 55%);
}
.nav::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
}
.nav-item{
  position:relative;flex:1;height:60px;min-width:0;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding-top:8px;gap:4px;border-radius:20px;color:var(--muted);
  transition:color var(--t-fast) var(--ease);
}
.nav-item .ind{
  position:absolute;top:5px;left:50%;width:56px;height:30px;margin-left:-28px;
  border-radius:999px;background:var(--brand-c);opacity:.001;transform:scale(.82);
  transition:opacity var(--t-fast) var(--ease),transform var(--t-fast) var(--ease);
}
.nav-item .ic{position:relative;z-index:1;transition:transform var(--t-fast) var(--ease)}
.nav-item .lbl{position:relative;z-index:1;font-size:10.5px;line-height:12px;font-weight:500;white-space:nowrap}
.nav-item.on{color:var(--brand)}
.nav-item.on .ind{opacity:1;transform:scale(1)}
.nav-item.on .ic{transform:scale(1.14)}
.nav-item:active .ic{transform:scale(.94)}

/* dock（操控页底部玻璃板） */
.dock{
  flex:none;z-index:14;margin:6px 12px var(--clearance);
  border-radius:28px;
  background:var(--glass);
  -webkit-backdrop-filter:blur(24px) saturate(1.5);
  backdrop-filter:blur(24px) saturate(1.5);
  border:1px solid var(--glass-line);
  box-shadow:var(--shadow);
  background-image:linear-gradient(180deg,var(--sheen),transparent 55%);
  padding:10px;
  animation:dockIn var(--t-slow) var(--ease) both;
}
@keyframes dockIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ============================================================
   通用组件
   ============================================================ */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:16px 4px 8px}
.sec h2{margin:0;font-size:16px;line-height:24px;font-weight:600;letter-spacing:.1px}
.sec .meta{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);flex:none}
.sec .meta b{font-weight:600;color:var(--on-raised)}
.dot{width:7px;height:7px;border-radius:99px;background:var(--ok);flex:none}
.dot.err{background:var(--err)}
.dot.warn{background:var(--warn)}
.dot.brand{background:var(--brand)}
.dot.run{animation:pulse 1.5s var(--ease-io) infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.86)}45%{opacity:1;transform:scale(1)}}

.card{background:var(--card);border:1px solid var(--card-border);border-radius:24px}
.card.raised{background:var(--raised)}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.item{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;border-radius:20px;
  background:var(--card);border:1px solid var(--card-border);
  text-align:left;width:100%;
  transition:transform var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),background var(--t-fast) var(--ease);
}
.item:active{transform:scale(.97)}
.item:hover{border-color:var(--hair)}
.itile{
  width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;
  background:var(--sunken);color:var(--on-raised);
}
.itile.sm{width:40px;height:40px;border-radius:12px}
.itile.brand{background:color-mix(in srgb,var(--brand) 15%,transparent);color:var(--brand)}
.itile.cool{background:color-mix(in srgb,var(--cool) 15%,transparent);color:var(--cool)}
.itile.warm{background:color-mix(in srgb,var(--warm) 15%,transparent);color:var(--warm)}
.itile.err{background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--err)}
.itile.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.skill-empty{margin:0;padding:4px 0;font-size:12px;line-height:16px;
  color:color-mix(in srgb,var(--on-raised) 60%,transparent)}
/* 权限条目容器色调：已授权 = Success 8%，待授权 = primary 12%（不带额外描边） */
.item.ok{background:color-mix(in srgb,var(--ok) 8%,transparent)}
.item.pend{background:color-mix(in srgb,var(--brand) 12%,transparent)}
.radar-note{display:flex;align-items:center;gap:8px;margin:0 0 0;
  font-size:14px;line-height:20px;color:var(--muted)}
.item-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item-t b{display:block;font-size:16px;line-height:24px;font-weight:600;letter-spacing:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-t em{display:block;font-style:normal;font-size:12px;line-height:16px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 权限条目：titleSmall（14sp SemiBold），与主页 StatusCard 的 titleMedium 区分 */
.item.perm .item-t b{font-size:14px;line-height:20px}
.item .itile .ic{width:22px;height:22px}
.item .tail{flex:none;display:flex;align-items:center;gap:8px;color:var(--muted)}
.item.tall{align-items:flex-start}
.item.tall .itile{margin-top:2px}
.chev{color:var(--outline);flex:none}

.pill{
  display:inline-flex;align-items:center;gap:4px;flex:none;
  padding:4px 10px;border-radius:10px;
  font-size:12px;line-height:16px;font-weight:600;letter-spacing:0;
  background:color-mix(in srgb,var(--on-raised) 14%,transparent);color:var(--on-raised);
}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.pill.err{background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--err)}
.pill.brand{background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 16px;border-radius:14px;font-size:13.5px;font-weight:600;line-height:20px;
  transition:transform var(--t-fast) var(--ease),background var(--t-fast) var(--ease),opacity var(--t-fast);
  white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);color:var(--on-brand)}
.btn.primary:hover{filter:brightness(1.04)}
.btn.neutral{background:var(--sunken);color:var(--on-raised);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--brand);padding:9px 10px}
.btn.danger{background:var(--err-c);color:var(--on-err-c)}
.btn.outline{background:transparent;border:1px solid var(--line);color:var(--on-bg)}
.btn.reject{background:transparent;border:1px solid color-mix(in srgb,var(--err) 45%,transparent);color:var(--err)}
.btn.sm{padding:6px 12px;border-radius:12px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default;transform:none}

.iconbtn{
  width:36px;height:36px;border-radius:12px;display:grid;place-items:center;
  color:var(--on-raised);transition:background var(--t-fast),transform var(--t-fast) var(--ease);
}
.iconbtn:hover{background:color-mix(in srgb,var(--on-bg) 7%,transparent)}
.iconbtn:active{transform:scale(.94)}
.iconbtn.sm{width:30px;height:30px;border-radius:10px}
.iconbtn.brand{color:var(--brand)}
.iconbtn.tiny{width:26px;height:26px;border-radius:9px}

.switch{
  position:relative;width:40px;height:22px;border-radius:10px;flex:none;
  background:var(--sunken);border:1px solid var(--line);
  transition:background var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease);
}
.switch i{
  position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:99px;
  background:var(--on-raised);transition:transform var(--t-fast) var(--ease),background var(--t-fast);
}
.switch.on{background:var(--brand);border-color:var(--brand)}
.switch.on i{transform:translateX(18px);background:var(--on-brand)}

.seg{
  display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--sunken);
  border:1px solid var(--line);
}
.seg button{
  flex:1;padding:6px 10px;border-radius:10px;font-size:12.5px;font-weight:600;color:var(--muted);
  transition:background var(--t-fast),color var(--t-fast);
}
.seg button.on{background:var(--brand-c);color:var(--on-brand-c)}

.field{display:flex;flex-direction:column;gap:6px;padding:12px 14px}
.field label{font-size:11.5px;font-weight:600;letter-spacing:.3px;color:var(--muted)}
.field input,.field textarea{
  width:100%;background:var(--sunken);border:1px solid var(--line);border-radius:12px;
  padding:9px 12px;font-size:13.5px;line-height:20px;color:var(--on-bg);
  transition:border-color var(--t-fast);
}
.field input:focus,.field textarea:focus{border-color:color-mix(in srgb,var(--brand) 55%,transparent)}
.field textarea{resize:vertical;min-height:76px}
.hint{font-size:11.5px;line-height:16px;color:var(--muted)}

/* ============================================================
   主页
   ============================================================ */
.banner{
  display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;
  background:color-mix(in srgb,var(--brand) 10%,transparent);
  border:1px solid color-mix(in srgb,var(--brand) 26%,transparent);
}
.banner b{font-size:13.5px;font-weight:600}
.banner em{font-style:normal;display:block;font-size:11.5px;line-height:16px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner .ic{color:var(--brand)}

.home-list{background:var(--card);border:1px solid var(--card-border);border-radius:24px;overflow:hidden}
.home-list .item{border:0;border-radius:0;background:transparent;border-bottom:1px solid var(--hair)}
.home-list .item:last-child{border-bottom:0}
.home-list .item:hover{background:color-mix(in srgb,var(--on-bg) 4%,transparent)}

.permit{display:flex;flex-direction:column;gap:8px;padding:13px 14px;border-radius:20px;
  background:var(--card);border:1px solid var(--card-border);text-align:left;width:100%;
  transition:transform var(--t-fast) var(--ease)}
.permit:active{transform:scale(.97)}
.permit .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.permit .top b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.permit p{margin:0;font-size:11.5px;line-height:16px;color:var(--muted);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.permit .who{display:flex;align-items:center;gap:8px;min-width:0}
.permit .who .ic{color:var(--brand);width:17px;height:17px}

.scan-line{
  height:1px;border-radius:1px;margin:6px 0;
  background:linear-gradient(90deg,transparent,var(--brand),transparent);
  background-size:200% 100%;
  animation:scan 1.8s linear infinite;
}
@keyframes scan{from{background-position:180% 0}to{background-position:-80% 0}}

.empty-skill{padding:18px 14px;text-align:center;color:var(--muted);font-size:12.5px;line-height:18px}
.version{text-align:center;font-size:11px;letter-spacing:.4px;color:var(--outline);padding:26px 0 8px}

/* ============================================================
   操控页
   ============================================================ */
.agent-wrap{position:relative}
.agent-list{display:flex;flex-direction:column;gap:14px;padding-right:var(--rail,0px)}
.agent-list.has-rail{padding-right:22px}
.rail{position:absolute;top:8px;bottom:8px;right:0;width:16px;display:flex;flex-direction:column;
  justify-content:center;gap:16px;pointer-events:none}
.rail .rdot{width:5px;height:5px;border-radius:99px;background:var(--rail-idle);align-self:center;
  transition:background var(--t-slow),transform var(--t-slow)}
.rail .rdot.on{background:var(--rail-active);transform:scale(1.5)}
.rail .rdot.done{background:var(--rail-done)}

.agent-empty{padding:16px 0 8px;display:flex;flex-direction:column;align-items:center;gap:0}
.agent-empty .hero-tile{
  width:64px;height:64px;border-radius:24px;display:grid;place-items:center;
  background:var(--sunken);color:color-mix(in srgb,var(--on-raised) 72%,transparent);
}
.agent-empty .hero-tile .ic{width:30px;height:30px}
.agent-empty h2{margin:12px 0 0;font-size:16px;line-height:24px;font-weight:600}
/* 对齐 AgentEmptyState.kt：Item 圆角 warningContainer + 1dp outlineSoft，正文 bodySmall，无图标 */
.warn-note{
  display:block;margin-top:16px;padding:16px;border-radius:20px;
  background:var(--warn-c);color:var(--on-warn-c);font-size:12px;line-height:16px;
  border:1px solid var(--line);
}
.suggest{width:100%;display:flex;flex-direction:column;gap:8px;margin-top:16px}
.suggest .lbl{font-size:12px;line-height:16px;font-weight:500;color:var(--on-raised);width:100%}
.sug{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:12px 16px;border-radius:14px;background:var(--raised);
  border:1px solid var(--line);font-size:14px;line-height:20px;color:var(--on-bg);
  transition:transform var(--t-fast) var(--ease),border-color var(--t-fast);
}
.sug:active{transform:scale(.98)}
.sug span{flex:1;min-width:0}
.sug .chev{width:16px;height:16px;color:var(--on-raised)}

.row-me{display:flex;justify-content:flex-end}
.bubble{
  max-width:90%;padding:11px 15px;border-radius:18px 18px 6px 18px;
  background:var(--user-b);color:var(--on-user-b);
  font-size:13.5px;line-height:20px;white-space:pre-wrap;overflow-wrap:anywhere;
  animation:itemIn var(--t-slow) var(--ease) both;
}
.bubble.queue{background:var(--raised);color:var(--on-raised);border:1px solid var(--card-border);
  border-radius:16px}
.bubble .qtag{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);margin-top:3px}
.bubble .qtag .dot{width:5px;height:5px;background:var(--warn)}

/* 对齐 PlanStreamingItem：Bubble18、messageBubbleAgent 底、padding 16、满角落 */
.ai-bubble{
  width:94%;max-width:94%;padding:16px;border-radius:18px;
  background:var(--agent-b);color:var(--on-agent-b);
  font-size:14px;line-height:20px;overflow-wrap:anywhere;
  animation:itemIn var(--t-slow) var(--ease) both;
}
.ai-head{display:flex;align-items:center;gap:8px}
/* 规划呼吸点 8dp：减少动画时静态常亮 */
.pdot{width:8px;height:8px;border-radius:99px;background:var(--brand);flex:none;
  animation:pulse 1.2s var(--ease-io) infinite alternate}
@keyframes pulse{from{opacity:.35}to{opacity:1}}
.ai-head b{font-size:12px;line-height:16px;font-weight:600;color:var(--on-agent-b)}
.ai-txt{margin-top:8px}
.caret::after{content:"";display:inline-block;width:6px;height:14px;margin-left:2px;
  background:var(--brand);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ai-bubble .plan-lines{margin-top:6px;padding-top:6px;border-top:1px solid var(--hair)}
.plan-line{display:flex;gap:8px;font-size:12.5px;line-height:19px;color:var(--on-agent-b);opacity:.92}
.plan-line i{font-style:normal;color:var(--brand);font-weight:600;font-size:11px;min-width:12px}

/* 对齐 PlanApprovedItem：Item 圆角、brandContainer 底、无描边、padding H16 V12、bodySmall Medium */
.badge-card{
  display:flex;gap:8px;align-items:center;padding:12px 16px;border-radius:20px;
  background:var(--brand-c);border:0;
  font-size:12px;line-height:16px;font-weight:500;color:var(--on-brand-c);
  animation:itemIn var(--t-slow) var(--ease) both;
}

.tool{
  padding:12px 14px;border-radius:18px;background:var(--card);border:1px solid var(--card-border);
  display:flex;gap:11px;align-items:flex-start;animation:itemIn var(--t-slow) var(--ease) both;
}
.tool .idx{
  width:22px;height:22px;border-radius:8px;flex:none;display:grid;place-items:center;
  background:var(--sunken);color:var(--brand);font-size:10.5px;font-weight:700;letter-spacing:.4px;
}
.tool .tool-b{flex:1;min-width:0}
.tool .tool-b b{display:block;font-size:13px;line-height:19px;font-weight:600}
.tool .tool-b em{display:block;font-style:normal;font-size:11.5px;line-height:16px;color:var(--muted);margin-top:1px}
.tool .state{flex:none;color:var(--muted);display:flex;align-items:center;gap:6px;font-size:11px}
.spin{width:14px;height:14px;border-radius:99px;border:1.5px solid var(--line);
  border-top-color:var(--brand);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.live-msg{
  display:flex;align-items:center;gap:9px;padding:2px 2px;font-size:12px;color:var(--muted);
  animation:itemIn var(--t-slow) var(--ease) both;
}
.live-msg .shimmer{
  background:linear-gradient(90deg,var(--muted) 0%,var(--on-bg) 45%,var(--muted) 90%);
  background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shimmer 2.8s linear infinite;font-weight:500;
}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}

.done-card,.fail-card,.notice-card{
  padding:16px;border-radius:20px;animation:itemIn var(--t-slow) var(--ease) both;
}
.done-card{background:var(--ok-c);border:1px solid color-mix(in srgb,var(--ok) 24%,transparent)}
/* 对齐 FailedItem：errorContainer 底、无描边、Item 圆角、padding 16 */
.fail-card{background:var(--err-c);border:0}
/* 对齐 NoticeItem：warningContainer 底、TouchApp 16 + bodySmall */
.notice-card{display:flex;align-items:flex-start;gap:8px;background:var(--warn-c);border:0;
  padding:12px 16px;font-size:12px;line-height:18px;color:var(--on-warn-c)}
.notice-card .ic{flex:none;color:var(--on-warn-c);margin-top:1px}
.done-head{display:flex;align-items:center;gap:8px}
.done-head .ic{color:var(--ok)}
.done-head b{font-size:13.5px;font-weight:700;color:var(--on-ok-c);flex:1}
.done-card p{margin:6px 0 0;font-size:12px;line-height:18px;color:var(--on-ok-c);opacity:.9}
.done-meta{display:flex;gap:10px;margin-top:8px;font-size:10.5px;color:var(--on-ok-c);opacity:.72;
  font-variant-numeric:tabular-nums}
.fail-head{display:flex;align-items:center;gap:8px;color:var(--on-err-c)}
.fail-head .ic{width:18px;height:18px}
.fail-head b{font-size:14px;line-height:20px;font-weight:700;color:var(--on-err-c)}
.fail-card p{margin:4px 0 12px;font-size:14px;line-height:22px;color:var(--on-err-c)}
.fail-card p:last-child{margin-bottom:0}
.fail-actions{display:flex;gap:8px}

.note-bubble{
  width:92%;border-radius:16px;background:color-mix(in srgb,var(--card-2) 88%,transparent);
  border:1px solid var(--card-border);padding:10px 13px;
}
.note-bubble .nb-head{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.note-bubble .nb-head b{font-size:11.5px;color:var(--on-raised);font-weight:600}
.note-bubble .nb-txt{margin-top:3px;font-size:12px;line-height:18px;color:var(--on-raised);
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.note-bubble.open .nb-txt{-webkit-line-clamp:unset}
@keyframes itemIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

/* 对齐 AgentRunStatusStrip：Item20、surfaceRaised、1dp outlineSoft、padding H16 V12 */
.strip{
  border-radius:20px;padding:12px 16px;background:var(--raised);border:1px solid var(--line);
  display:flex;flex-direction:column;gap:8px;margin-bottom:8px;
  animation:itemIn var(--t-fast) var(--ease) both;
}
.strip.alert{background:var(--err-c);border-color:color-mix(in srgb,var(--err) 30%,transparent)}
.strip-r1{display:flex;align-items:center;gap:8px}
.strip-r1 b{font-size:14px;line-height:20px;font-weight:600;flex:1;min-width:0;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.strip-r1 .elapsed{font-size:11px;line-height:16px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.strip-r2{display:flex;align-items:center;gap:6px}
.strip-r2 .grow{flex:1}
/* AgentActionButton：Tile14、labelLarge SemiBold；H12 略收窄以在 412dp 内排满四个控件 */
.abtn{display:inline-flex;align-items:center;gap:4px;flex:none;
  padding:10px 12px;border-radius:14px;background:var(--sunken);color:var(--on-raised);
  border:1px solid var(--line);font-size:14px;line-height:20px;font-weight:600;white-space:nowrap}
.abtn .ic{width:16px;height:16px}
.abtn.danger{background:var(--err-c);color:var(--on-err-c);border:0}
.abtn.primary{background:var(--brand);color:var(--on-brand);border:0}

/* 输入面 */
/* 对齐 AgentComposer：Card24、1dp outlineSoft、左 12dp（聚焦 16dp）/ 右 8dp / 上下 4dp */
.composer{
  border-radius:24px;background:var(--raised);border:1px solid var(--line);
  padding:4px 8px 4px 12px;display:flex;align-items:flex-end;gap:8px;
  transition:border-radius var(--t-fast) var(--ease),border-color var(--t-fast),padding var(--t-fast);
}
.composer.focus{border-radius:28px;border-color:color-mix(in srgb,var(--brand) 45%,transparent);padding:4px 8px 4px 16px}
.composer.locked{opacity:.7}
/* 规划期旁路出口：Tile 圆角 + 1dp outlineSoft + labelLarge SemiBold */
.cancel-plan{flex:none;border-radius:14px;border:1px solid var(--line);padding:10px 12px;
  font-size:14px;line-height:20px;font-weight:600;color:var(--on-raised);background:transparent}
.composer textarea{
  flex:1;min-width:0;resize:none;border:0;background:transparent;
  padding:10px 0;min-height:40px;max-height:120px;
  font-size:14px;line-height:20px;color:var(--on-bg);
}
.composer textarea::placeholder{color:var(--on-raised)}
.sendbtn{
  width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none;
  background:var(--brand);color:var(--on-brand);margin-bottom:0;
  transition:transform var(--t-fast) var(--ease),opacity var(--t-fast);
}
.sendbtn:active{transform:scale(.94)}
.sendbtn:disabled{background:var(--sunken);color:var(--outline);cursor:default}
.sendbtn.dim{background:var(--sunken);color:var(--outline)}
/* 审核条：单行——labelMedium「审核 AI」+ labelSmall 说明 + 开关 */
.review-row{display:flex;align-items:center;gap:8px;padding:0 4px 8px}
.review-row b{font-size:12px;line-height:16px;font-weight:500;white-space:nowrap}
.review-row em{font-style:normal;flex:1;min-width:0;font-size:11px;line-height:16px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 对齐 AgentModeBar：Chip10 触发器、brandContainer 底、H12 V8、labelMedium */
.modebar{display:flex;align-items:center;padding:0 0 2px;gap:8px}
.mode-chip{
  display:inline-flex;align-items:center;gap:4px;padding:8px 12px;border-radius:10px;
  background:var(--brand-c);border:1px solid var(--line);color:var(--on-brand-c);
  font-size:12px;line-height:16px;font-weight:500;transition:transform var(--t-fast) var(--ease);
}
.mode-chip:active{transform:scale(.96)}
.mode-panel{
  display:flex;flex-direction:column;border-radius:24px;overflow:hidden;
  background:var(--raised);border:1px solid var(--line);margin-bottom:8px;
  animation:panelIn var(--t-fast) var(--ease) both;
}
@keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mode-row{display:flex;align-items:center;gap:8px;padding:8px 12px;text-align:left}
.mode-row.on{background:var(--brand-c)}
.mode-row .mt{flex:1;min-width:0}
.mode-row b{display:block;font-size:14px;line-height:20px;font-weight:500}
.mode-row em{font-style:normal;display:block;font-size:11px;line-height:16px;color:var(--muted)}
.mode-row.on b{color:var(--on-brand-c)}
.mode-row .ic{color:var(--on-raised)}
.mode-row.on .ic{color:var(--on-brand-c)}

/* 对齐 PlanApprovalPanel：Card24、surfaceRaised 底、1dp outlineSoft、padding H16 V12 */
.plan-panel{
  border-radius:24px;background:var(--raised);border:1px solid var(--line);
  padding:12px 16px;margin-bottom:8px;animation:panelIn var(--t-fast) var(--ease) both;
}
.plan-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.plan-head b{font-size:12px;line-height:16px;font-weight:600;color:var(--on-bg);flex:1;min-width:0}
.plan-time{font-size:11px;line-height:16px;color:var(--muted);margin-top:2px}
/* 步骤清单限高内滚，行内 2dp 垂直留白，无行间距 */
.plan-steps{margin:8px 0;padding:0;max-height:132px;overflow-y:auto;display:flex;flex-direction:column;
  scrollbar-width:thin}
.plan-steps::-webkit-scrollbar{width:5px}
.plan-steps::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.pstep{display:flex;gap:0;padding:2px 0}
.pstep i{font-style:normal;min-width:16px;width:16px;color:var(--brand);font-weight:700;
  font-size:11px;line-height:16px}
.pstep b{display:block;font-weight:400;font-size:12px;line-height:16px;color:var(--on-bg)}
.pstep em{font-style:normal;display:block;color:var(--muted);font-size:11px;line-height:16px}
.plan-actions{display:flex;gap:8px;margin-top:8px}
.plan-actions .btn{flex:1}

/* 对齐 QueueStrip：Tile14、brandContainer 底、padding H12 V8、labelMedium、无圆点 */
.queue-strip{
  display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:8px 12px;border-radius:14px;
  background:var(--brand-c);color:var(--on-brand-c);font-size:12px;line-height:16px;
}
.queue-strip b{flex:1;font-weight:500}
.queue-strip button{color:var(--brand);font-size:12px;line-height:16px;font-weight:600;padding:0}

/* 悬浮窗 */
.floatwin{
  position:absolute;right:10px;bottom:calc(var(--clearance) + 10px);z-index:32;
  width:232px;
  border-radius:20px;background:var(--glass-solid);
  -webkit-backdrop-filter:blur(22px) saturate(1.4);
  backdrop-filter:blur(22px) saturate(1.4);
  border:1px solid var(--glass-line);
  box-shadow:0 16px 36px rgba(0,0,0,.44);
  padding:10px 12px;
  animation:floatIn var(--t-slow) var(--ease) both;
}
@keyframes floatIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fw-top{display:flex;align-items:center;gap:6px}
.fw-top .dot{width:6px;height:6px}
.fw-top span{font-size:9.5px;font-weight:700;letter-spacing:1.3px;color:var(--brand);flex:1}
.fw-top button{font-size:10px;color:var(--muted);padding:1px 3px}
.fw-main{font-size:14px;font-weight:600;line-height:20px;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fw-sub{font-size:10.5px;color:var(--muted);margin-top:1px;font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fw-acts{display:flex;gap:6px;margin-top:8px}
.fw-acts button{
  flex:1;padding:5px 0;border-radius:10px;background:color-mix(in srgb,var(--brand) 14%,transparent);
  color:var(--brand);font-size:10.5px;font-weight:600;
}

/* 预览浮层 */
.scrim{
  position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.36);
  display:flex;align-items:center;justify-content:center;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  animation:fadeIn var(--t-fast) linear both;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  width:calc(100% - 32px);max-width:300px;max-height:88%;overflow-y:auto;
  border-radius:32px;background:var(--raised);border:1px solid var(--card-border);
  padding:16px;box-shadow:var(--shadow);
  animation:modalIn var(--t-slow) var(--ease) both;
}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;gap:8px}
.modal-head b{font-size:13px;font-weight:600;flex:1}
.modal-head .sq{width:8px;height:8px;border-radius:4px;background:var(--brand)}
.phone{
  width:200px;max-width:100%;aspect-ratio:9/16;margin:12px auto 0;position:relative;
  border-radius:32px;background:var(--sunken);border:2px solid var(--outline);
  overflow:hidden;
}
.phone-screen{
  position:absolute;inset:7px;border-radius:18px;overflow:hidden;
  background:#F4F5F3;color:#151715;display:flex;flex-direction:column;
}
.phone-cam{
  position:absolute;top:9px;left:50%;transform:translateX(-50%);width:6px;height:6px;
  border-radius:99px;background:#0B0D0B;z-index:3;
}
.ps-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 3px;
  font-size:8px;color:#3B413C}
.ps-status{display:flex;gap:3px;align-items:center}
.ps-status i{display:block;width:3px;border-radius:1px;background:#3B413C}
.ps-status i:nth-child(1){height:4px}.ps-status i:nth-child(2){height:6px}.ps-status i:nth-child(3){height:8px}
.ps-nav{display:flex;align-items:center;gap:7px;padding:4px 12px 8px}
.ps-nav b{font-size:12.5px;font-weight:600;letter-spacing:.2px}
.ps-nav .ps-back{width:9px;height:9px;border-left:1.5px solid #3B413C;border-bottom:1.5px solid #3B413C;
  transform:rotate(45deg);margin-left:-2px}
.ps-body{flex:1;padding:0 10px;overflow:hidden}
.ps-row{display:flex;align-items:center;gap:8px;padding:9px 10px;margin-bottom:6px;
  border-radius:10px;background:#FFFFFF;border:1px solid #E3E6E0}
.ps-row .ps-ic{width:20px;height:20px;border-radius:6px;background:#E7F3EE;color:#0E7C66;
  display:grid;place-items:center;flex:none}
.ps-row .ps-ic .ic{width:11px;height:11px}
.ps-row b{font-size:9.5px;font-weight:500;color:#151715;flex:1}
.ps-row small{font-size:8px;color:#6E756E}
.ps-group{font-size:7.5px;letter-spacing:.4px;color:#6E756E;padding:2px 2px 4px}
.ps-font{font-size:var(--psfont,9px);line-height:1.5;color:#3B413C;padding:10px 11px;background:#FFFFFF;
  border:1px solid #E3E6E0;border-radius:10px}
.ps-slider{position:relative;height:3px;border-radius:2px;background:#D6DBD4;margin:14px 3px 12px}
.ps-slider .fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:#0E7C66;
  transition:width .5s var(--ease)}
.ps-slider .knob{position:absolute;top:-5px;width:13px;height:13px;border-radius:99px;background:#0E7C66;
  transition:left .5s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.ps-screen-dots{display:flex;justify-content:center;gap:5px;padding:6px 0 8px}
.ps-screen-dots i{width:4px;height:4px;border-radius:99px;background:#C2C8C0}
.ps-screen-dots i.on{background:#0E7C66}
.cursor-dot{
  position:absolute;z-index:4;width:14px;height:14px;border-radius:99px;
  background:rgba(255,255,255,.28);border:1.5px solid rgba(255,255,255,.7);
  transform:translate(-50%,-50%);transition:left .4s var(--ease),top .4s var(--ease);
  box-shadow:0 0 0 4px rgba(255,255,255,.1);
}
.modal-tip{text-align:center;font-size:10.5px;color:var(--muted);margin-top:10px}

/* 抽屉 */
.drawer-scrim{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.5);
  animation:fadeIn var(--t-fast) linear both}
.drawer{
  position:absolute;top:0;right:0;bottom:0;z-index:51;width:min(344px,86%);
  display:flex;flex-direction:column;
  background:var(--glass-solid);
  -webkit-backdrop-filter:blur(26px) saturate(1.4);
  backdrop-filter:blur(26px) saturate(1.4);
  border-left:1px solid var(--glass-line);
  border-radius:24px 0 0 24px;
  box-shadow:-24px 0 60px rgba(0,0,0,.42);
  animation:drawerIn var(--t-slow) var(--ease) both;
}
@keyframes drawerIn{from{transform:translateX(100%)}to{transform:none}}
.drawer-head{display:flex;align-items:center;padding:18px 18px 10px;gap:8px}
.drawer-head h2{margin:0;font-size:22px;line-height:28px;font-weight:700;flex:1}
.drawer-body{flex:1;overflow-y:auto;padding:4px 16px 20px;display:flex;flex-direction:column;gap:8px}
.drawer-note{font-size:11px;line-height:16px;color:var(--muted);padding:2px 2px 4px}
.task-row{display:flex;flex-direction:column;gap:2px;padding:11px 13px;border-radius:16px;
  background:var(--raised);border:1px solid var(--card-border);text-align:left}
.task-row b{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-row em{font-style:normal;font-size:10.5px;color:var(--muted)}
.empty-mini{padding:26px 8px;text-align:center;color:var(--muted);font-size:12px;line-height:18px}
.empty-mini b{display:block;font-size:13px;color:var(--on-bg);font-weight:600;margin-bottom:4px}

/* 记忆 */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.stat{padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--card-border)}
.stat span{display:block;font-size:12px;line-height:16px;color:var(--muted)}
.stat b{display:block;margin-top:6px;font-size:28px;line-height:36px;font-weight:700;
  font-variant-numeric:tabular-nums}
.scard{margin:8px 0;padding:16px;border-radius:24px;background:var(--card);border:1px solid var(--card-border)}
.scard-top{display:flex;align-items:center;gap:8px}
.scard-top b{font-size:16px;line-height:24px;font-weight:700}
.scount{font-size:12px;line-height:16px;font-weight:500;padding:2px 8px;border-radius:10px}
.sclr{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:14px;font-weight:500;
  color:var(--brand);padding:4px 2px}
.sclr .ic{width:16px;height:16px}
.scard-body{margin-top:8px}
.tmem{padding:12px;border-radius:14px;border:1px solid color-mix(in srgb,var(--outline) 26%,transparent);
  margin-bottom:6px}
.tmem-top{display:flex;align-items:center;gap:8px}
.tmem-top b{flex:1;min-width:0;font-size:13px;line-height:18px;font-weight:600;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tmem-del{width:28px;height:28px;border-radius:99px;display:grid;place-items:center;color:var(--muted);flex:none}
.tmem-del.armed{color:var(--err)}
.tmem-step{margin-top:2px;font-size:11px;line-height:15px;color:var(--muted)}
.tsec{margin-top:8px}
.tsec i{display:block;font-style:normal;font-size:11.5px;line-height:16px;color:var(--muted)}
.tsec p{margin:2px 0 0;font-size:12px;line-height:17px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mline{display:flex;align-items:center;gap:10px;padding:6px 0}
.mline .mdot{width:10px;height:10px;border-radius:99px;flex:none}
.mline .mic{width:16px;height:16px;flex:none}
.mline .mtxt{flex:1;min-width:0}
.mline .mtxt b{display:block;font-size:13px;line-height:18px;font-weight:500}
.mline .mtxt span{display:block;font-size:11px;line-height:15px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mempty{font-size:12px;line-height:17px;color:var(--muted);padding:2px 0}
.empty-card.mem{margin:16px 0;background:var(--card);border-radius:24px;
  padding:24px;gap:12px}
.empty-card.mem .big{width:auto;height:auto;background:none;color:var(--muted)}
.empty-card.mem .big .ic{width:40px;height:40px}
.empty-card.mem b{font-size:16px;line-height:22px;font-weight:500}
.empty-card.mem p{font-size:12px;line-height:17px}
.empty-card.mem .btn{background:transparent;border:1px solid color-mix(in srgb,var(--outline) 40%,transparent);
  color:var(--brand);border-radius:14px;padding:8px 16px;font-size:13px}
.empty-card{padding:28px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;
  text-align:center;border-radius:24px;background:var(--raised);border:1px solid var(--card-border)}
.empty-card .big{width:54px;height:54px;border-radius:20px;display:grid;place-items:center;
  background:var(--sunken);color:var(--brand)}
.empty-card b{font-size:14px;font-weight:600}
.empty-card p{margin:0;font-size:12px;line-height:18px;color:var(--muted);max-width:280px}
.graph{
  position:relative;border-radius:24px;overflow:hidden;
  background:color-mix(in srgb,var(--card-2) 45%,transparent);
}
.graph svg{position:absolute;inset:0;width:100%;height:100%}
.gnode{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;
  align-items:center;gap:1px;cursor:pointer;z-index:2;text-align:center}
.gnode .gdot{
  border-radius:99px;display:grid;place-items:center;color:#fff;position:relative;
  transition:transform var(--t-fast) var(--ease),box-shadow var(--t-fast);
}
.gnode .gdot::after{content:"";position:absolute;inset:14%;border-radius:99px;
  background:rgba(255,255,255,.35);pointer-events:none}
.gnode .gdot b{position:relative;z-index:1;font-size:11px;line-height:13px;font-weight:700;
  color:#fff;white-space:nowrap}
.gnode.groot .gdot b{font-size:15px;line-height:17px}
.gnode .glabel{font-size:11px;line-height:14px;font-weight:500;color:var(--on-bg);
  max-width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gnode .gsub{font-size:9px;line-height:12px;color:var(--muted);max-width:96px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gnode .gsub.on{color:rgba(255,255,255,.85);font-size:9px}
.gnode .gdot::before{content:"";position:absolute;inset:-20%;border-radius:99px;
  background:var(--c);opacity:0;transition:opacity var(--t-fast);z-index:-1;pointer-events:none}
.gnode.sel .gdot::before{opacity:.3}
.graph-hint{margin:4px 0 0;font-size:11px;line-height:16px;color:var(--muted)}
.gdetail{margin-top:8px;padding:12px;border-radius:24px;display:flex;align-items:center;gap:10px;
  animation:itemIn var(--t-fast) var(--ease) both}
.gdetail .gd-dot{width:12px;height:12px;border-radius:99px;flex:none}
.gdetail .gd-txt{flex:1;min-width:0}
.gdetail .gd-txt b{display:block;font-size:14px;line-height:20px;font-weight:600;color:var(--on-bg)}
.gdetail .gd-txt span{display:block;font-size:12px;line-height:16px;color:var(--muted)}
.gdetail .gd-close{flex:none;font-size:14px;font-weight:500;padding:8px 10px}
.mem-list{display:flex;flex-direction:column;gap:8px}
.mem-row{padding:11px 13px;border-radius:16px;background:var(--card);border:1px solid var(--card-border);
  display:flex;gap:10px;align-items:flex-start}
.mem-row .ic{color:var(--brand);margin-top:2px}
.mem-row .mt{flex:1;min-width:0}
.mem-row b{display:block;font-size:12.5px;font-weight:600}
.mem-row p{margin:1px 0 0;font-size:11px;line-height:16px;color:var(--muted)}
.mem-row .when{flex:none;font-size:10px;color:var(--outline)}

/* ============================================================
   对话 / 编码 —— 对齐 ChatScreen.kt / CodingScreen.kt
   三个输入面共用同一套几何：Card 圆角 + surfaceRaised 底 + 1dp 描边，
   上下各 4dp + 40dp 动作键 = 单行 48dp
   ============================================================ */
.chat-list{display:flex;flex-direction:column;gap:12px;padding:12px 0}
.chat-empty{flex:1;display:flex;align-items:center;justify-content:center;
  color:var(--on-raised);font-size:14px;line-height:20px}
/* 用户气泡：右对齐的主色胶囊面（primaryContainer） */
.chat-me{align-self:flex-end;max-width:300px;background:var(--brand-c);color:var(--on-brand-c);
  padding:8px 12px;border-radius:24px;font-size:14px;line-height:22px;
  white-space:pre-wrap;overflow-wrap:anywhere;animation:itemIn var(--t-slow) var(--ease) both}
/* AI 气泡：左对齐的浮起面，正文是 Markdown 段落 */
.chat-ai{align-self:stretch;background:var(--raised);color:var(--on-bg);
  padding:8px 12px;border-radius:24px;font-size:14px;line-height:22px;
  white-space:pre-wrap;overflow-wrap:anywhere;animation:itemIn var(--t-slow) var(--ease) both}
.chat-ai p{margin:0}
.chat-ai p+p{margin-top:10px}
.chat-ai code{font-family:ui-monospace,"SF Mono",Consolas,monospace;font-size:12.5px;
  background:var(--sunken);border:1px solid var(--line);padding:1px 5px;border-radius:6px}
.chat-thinking{display:flex;align-items:center;gap:8px;font-size:12px;line-height:16px;
  color:var(--on-raised)}
.chat-thinking .spin{width:14px;height:14px;border-width:1.6px}
.chat-input{
  margin-top:auto;display:flex;align-items:flex-end;gap:8px;
  padding:4px 8px 4px 12px;border-radius:24px;
  background:var(--raised);border:1px solid var(--line);
}
.chat-input textarea{flex:1;min-width:0;resize:none;border:0;background:transparent;
  min-height:40px;max-height:96px;padding:10px 0;font-size:14px;line-height:20px}
.chat-input textarea::placeholder{color:var(--on-raised)}
.chat-input .sendbtn{margin-bottom:0}

/* 工作区行：目录按钮 + 名称/连接点 + 路径 + 切换（不是卡片） */
.ws-head{display:flex;align-items:center;gap:4px}
.ws-head .folder{width:32px;height:32px;border-radius:16px;display:grid;place-items:center;
  color:var(--on-raised);flex:none;transition:background var(--t-fast)}
.ws-head .folder:hover{background:var(--card)}
.ws-head .wt{flex:1;min-width:0}
.ws-head .wname{display:flex;align-items:center;gap:8px}
.ws-head b{font-size:14px;line-height:20px;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-head em{font-style:normal;display:block;font-size:11px;line-height:16px;color:var(--on-raised);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conn{display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:16px;
  color:var(--on-raised);flex:none}
.conn .dot{width:6px;height:6px}
.ws-switch{font-size:12px;font-weight:500;color:var(--brand);padding:8px;flex:none}

/* 会话行：历史图标 + 标题 + 会话数 + 箭头 + 新会话 */
.session-head{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:24px;
  cursor:pointer;transition:background var(--t-fast)}
.session-head:hover{background:var(--card)}
.session-head .sth{display:flex;color:var(--on-raised);flex:none}
.session-head .sttl{flex:1;min-width:0;font-size:14px;line-height:20px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.session-head .scount{font-size:11px;line-height:16px;color:var(--on-raised);flex:none}
.session-head .chev{display:flex;color:var(--on-bg);flex:none}
.session-head .newbtn{font-size:12px;font-weight:500;color:var(--brand);padding:6px 8px;flex:none}

.coding-empty{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;
  color:var(--on-raised);font-size:14px;line-height:22px}

/* 工具 / 子 agent 卡：Chip 圆角 + surfaceRaised，名称在上、参数摘要在下、右侧执行态 */
.run-card{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;
  background:var(--raised);animation:itemIn var(--t-slow) var(--ease) both}
.run-card>.ic{color:var(--on-raised)}
.run-card .rc-t{flex:1;min-width:0}
.run-card .rc-t b{display:block;font-size:14px;line-height:20px;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run-card .rc-t em{font-style:normal;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;font-size:11px;line-height:16px;color:var(--on-raised)}
.run-card .rc-s{display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:16px;flex:none}

/* 内嵌审批卡（项目铁律：不走系统弹窗） */
.appr-card{background:var(--raised);border-radius:24px;padding:12px;
  animation:itemIn var(--t-slow) var(--ease) both}
.appr-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.appr-head .ic{color:var(--brand)}
.appr-head b{font-size:14px;line-height:20px;font-weight:600}
.appr-card p{margin:0 0 8px;font-size:14px;line-height:22px;color:var(--on-bg)}
.appr-actions{display:flex;gap:8px}
/* 允许 = Button（primary 实底 40dp）、拒绝 = OutlinedButton（描边 + error 前景） */
.appr-actions .btn{flex:1;height:40px;padding:0 16px;font-size:14px;line-height:20px;font-weight:500}
.appr-res{font-size:14px;line-height:20px;font-weight:500;color:var(--on-raised)}

.code-card{border-radius:14px;background:var(--sunken);border:1px solid var(--line);
  overflow:hidden;margin-top:10px}
.code-card .code-top{display:flex;align-items:center;justify-content:space-between;
  padding:6px 10px;border-bottom:1px solid var(--hair);font-size:11px;color:var(--on-raised)}
.code-card pre{margin:0;padding:10px 12px;overflow-x:auto;font-family:ui-monospace,"SF Mono",Consolas,monospace;
  font-size:11.5px;line-height:17px;color:var(--on-bg)}

/* 模型与权限入口：Chip 圆角，模型 + · + 审批档位 */
.model-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 8px;border-radius:10px;
  background:var(--raised);font-size:12px;line-height:16px;transition:transform var(--t-fast) var(--ease)}
.model-chip:active{transform:scale(.97)}
.model-chip .ic{color:var(--on-raised)}
.model-chip b{font-weight:400;font-size:12px;line-height:16px;color:var(--on-bg);max-width:180px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.model-chip .sep{color:var(--on-raised);font-size:11px;line-height:16px}
.model-chip .appr{color:var(--on-raised);font-size:11px;line-height:16px}
.model-chip .pending{color:var(--brand);font-size:11px;line-height:16px}
.coding-dock{display:flex;flex-direction:column;gap:4px;padding-top:4px;margin-top:auto}
/* 输入面按 CodingComposer：左右各 12dp（不是对话页的右 8dp） */
.coding-dock .composer{padding:4px 12px}
.coding-bar{display:flex;align-items:center;gap:8px}
/* 运行状态行：phase（labelSmall 主色）+ 耗时 · 轮次 · 并行子 agent */
.run-status{display:flex;align-items:center;gap:8px;padding-bottom:4px}
.run-status .ph{flex:0 1 auto;min-width:0;font-size:11px;line-height:16px;color:var(--brand);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run-status .meta{flex:none;font-size:11px;line-height:16px;color:var(--on-raised)}
.coding-busy{display:flex;align-items:center;gap:8px;padding-bottom:4px}
.coding-busy .spin{flex:none;width:14px;height:14px;border-width:1.6px;
  border-color:color-mix(in srgb,var(--brand) 35%,transparent);border-top-color:var(--brand)}
.coding-busy .txt{flex:1;min-width:0;font-size:12px;line-height:16px;color:var(--on-raised)}
/* 停止 = OutlinedButton：描边 + 主色前景、40dp 高、labelMedium */
.coding-busy .stop{flex:none;height:40px;padding:0 12px;border-radius:14px;
  border:1px solid var(--line);color:var(--brand);display:inline-flex;align-items:center;gap:4px;
  font-size:12px;line-height:16px;font-weight:500;transition:transform var(--t-fast) var(--ease)}
.coding-busy .stop:active{transform:scale(.97)}

/* 编码页的三个面板（工作区 / 会话 / 模型与权限）——InlineOverlay：页面内居中浮层，绝不开系统弹窗 */
.iov-scrim{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  padding:16px;background:rgba(0,0,0,.36);animation:fadeIn var(--t-fast) var(--ease) both}
/* Overlay32 + surfaceBase + 16dp 内边距 + 12dp 行距，maxWidth 460（fillHeight = true） */
.iov{width:100%;max-width:460px;height:100%;overflow-y:auto;background:var(--bg);
  border-radius:32px;padding:16px;display:flex;flex-direction:column;gap:12px;
  animation:sheetIn var(--t-slow) var(--ease) both}
@keyframes sheetIn{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.iov-head{display:flex;align-items:flex-start;gap:8px}
.iov-head .iht{flex:1;min-width:0}
.iov-head h3{margin:0;font-size:16px;line-height:24px;font-weight:600}
.iov-head p{margin:0;font-size:11px;line-height:16px;color:var(--on-raised);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iov-lbl{font-size:12px;line-height:16px;font-weight:500;color:var(--on-raised)}
/* ApprovalModeSegment：Chip10 容器（surfaceRaised + 4dp 内边距），选中项 primary 实底 */
.iov-seg{display:flex;gap:4px;padding:4px;border-radius:10px;background:var(--raised)}
.seg-chip{flex:1;padding:8px 0;border-radius:10px;font-size:12px;line-height:16px;font-weight:500;
  text-align:center;color:var(--on-raised);transition:background var(--t-fast)}
.seg-chip.on{background:var(--brand);color:var(--on-brand);font-weight:600}
.iov-hint{font-size:11px;line-height:16px;color:var(--on-raised)}
.iov-list{display:flex;flex-direction:column;gap:4px;max-height:320px;overflow-y:auto;flex:none}
.iov-list.model{max-height:300px}
.iov-list.sess{max-height:380px}
.irow{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;text-align:left;
  transition:background var(--t-fast)}
.irow:hover{background:var(--card)}
.irow.on{background:var(--raised)}
.irow .it{flex:1;min-width:0}
.irow b{display:block;font-size:14px;line-height:20px;font-weight:400;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow em{font-style:normal;display:block;font-size:11px;line-height:16px;color:var(--on-raised);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.irow .ic{color:var(--on-raised)}
.irow.on>.ic{color:var(--brand)}
/* 工作区条目：18dp 图标，选中态用 success（不是主色） */
.irow.ws .ic{width:18px;height:18px}
.irow.ws.on>.ic{color:var(--ok)}
.irow .del{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  color:var(--on-raised);flex:none;transition:background var(--t-fast)}
.irow .del:hover{background:var(--card)}
.iov-empty{display:flex;align-items:center;justify-content:center;height:180px;
  font-size:12px;line-height:16px;color:var(--on-raised)}
.iov-manual{display:flex;align-items:center;gap:8px}
.iov-manual input{flex:1;min-width:0;height:56px;background:transparent;border:1px solid var(--line);
  border-radius:12px;padding:0 12px;font-size:14px;line-height:20px}
.iov-manual input::placeholder{color:var(--on-raised)}
/* 使用 / 新建 = OutlinedButton：无底色 + 1dp 描边 + 主色文字，40dp 高、左右 12dp */
.iov-manual .btn{height:40px;padding:0 12px;background:transparent;border:1px solid var(--line);
  color:var(--brand);font-size:14px;line-height:20px;font-weight:500}
/* 主操作键不受上面那条淡描边规则影响：保存必须是实底 */
.iov-manual .btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:600}
/* 面板底部操作：OutlinedButton（新会话 / 从设备选择目录）与 TextButton（关闭） */
.iov-toggle{flex:none;height:40px;padding:0 12px;font-size:12px;line-height:16px;font-weight:500;
  color:var(--brand)}
.iov-btn{width:100%;height:40px;border-radius:14px;display:flex;align-items:center;
  justify-content:center;gap:4px;font-size:14px;line-height:20px;font-weight:500;color:var(--brand);
  transition:transform var(--t-fast) var(--ease)}
.iov-btn:active{transform:scale(.97)}
.iov-btn.outline{border:1px solid var(--line)}
.iov-close{width:100%;height:40px;border-radius:14px;font-size:14px;line-height:20px;font-weight:500;
  color:var(--brand)}

/* 会话图谱：中心工作区节点 + 环绕会话节点（Canvas 版 SessionGraph 的 HTML 复刻） */
.sess-graph{position:relative;height:300px;flex:none;border-radius:24px;overflow:hidden;
  background:color-mix(in srgb,var(--raised) 50%,transparent)}
.sess-graph svg{position:absolute;inset:0;width:100%;height:100%}
.sg-hint{position:absolute;left:8px;top:8px;font-size:9px;line-height:12px;color:var(--on-raised)}
.sg-core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:52px;height:52px;border-radius:99px;background:var(--bg);border:2px solid var(--brand);
  display:grid;place-items:center;font-size:10px;line-height:12px;color:var(--on-bg)}
.sg-node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;
  align-items:center;gap:3px;cursor:pointer}
.sg-dot{width:18px;height:18px;border-radius:99px;background:color-mix(in srgb,var(--on-raised) 55%,transparent)}
.sg-node.on .sg-dot{background:var(--brand);
  box-shadow:0 0 0 8px color-mix(in srgb,var(--brand) 22%,transparent)}
.sg-label{font-size:9px;line-height:12px;color:var(--on-bg);max-width:80px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============================================================
   设置：分区容器（对齐 SettingsDesign.kt 的 SettingsSection）
   —— 一个分区只有一个色相：6% 强调色底 + 15% 强调色描边 + 4×20 眉条
   ============================================================ */
.grp-label{padding:18px 4px 7px}
.grp-label b{display:block;font-size:12.5px;font-weight:600;letter-spacing:.2px}
.grp-label em{font-style:normal;display:block;font-size:11px;line-height:16px;color:var(--muted)}
.gcard{background:var(--card);border:1px solid var(--card-border);border-radius:24px;overflow:hidden}

.sec-box{
  border-radius:28px;overflow:hidden;margin:16px 0 0;padding-bottom:6px;
  background:color-mix(in srgb,var(--tone) 6%,transparent);
  border:1px solid color-mix(in srgb,var(--tone) 15%,transparent);
}
.tone-brand{--tone:var(--brand)}
.tone-cool{--tone:var(--cool)}
.tone-warm{--tone:var(--warm)}
.tone-neutral{--tone:var(--on-raised)}
.sec-box>.grp-label{
  display:grid;grid-template-columns:4px 1fr;column-gap:12px;
  align-items:start;padding:18px 18px 10px;
}
.sec-box>.grp-label::before{
  content:"";grid-row:1 / span 2;width:4px;height:20px;border-radius:99px;
  background:var(--tone);margin-top:1px;
}
.sec-box>.grp-label b{font-size:16px;line-height:24px;font-weight:700;letter-spacing:0}
.sec-box>.grp-label em{font-size:12px;line-height:16px;margin-top:2px}
.sec-box>.gcard{background:transparent;border:0;border-radius:0;overflow:visible}
.sec-box .sub-note{border:0;padding:2px 20px 14px}

.srow{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;text-align:left;
  position:relative;transition:background var(--t-fast)}
.srow+.srow::before{content:"";position:absolute;left:74px;right:16px;top:0;height:1px;
  background:color-mix(in srgb,var(--outline) 22%,transparent)}
.srow:hover{background:color-mix(in srgb,var(--on-bg) 4%,transparent)}
.srow .disc{width:44px;height:44px;border-radius:99px;display:grid;place-items:center;flex:none}
.srow .disc .ic{width:20px;height:20px}
.disc.brand{background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand)}
.disc.cool{background:color-mix(in srgb,var(--cool) 14%,transparent);color:var(--cool)}
.disc.warm{background:color-mix(in srgb,var(--warm) 14%,transparent);color:var(--warm)}
.disc.neutral{background:color-mix(in srgb,var(--on-raised) 14%,transparent);color:var(--on-raised)}
.srow .st{flex:1;min-width:0}
.srow b{display:block;font-size:16px;line-height:24px;font-weight:600}
.srow em{font-style:normal;display:block;font-size:12px;line-height:16px;margin-top:1px;color:var(--muted)}
.srow .sum{font-size:12px;color:var(--muted);max-width:118px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;flex:none}
.srow .chev{width:20px;height:20px;opacity:.45}
.frow{display:flex;align-items:center;gap:12px;padding:13px 18px;position:relative}
.frow+.frow::before{content:"";position:absolute;left:18px;right:18px;top:0;height:1px;
  background:color-mix(in srgb,var(--outline) 22%,transparent)}
.frow .ft{flex:1;min-width:0}
.frow b{display:block;font-size:14.5px;font-weight:600;line-height:20px}
.frow em{font-style:normal;display:block;font-size:12px;line-height:16px;color:var(--muted)}
.sub-note{padding:10px 14px;font-size:11px;line-height:16px;color:var(--muted);
  border-bottom:1px solid var(--hair)}
.sub-note:last-child{border-bottom:0}
.readiness{display:grid;grid-template-columns:1fr 1fr;background:var(--card);
  border:1px solid var(--card-border);border-radius:24px;overflow:hidden}
.readiness .rd{padding:14px 16px;border-right:1px solid var(--hair);display:flex;flex-direction:column;gap:5px}
.readiness .rd:last-child{border-right:0}
.readiness .rd span{font-size:12px;line-height:16px;color:var(--muted)}
.readiness .rd b{font-size:14px;line-height:20px;font-weight:500;display:flex;align-items:center;gap:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.readiness .rd b .dot{width:8px;height:8px}
.tabs-editor{display:flex;flex-direction:column;gap:6px}
.tab-edit{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;
  background:var(--card);border:1px solid var(--card-border)}
.tab-edit .nm{flex:1;font-size:12.5px;font-weight:600}
.tab-edit .mini{font-size:10px;color:var(--outline)}
.tab-edit .mv{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--muted);
  background:var(--sunken)}
.tab-edit .mv:disabled{opacity:.3}
.tab-edit .mv .ic{width:14px;height:14px}

/* 主题页：可选行（标准 / 无框线、四套配色）与磨砂样片 */
.optstack{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:12px 14px;border-radius:14px;background:var(--card);
  border:1px solid var(--card-border);
  transition:background var(--t-fast),border-color var(--t-fast),transform var(--t-fast) var(--ease);
}
.opt:active{transform:scale(.985)}
.opt.on{background:color-mix(in srgb,var(--brand) 14%,transparent);border:1.5px solid var(--brand)}
.opt .sw{
  width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:var(--card-2);border:1px solid var(--card-border);overflow:hidden;
}
.opt .sw.nobd{border-color:transparent}
.opt .sw .bar{width:50%;height:2px;border-radius:2px;
  background:color-mix(in srgb,var(--on-raised) 50%,transparent)}
.opt .dots{display:flex;gap:2px}
.opt .dots i{width:9px;height:9px;border-radius:99px;display:block}
.opt .ot{flex:1;min-width:0}
.opt b{display:block;font-size:13px;line-height:18px;font-weight:600}
.opt.on b{color:var(--brand)}
.opt em{display:block;font-style:normal;font-size:11.5px;line-height:16px;color:var(--muted);margin-top:2px}
.opt .ck{width:18px;height:18px;color:var(--brand);flex:none}

.glass-prev{
  position:relative;height:96px;border-radius:14px;overflow:hidden;margin:2px 0 12px;
  background:linear-gradient(90deg,#5FA0C9,#9AC98F,#E4B45C);
  display:flex;align-items:center;padding:0 14px;
}
.glass-prev .gp-txt b{display:block;font-size:12px;font-weight:600;color:#fff}
.glass-prev .gp-txt em{display:block;font-style:normal;font-size:10.5px;color:rgba(255,255,255,.8)}
.glass-prev .gp-glass{
  position:absolute;left:10px;right:10px;bottom:10px;height:44px;border-radius:14px;
  background:var(--glass);border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);
  display:flex;align-items:center;padding:0 14px;
}
.glass-prev .gp-glass span{font-size:12px;font-weight:600;color:var(--on-bg)}
.fld-lbl{display:block;font-size:11px;line-height:16px;color:var(--muted);margin:0 0 6px}
input[type="range"]{
  -webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;
}
input[type="range"]::-webkit-slider-runnable-track{
  height:4px;border-radius:2px;background:var(--line);
}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:99px;
  background:var(--brand);border:2px solid var(--bg);margin-top:-7px;
}

/* toast */
.toast{
  position:absolute;left:50%;bottom:calc(var(--clearance) + 22px);transform:translate(-50%,14px);
  z-index:80;padding:9px 16px;border-radius:14px;
  background:var(--glass-solid);border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  box-shadow:var(--shadow-soft);font-size:12px;color:var(--on-bg);
  opacity:0;pointer-events:none;transition:opacity var(--t-fast) var(--ease),transform var(--t-fast) var(--ease);
  max-width:372px;text-align:center;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* 桌面窗口只缩放整机，不改应用排版（无响应式）：device 由 JS 按窗口高度等比缩放 */
@media (max-width:600px){
  .stage{padding:0}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

/* ============================================================
   开屏引导（对齐 OnboardingScreen.kt / OnboardingPermissionScreen）
   两阶段整屏：欢迎 4 步 → 权限配置。只做自下而上的入场，不做横向滑动。
   ============================================================ */
.ob{
  position:absolute;inset:0;z-index:120;display:flex;flex-direction:column;
  background:var(--bg);overflow-y:auto;
  padding:12px 0 24px;
  animation:fadeIn var(--t-normal) linear both;
}
.ob-skip{display:flex;justify-content:flex-end;padding:8px 16px 0}
.ob-skip button{font-size:14px;line-height:20px;color:var(--on-raised);padding:10px 12px;border-radius:999px}
.ob-skip button:active{background:color-mix(in srgb,var(--on-bg) 6%,transparent)}
/* 中段：图标瓦片 + 标题 + 正文，整体竖直居中 */
.ob-body{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:0 24px;min-height:0}
.ob-tile{width:72px;height:72px;border-radius:14px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--brand) 14%,transparent);
  border:1px solid color-mix(in srgb,var(--brand) 25%,transparent);color:var(--brand)}
.ob-tile .ic{width:32px;height:32px}
/* 首步的品牌瓦片：与页眉同一条 BrandNavy → Accent 渐变 */
.ob-tile.brand{background:linear-gradient(135deg,#0A2E27,#0E7C66);border:0;color:#fff}
.ob h1{margin:16px 0 0;font-size:24px;line-height:32px;font-weight:600;text-align:center;letter-spacing:0}
.ob-body p{margin:12px 0 0;font-size:16px;line-height:24px;color:var(--on-raised);text-align:center}
/* 每段错开 60ms 自下而上浮入 */
.ob-in{animation:obIn var(--t-slow) var(--ease) both}
@keyframes obIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* 底部：进度点 + 主按钮 */
.ob-foot{flex:none;padding:16px 24px 8px;display:flex;flex-direction:column;align-items:center;gap:16px}
.ob-dots{display:flex;align-items:center;gap:6px}
.ob-dots i{display:block;height:6px;width:6px;border-radius:99px;
  background:color-mix(in srgb,var(--outline) 60%,transparent);
  transition:width var(--t-normal) var(--ease),background var(--t-normal)}
.ob-dots i.on{width:18px;background:var(--brand)}
.ob-main{
  width:100%;height:52px;border-radius:999px;background:var(--brand);color:var(--on-brand);
  font-size:16px;line-height:24px;font-weight:600;display:grid;place-items:center;
  transition:transform var(--t-fast) var(--ease);
}
.ob-main:active{transform:scale(.98)}
/* 权限阶段：品牌瓦片 64 + 统计胶囊 + 权限行（与权限雷达同一行视觉） */
.ob-perm{flex:none;display:flex;flex-direction:column;align-items:center;padding:0 24px}
.ob-tile.sm{width:64px;height:64px}
.ob-badge{display:inline-flex;align-items:center;gap:8px;margin-top:16px;
  padding:8px 14px;border-radius:999px;
  background:color-mix(in srgb,var(--ok) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--ok) 25%,transparent);color:var(--ok)}
.ob-badge.pend{background:color-mix(in srgb,var(--brand) 12%,transparent);
  border-color:color-mix(in srgb,var(--brand) 25%,transparent);color:var(--brand)}
.ob-badge .ic{width:16px;height:16px}
.ob-badge b{font-size:14px;line-height:20px;font-weight:600}
.ob-perms{display:flex;flex-direction:column;gap:10px;margin-top:16px;width:100%}
.ob-note{font-size:12px;line-height:16px;color:var(--on-raised);text-align:center;margin:0}

/* ============================================================
   协助浮层（对齐 AgentAssistSheet：Card24 + surfaceRaised + outlineSoft + padding16）
   ============================================================ */
.assist{
  border-radius:24px;background:var(--raised);border:1px solid var(--line);
  padding:16px;display:flex;flex-direction:column;margin-bottom:8px;
  animation:panelIn var(--t-fast) var(--ease) both;
}
.assist-head{display:flex;align-items:center;gap:4px;color:var(--brand)}
.assist-head .ic{width:16px;height:16px}
.assist-head b{font-size:14px;line-height:20px;font-weight:600;color:var(--on-bg)}
.assist-q{margin:8px 0 0;font-size:14px;line-height:20px;color:var(--on-bg)}
.assist-opts{display:flex;flex-direction:column;margin-top:12px}
/* 选项 = Tile14 + surfaceSunken + outlineSoft + padding12 */
.assist-opt{
  display:block;text-align:left;width:100%;margin:4px 0;
  border-radius:14px;background:var(--sunken);border:1px solid var(--line);padding:12px;
  transition:transform var(--t-fast) var(--ease);
}
.assist-opt:active{transform:scale(.98)}
.assist-opt b{display:block;font-size:14px;line-height:20px;font-weight:600;color:var(--on-bg)}
.assist-opt em{font-style:normal;display:block;margin-top:2px;font-size:12px;line-height:16px;
  color:var(--on-raised)}
.assist-input{margin-top:12px;border-radius:14px;background:var(--sunken);border:1px solid var(--line);
  padding:12px}
.assist-input textarea{width:100%;min-height:24px;max-height:96px;resize:none;border:0;
  background:transparent;font-size:14px;line-height:20px;color:var(--on-bg)}
.assist-input textarea::placeholder{color:var(--on-raised)}
.assist-foot{display:flex;align-items:center;margin-top:12px;gap:8px}
.assist-foot .grow{flex:1}
/* 出口按钮 = Chip10 */
.chip-btn{padding:8px 12px;border-radius:10px;font-size:12px;line-height:16px;font-weight:500;
  color:var(--on-bg);border:1px solid var(--line);background:transparent}
.chip-btn.primary{background:var(--brand);border:0;color:var(--on-brand);font-weight:600;padding:8px 16px}
.chip-btn.dim{background:var(--sunken);color:var(--on-raised);border:0}

/* ============================================================
   不可逆动作确认卡（对齐 PendingActionConfirmCard：AlertCard = errorContainer + Item20 + padding16）
   ============================================================ */
.confirm-card{
  border-radius:20px;background:var(--err-c);padding:16px;
  display:flex;flex-direction:column;
  animation:itemIn var(--t-slow) var(--ease) both;
}
.confirm-head{display:flex;align-items:center;gap:4px;color:var(--on-err-c)}
.confirm-head .ic{width:16px;height:16px}
.confirm-head b{font-size:14px;line-height:20px;font-weight:600}
.confirm-sum{margin:4px 0 0;font-size:14px;line-height:20px;font-weight:600;color:var(--on-err-c)}
.confirm-why{margin:4px 0 0;font-size:12px;line-height:16px;
  color:color-mix(in srgb,var(--on-err-c) 85%,transparent)}
.confirm-acts{display:flex;gap:8px;margin-top:12px}
.confirm-acts .abtn{flex:1;justify-content:center}
.confirm-acts .abtn.neutral{background:var(--sunken);color:var(--on-raised);border:1px solid var(--line)}

/* ============================================================
   语音录音浮层（对齐 VoiceRecordField 的 RecordingOverlay）
   底部蓝色光晕随音量呼吸 + 圆点声波条 + 白色提示
   ============================================================ */
.voice{
  position:absolute;inset:0;z-index:130;pointer-events:none;
  /* 录音时整屏压暗一层：源码是独立 Popup，底部导航与输入面都被它盖住 */
  background:linear-gradient(to bottom,
    color-mix(in srgb,var(--bg) 55%,transparent) 0%,
    color-mix(in srgb,var(--bg) 72%,transparent) 55%,
    color-mix(in srgb,var(--bg) 88%,transparent) 100%);
  animation:fadeIn 160ms linear both;
}
.voice::before{
  content:"";position:absolute;left:50%;bottom:0;width:144%;aspect-ratio:1/1;
  border-radius:50%;transform:translate(-50%,58%);
  background:radial-gradient(circle at 50% 50%,
    rgba(91,141,239,.92), rgba(91,141,239,.55) 34%, rgba(91,141,239,0) 62%);
  animation:voiceBreath 1.6s var(--ease-io) infinite alternate;
}
@keyframes voiceBreath{from{transform:translate(-50%,58%) scale(.94)}to{transform:translate(-50%,58%) scale(1.04)}}
.voice[data-zone="preview"]::before{background:radial-gradient(circle at 50% 50%,
  rgba(63,187,143,.92), rgba(63,187,143,.55) 34%, rgba(63,187,143,0) 62%)}
.voice[data-zone="cancel"]::before{background:radial-gradient(circle at 50% 50%,
  rgba(230,92,83,.92), rgba(230,92,83,.55) 34%, rgba(230,92,83,0) 62%)}
.voice-dots{position:absolute;left:50%;bottom:44px;
  transform:translateX(-50%);display:flex;align-items:center;gap:5px;height:26px}
.voice-dots i{display:block;width:4px;height:4px;border-radius:99px;background:#fff;
  animation:voiceDot 900ms var(--ease-io) infinite alternate}
@keyframes voiceDot{from{transform:scale(.5);opacity:.4}to{transform:scale(2.2);opacity:1}}
.voice-tip{position:absolute;left:0;right:0;bottom:96px;text-align:center;
  font-size:14px;line-height:20px;font-weight:500;color:#fff}
.voice-zone{position:absolute;bottom:200px;display:flex;flex-direction:column;align-items:center;gap:6px;
  width:96px;text-align:center;font-size:11px;line-height:16px;color:rgba(255,255,255,.86)}
.voice-zone.l{left:calc(50% - 112px);transform:translateX(-50%);pointer-events:auto;cursor:pointer}
.voice-zone.r{left:calc(50% + 112px);transform:translateX(-50%);pointer-events:auto;cursor:pointer}
.voice-zone .zi{width:34px;height:34px;border-radius:99px;display:grid;place-items:center;
  border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff}
.voice-zone.on .zi{background:rgba(255,255,255,.32);border-color:#fff}

/* ============================================================
   技能管理页（对齐 SkillManagerScreen：页签 + 操作条 + SkillCard）
   ============================================================ */
.skill-bar{display:flex;gap:8px;margin-top:12px}
.skill-bar .btn{flex:1;height:40px;padding:0 12px;border-radius:999px;font-size:14px;line-height:20px}
.skill-bar .btn.primary{background:var(--brand);color:var(--on-brand)}
.skill-bar .btn.outline{background:transparent;border:1px solid var(--line);color:var(--brand)}
.skill-tools{display:flex;gap:8px;margin-top:10px}
.skill-tools .btn{height:34px;padding:0 12px;border-radius:999px;font-size:12px;line-height:16px;
  background:transparent;border:1px solid var(--line);color:var(--on-bg);font-weight:500;
  white-space:nowrap}
.skill-tools .pill-btn{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:4px}
.sk-card{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:12px 14px;border-radius:20px;background:var(--card);border:1px solid var(--card-border);
  margin-top:10px;transition:transform var(--t-fast) var(--ease);
}
.sk-card:active{transform:scale(.985)}
.sk-card>.ic{width:22px;height:22px;flex:none;color:var(--brand)}
.sk-card.mcp>.ic{color:var(--warm)}
.sk-body{flex:1;min-width:0}
.sk-name{display:flex;align-items:center;gap:6px}
.sk-name b{font-size:16px;line-height:24px;font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
/* 批量管理勾选框：18dp 圆角方框，选中填主色 */
.cbx{width:20px;height:20px;border-radius:6px;flex:none;display:grid;place-items:center;
  border:1.5px solid color-mix(in srgb,var(--outline) 60%,transparent);color:var(--on-brand)}
.cbx.on{background:var(--brand);border-color:var(--brand)}
.cbx .ic{width:14px;height:14px}
.sk-desc{margin:0;font-size:12px;line-height:16px;color:var(--muted);
