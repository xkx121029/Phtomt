  <g stroke="#E2DFD7" stroke-width="1">
    <line x1="180" y1="46" x2="180" y2="162"/>
    <line x1="376" y1="46" x2="376" y2="162"/>
    <line x1="612" y1="46" x2="612" y2="162"/>
    <line x1="840" y1="46" x2="840" y2="162"/>
    <line x1="1028" y1="46" x2="1028" y2="162"/>
