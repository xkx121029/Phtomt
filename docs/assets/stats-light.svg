<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 208" width="1200" height="208" role="img" aria-label="Happy Phone Agent at a glance">
  <title>Happy Phone Agent · 项目数据</title>
  <defs>
    <pattern id="s-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0v20" fill="none" stroke="#EDEBE5" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="208" rx="18" fill="#F7F6F3"/>
  <rect width="1200" height="208" rx="18" fill="url(#s-grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="207" rx="18" fill="none" stroke="#E2DFD7"/>
  <rect x="0" y="0" width="6" height="208" fill="#0E7C66"/>

  <g font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,'Microsoft YaHei',sans-serif">
    <!-- 14 -->
    <g>
      <text x="56" y="112" font-size="52" font-weight="700" fill="#063A2E">14</text>
      <text x="56" y="146" font-size="14" font-weight="600" letter-spacing="2.4" fill="#656D66">MODULES</text>
    </g>
    <!-- 356 -->
    <g transform="translate(196 0)">
      <text x="40" y="112" font-size="52" font-weight="700" fill="#063A2E">356</text>
      <text x="40" y="146" font-size="14" font-weight="600" letter-spacing="2.4" fill="#656D66">KOTLIN FILES</text>
    </g>
    <!-- 91,003 -->
    <g transform="translate(392 0)">
      <text x="40" y="112" font-size="52" font-weight="700" fill="#063A2E">91,042</text>
      <text x="40" y="146" font-size="14" font-weight="600" letter-spacing="2.4" fill="#656D66">LINES OF CODE</text>
    </g>
    <!-- 1,287 -->
    <g transform="translate(628 0)">
