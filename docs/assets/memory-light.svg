<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Memory system">
  <title>Memory · 六类记忆</title>
  <rect width="1200" height="320" rx="18" fill="#F7F6F3"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="none" stroke="#E2DFD7"/>

  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif">
    <!-- 行 1 -->
    <rect x="40" y="40" width="360" height="96" rx="14" fill="#FFFFFF" stroke="#E2DFD7"/>
    <rect x="40" y="40" width="6" height="96" rx="3" fill="#0E7C66"/>
    <text x="68" y="74" font-size="15" font-weight="700" fill="#063A2E" letter-spacing="1.2">PROFILE</text>
    <text x="68" y="98" font-size="12" fill="#6D766F">preferences and habits</text>
    <text x="68" y="118" font-size="11" fill="#6A726B">MemoryStore · across tasks</text>

    <rect x="420" y="40" width="360" height="96" rx="14" fill="#FFFFFF" stroke="#E2DFD7"/>
    <rect x="420" y="40" width="6" height="96" rx="3" fill="#0E7C66"/>
    <text x="448" y="74" font-size="15" font-weight="700" fill="#063A2E" letter-spacing="1.2">AI MEMORY</text>
    <text x="448" y="98" font-size="12" fill="#6D766F">long-term facts, distilled at task end</text>
    <text x="448" y="118" font-size="11" fill="#6A726B">MemoryStore · deduplicated</text>

    <rect x="800" y="40" width="360" height="96" rx="14" fill="#FFFFFF" stroke="#E2DFD7"/>
    <rect x="800" y="40" width="6" height="96" rx="3" fill="#C6B183"/>
    <text x="828" y="74" font-size="15" font-weight="700" fill="#063A2E" letter-spacing="1.2">RULES</text>
    <text x="828" y="98" font-size="12" fill="#6D766F">scoped by foreground-app counts</text>
    <text x="828" y="118" font-size="11" fill="#6A726B">EvolvedRule</text>

    <!-- 行 2 -->
    <rect x="40" y="152" width="360" height="96" rx="14" fill="#FFFFFF" stroke="#E2DFD7"/>
    <rect x="40" y="152" width="6" height="96" rx="3" fill="#C6B183"/>
    <text x="68" y="186" font-size="15" font-weight="700" fill="#063A2E" letter-spacing="1.2">ANOMALY</text>
    <text x="68" y="210" font-size="12" fill="#6D766F">past handling of page anomalies</text>
    <text x="68" y="230" font-size="11" fill="#6A726B">AnomalyMemoryEngine · reused on hit</text>

    <rect x="420" y="152" width="360" height="96" rx="14" fill="#FFFFFF" stroke="#E2DFD7"/>
    <rect x="420" y="152" width="6" height="96" rx="3" fill="#0E7C66"/>
    <text x="448" y="186" font-size="15" font-weight="700" fill="#063A2E" letter-spacing="1.2">TASK</text>
    <text x="448" y="210" font-size="12" fill="#6D766F">goal · steps · verified methods</text>
    <text x="448" y="230" font-size="11" fill="#6A726B">task_memory · capacity 30</text>

    <rect x="800" y="152" width="360" height="96" rx="14" fill="#FFFFFF" stroke="#E2DFD7"/>
    <rect x="800" y="152" width="6" height="96" rx="3" fill="#5FD9B4"/>
    <text x="828" y="186" font-size="15" font-weight="700" fill="#063A2E" letter-spacing="1.2">PAGE</text>
    <text x="828" y="210" font-size="12" fill="#6D766F">control tree + hotspots per screen</text>
    <text x="828" y="230" font-size="11" fill="#6A726B">drawn as a wireframe phone</text>

    <g stroke="#D6D2C6" stroke-width="1.4" fill="none">
      <circle cx="40" cy="286" r="7"/>
      <circle cx="76" cy="286" r="7"/>
    </g>
    <circle cx="76" cy="286" r="4" fill="#5FD9B4"/>
    <text x="98" y="291" font-size="12" fill="#6A726B">Remembered controls are marked on screen with faint rings that never block touch.</text>
  </g>
</svg>
