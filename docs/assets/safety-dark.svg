<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 292" width="1200" height="292" role="img" aria-label="Safety gates">
  <title>Safety · 动作通过的五道闸</title>
  <rect width="1200" height="292" rx="18" fill="#0C1412"/>
  <rect x="0.5" y="0.5" width="1199" height="291" rx="18" fill="none" stroke="#1E2A25"/>

  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif">
    <rect x="32" y="106" width="164" height="78" rx="14" fill="#0F3D31"/>
    <rect x="32.5" y="106.5" width="163" height="77" rx="13.5" fill="none" stroke="#1E4C40"/>
    <text x="114" y="140" font-size="14" font-weight="700" fill="#F1F4F1" text-anchor="middle" letter-spacing="1.2">ACTION</text>
    <text x="114" y="162" font-size="11" fill="#8FA79C" text-anchor="middle">from the AI</text>

    <line x1="196" y1="145" x2="1156" y2="145" stroke="#26332D" stroke-width="2" stroke-dasharray="2 8"/>

    <g>
      <rect x="216" y="88" width="164" height="114" rx="12" fill="#101A17" stroke="#1E2A25"/>
      <rect x="216" y="88" width="164" height="5" rx="2.5" fill="#5FD9B4"/>
      <text x="298" y="122" font-size="13" font-weight="700" fill="#F1F4F1" text-anchor="middle">SENSITIVE PAGE</text>
      <text x="298" y="144" font-size="11" fill="#8B9A93" text-anchor="middle">payment · password</text>
      <text x="298" y="162" font-size="11" fill="#7E8D86" text-anchor="middle">read-only</text>
      <text x="298" y="184" font-size="11" fill="#7E8D86" text-anchor="middle">5 strikes → stop</text>
    </g>
    <g>
      <rect x="404" y="88" width="164" height="114" rx="12" fill="#101A17" stroke="#1E2A25"/>
      <rect x="404" y="88" width="164" height="5" rx="2.5" fill="#5FD9B4"/>
      <text x="486" y="122" font-size="13" font-weight="700" fill="#F1F4F1" text-anchor="middle">REDACTION</text>
      <text x="486" y="144" font-size="11" fill="#8B9A93" text-anchor="middle">ID · bank · phone</text>
      <text x="486" y="162" font-size="11" fill="#7E8D86" text-anchor="middle">longest first</text>
      <text x="486" y="184" font-size="11" fill="#7E8D86" text-anchor="middle">DataSanitizer</text>
    </g>
    <g>
      <rect x="592" y="88" width="164" height="114" rx="12" fill="#101A17" stroke="#1E2A25"/>
      <rect x="592" y="88" width="164" height="5" rx="2.5" fill="#C6B183"/>
      <text x="674" y="122" font-size="13" font-weight="700" fill="#F1F4F1" text-anchor="middle">CONFIRM</text>
      <text x="674" y="144" font-size="11" fill="#8B9A93" text-anchor="middle">irreversible moves</text>
      <text x="674" y="162" font-size="11" fill="#7E8D86" text-anchor="middle">120 s → cancel</text>
      <text x="674" y="184" font-size="11" fill="#7E8D86" text-anchor="middle">needsUserConfirmation</text>
    </g>
    <g>
      <rect x="780" y="88" width="164" height="114" rx="12" fill="#101A17" stroke="#1E2A25"/>
      <rect x="780" y="88" width="164" height="5" rx="2.5" fill="#5FD9B4"/>
      <text x="862" y="122" font-size="13" font-weight="700" fill="#F1F4F1" text-anchor="middle">IDEMPOTENCY</text>
      <text x="862" y="144" font-size="11" fill="#8B9A93" text-anchor="middle">evidence on page</text>
      <text x="862" y="162" font-size="11" fill="#7E8D86" text-anchor="middle">skip repeated</text>
      <text x="862" y="184" font-size="11" fill="#7E8D86" text-anchor="middle">submit · pay · delete</text>
    </g>
    <g>
      <rect x="968" y="88" width="164" height="114" rx="12" fill="#101A17" stroke="#1E2A25"/>
      <rect x="968" y="88" width="164" height="5" rx="2.5" fill="#5FD9B4"/>
      <text x="1050" y="122" font-size="13" font-weight="700" fill="#F1F4F1" text-anchor="middle">SECRETS</text>
      <text x="1050" y="144" font-size="11" fill="#8B9A93" text-anchor="middle">encrypted at rest</text>
      <text x="1050" y="162" font-size="11" fill="#7E8D86" text-anchor="middle">SecretCodec</text>
      <text x="1050" y="184" font-size="11" fill="#7E8D86" text-anchor="middle">before DataStore</text>
    </g>

    <path d="M1136 145 l12 0" stroke="#5FD9B4" stroke-width="2"/>
    <text x="32" y="256" font-size="12" fill="#7E8D86">Action mode decides which requests the AI may even make; these gates decide what happens once one arrives.</text>
  </g>
</svg>
