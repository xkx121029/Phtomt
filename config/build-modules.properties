# ===========================================================================
# 可选构建模块开关（由根 build.gradle.kts 读取，说明见 docs/build-modules.md）
#
# 规则：
#   - 每个模块只控制自己的附加任务，不参与 build / check / assemble 的任务图，
#     因此无论开启还是关闭，默认构建流程的行为与耗时都不变。
#   - 关闭的模块任务仍可调用，执行时只打印“已禁用”提示并正常结束（退出码 0），
#     方便 CI 用同一串任务名跑不同配置。
#   - 命令行优先级最高，可在不改文件的情况下临时覆盖：
#       .\gradlew buildModules -Phpa.modules.vue.enabled=true
#
# 取值只能是 true / false；写错会在配置阶段直接报错（避免开关静默失效）。
# ===========================================================================

# --- 模块开关 ---------------------------------------------------------------

# Android 平台构建：环境校验（JDK 17+ / SDK 36 / Wrapper）与 Debug APK 时间戳归档。
# 注意：Android 应用本身的编译打包由 AGP 提供，不受此开关影响。
hpa.modules.android.enabled=true

# Vue 开发服务器：官网（website/）依赖安装、开发服务器、静态构建。
hpa.modules.vue.enabled=false

# Git 版本控制工具链：仓库状态、构建信息落盘（分支 / 提交 / 脏标记）。
hpa.modules.git.enabled=false

# GitHub 仓库关联与同步：远程配置校验、关联（改名/改地址）、显式推送。
hpa.modules.github.enabled=false

# --- 模块参数（可选，留空即使用默认值） -------------------------------------

# Android APK 归档目录（相对项目根目录，也可写绝对路径）
hpa.modules.android.archiveDir=build/apk-archive

# Vue 工程目录与开发脚本名（对应 website/package.json 的 scripts）
hpa.modules.vue.dir=website
hpa.modules.vue.devScript=dev:web

# Git 构建信息输出文件
hpa.modules.git.output=build/build-info/git-info.json

# GitHub 远程名（git remote 的条目名，不是 URL）
hpa.modules.github.remote=github
